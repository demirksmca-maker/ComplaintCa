<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Peri Avatar Test</title>
<style>
  :root{--navy:#0f2952;--ice:#17253f;--text:#e9edf5;--gold:#c9a84c;--blue:#4d8ee8}
  *{box-sizing:border-box}
  body{margin:0;background:#0e1015;color:var(--text);font-family:-apple-system,'Segoe UI',Inter,sans-serif;
    padding:18px 16px 40px;max-width:430px;margin-inline:auto}
  h2{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#8991a3;margin:26px 0 10px;font-weight:600}

  /* avatar */
  .av{position:relative;width:var(--s,44px);height:var(--s,44px);border-radius:50%;flex:none;overflow:hidden;
    border:1.5px solid var(--gold);background:#16295a;
    box-shadow:0 0 0 0 rgba(201,168,76,.5);animation:ring 3s ease-in-out infinite,bob 4s ease-in-out infinite}
  .av img{position:absolute;width:330%;left:-121%;top:-128%;max-width:none}
  .av::after{content:'';position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);
    transform:translateX(-120%);animation:shine 4.5s 1s ease-in-out infinite}
  .av.pop{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both,ring 3s 1s ease-in-out infinite,bob 4s 1s ease-in-out infinite}
  .av.busy{animation:ring 1s ease-in-out infinite,bob .8s ease-in-out infinite}
  @keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.45)}50%{box-shadow:0 0 0 6px rgba(201,168,76,0),0 0 14px 2px rgba(201,168,76,.55)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  @keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
  @keyframes pop{0%{opacity:0;transform:scale(.2) rotate(-12deg)}100%{opacity:1;transform:scale(1) rotate(0)}}

  /* sizes row */
  .sizes{display:flex;align-items:flex-end;gap:18px;padding:16px;border-radius:14px;background:#141824}
  .sizes span{display:block;text-align:center;font-size:.6rem;color:#8991a3;margin-top:6px}

  /* FAB like the site's ASYA pill */
  .fab{display:inline-flex;align-items:center;gap:8px;background:#0f2952;border:1.5px solid var(--gold);
    border-radius:50px;padding:5px 16px 5px 5px;box-shadow:0 3px 12px rgba(15,41,82,.5);
    color:#fff;font-weight:700;font-size:.72rem;letter-spacing:.08em}

  /* chat */
  .chat{background:#0c1526;border:1px solid #1d2a45;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:9px;align-items:flex-end}
  .bub{background:var(--ice);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:.84rem;line-height:1.45;max-width:78%}
  .me{align-self:flex-end;background:var(--navy);border-radius:14px 14px 4px 14px;padding:9px 12px;font-size:.84rem;max-width:78%}
  .m1{animation:in .5s .6s both}.m2{animation:in .5s 1.6s both}.m3{animation:in .5s 3.2s both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .dots{display:inline-flex;gap:4px;padding:3px 0}
  .dots i{width:6px;height:6px;border-radius:50%;background:#8aa0c8;animation:dt 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes dt{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

  /* header bar */
  .bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#141824}
  .bar b{font-size:.9rem}.bar small{display:block;color:#6fd3a0;font-size:.66rem}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<h2>1 · Sizes</h2>
<div class="sizes">
  <div><div class="av pop" style="--s:28px"><img src="/assets/brand/peri.png?v=3" alt=""></div><span>28</span></div>
  <div><div class="av pop" style="--s:36px"><img src="/assets/brand/peri.png?v=3" alt=""></div><span>36</span></div>
  <div><div class="av pop" style="--s:48px"><img src="/assets/brand/peri.png?v=3" alt=""></div><span>48</span></div>
  <div><div class="av pop" style="--s:72px"><img src="/assets/brand/peri.png?v=3" alt=""></div><span>72</span></div>
</div>

<h2>2 · ASYA button</h2>
<div class="fab"><div class="av" style="--s:30px"><img src="/assets/brand/peri.png?v=3" alt=""></div>ASYA</div>

<h2>3 · Chat header</h2>
<div class="bar">
  <div class="av" style="--s:40px"><img src="/assets/brand/peri.png?v=3" alt=""></div>
  <div><b>Asya</b><small>● online</small></div>
</div>

<h2>4 · Chat</h2>
<div class="chat">
  <div class="row m1"><div class="av" style="--s:34px"><img src="/assets/brand/peri.png?v=3" alt=""></div>
    <div class="bub">Hi, I'm Asya. Tell me what happened and I'll find the right place to send it.</div></div>
  <div class="me m2">My landlord won't return my deposit.</div>
  <div class="row m3"><div class="av busy" style="--s:34px"><img src="/assets/brand/peri.png?v=3" alt=""></div>
    <div class="bub"><span class="dots"><i></i><i></i><i></i></span></div></div>
</div>

</body>
</html>
