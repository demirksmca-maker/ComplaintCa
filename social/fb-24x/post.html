<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#061021;--card:#0a1830;--ink:#eaf1fb;--mute:#8aa0bd;--line:#1c3558;--edge:#2a5b9a;--ok:#3ddc97;--s1:#3987e5;--bad:#ff5a52}
*{box-sizing:border-box}
body{margin:0;width:1080px;height:1080px;font-family:-apple-system,'Segoe UI',Roboto,Inter,sans-serif;color:var(--ink);background:radial-gradient(120% 60% at 50% 0,#0d2547 0,var(--bg) 70%);padding:56px 64px;display:flex;flex-direction:column;gap:24px}
.card{background:linear-gradient(180deg,#0c1d38,var(--card));border:1px solid var(--line);border-radius:22px;box-shadow:inset 0 1px 0 rgba(120,170,240,.06)}
.head{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:40px;font-weight:800;letter-spacing:.5px}.brand span{color:var(--s1)}
.live{display:flex;align-items:center;gap:12px;font-size:24px;color:var(--ok);border:1px solid #1d5a49;background:#0b2a26;padding:10px 20px;border-radius:30px;font-weight:700;letter-spacing:1px}
.live i{width:14px;height:14px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px var(--ok)}
.hero{padding:36px 44px}
.lbl{font-size:22px;color:var(--mute);letter-spacing:3px;text-transform:uppercase;font-weight:700}
.big{font-size:170px;font-weight:900;line-height:1;margin:8px 0 6px;background:linear-gradient(90deg,#3987e5,#3ddc97);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(61,220,151,.25))}
.sub{font-size:38px}.sub b{color:var(--ok)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.tile{padding:28px 32px}.tile .v{font-size:64px;font-weight:800;margin-top:6px}.tile .v small{font-size:28px;color:var(--mute);font-weight:600}
.chart{padding:26px 32px 18px;flex:1;display:flex;flex-direction:column}
.chart svg{flex:1}
.foot{display:flex;justify-content:space-between;font-size:26px;color:var(--mute)}.foot b{color:var(--ink)}
</style></head><body>
<div class="head"><div class="brand">🍁 Complaint<span>CA</span></div><div class="live"><i></i>GROWTH REPORT</div></div>
<div class="card hero"><div class="lbl">Monthly unique visitors</div><div class="big">24×</div><div class="sub">growth in <b>under 4 months</b></div></div>
<div class="tiles">
<div class="card tile"><div class="lbl">Now</div><div class="v">1,000+ <small>/ month</small></div></div>
<div class="card tile"><div class="lbl">Launched</div><div class="v">Jul 6 <small>2026</small></div></div>
</div>
<div class="card chart"><svg viewBox="0 0 900 230" preserveAspectRatio="none">
<defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="1" stop-color="#3ddc97"/></linearGradient>
<linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ddc97" stop-opacity=".28"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/></linearGradient></defs>
<g stroke="#1c3558" stroke-width="1.5"><line x1="0" y1="20" x2="900" y2="20"/><line x1="0" y1="90" x2="900" y2="90"/><line x1="0" y1="160" x2="900" y2="160"/><line x1="0" y1="225" x2="900" y2="225"/></g>
<path d="M10 220 C280 216 480 196 620 150 S830 40 885 18 L885 225 L10 225Z" fill="url(#f)"/>
<path d="M10 220 C280 216 480 196 620 150 S830 40 885 18" fill="none" stroke="url(#l)" stroke-width="6" stroke-linecap="round" style="filter:drop-shadow(0 0 8px rgba(61,220,151,.6))"/>
<circle cx="885" cy="18" r="10" fill="#3ddc97" stroke="#eaf1fb" stroke-width="3"/>
</svg><div class="foot"><span>Jul 2026 · 1×</span><span><b>Oct 2026 · 24×</b></span></div></div>
<div class="foot"><span>Your complaint. Your right. 🇨🇦</span><b>complaintca.ca</b></div>
</body></html>
