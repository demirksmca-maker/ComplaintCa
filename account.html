<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="google" content="notranslate">
<title>My Account — ComplaintCA</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#cfb0e8;--gold2:#cfb0e8;--cream:#ddc6ef;--mute:#a9b0c4;--red:#d52b1e}
*{box-sizing:border-box}
html{background:#380a31}
body{margin:0;min-height:100vh;color:#f2eef6;text-align:center;font-family:-apple-system,'Segoe UI',Inter,system-ui,sans-serif;
  background:radial-gradient(75% 40% at 50% 18%,#4e165c 0%,#3d0b35 60%,#260721 100%) fixed}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 26px) 18px 44px}

/* Head: everything on the centre line, like the complaint panel */
.kicker{font:700 1.05rem/1 'Cinzel',Georgia,serif;letter-spacing:.42em;padding-left:.42em;color:var(--cream)}
.emblem{display:block;width:190px;height:190px;margin:22px auto 6px;border-radius:50%;object-fit:cover;
  -webkit-mask-image:radial-gradient(circle,#000 58%,transparent 72%);mask-image:radial-gradient(circle,#000 58%,transparent 72%);
  filter:drop-shadow(0 0 22px rgba(207,176,232,.35))}
.name{position:relative;width:max-content;margin:6px auto 0;padding:6px 0 6px .42em;font:700 1.9rem/1 'Cinzel',Georgia,serif;letter-spacing:.42em;color:#fff;animation:sirenTxt 6.4s linear infinite}
.name::before,.name::after{content:"";position:absolute;top:-22px;bottom:-22px;width:72%;border-radius:50%;z-index:-1;filter:blur(16px);opacity:0}
.name::before{left:-20%;background:radial-gradient(closest-side,#972fff,rgba(151,47,255,.5) 55%,transparent);animation:sirenB 6.4s linear infinite}
.name::after{right:-20%;background:radial-gradient(closest-side,#ff2d78,rgba(255,45,120,.5) 55%,transparent);animation:sirenR 6.4s linear infinite}
@keyframes sirenB{0%,4%{opacity:.9}12%,16%{opacity:.08}20%,26%{opacity:.9}34%,100%{opacity:.08}}
@keyframes sirenR{0%,48%{opacity:.08}50%,54%{opacity:.9}62%,66%{opacity:.08}70%,76%{opacity:.9}84%,100%{opacity:.08}}
@keyframes sirenTxt{0%,26%{text-shadow:-3px 0 10px #a44aff,0 0 28px #972fff}34%,48%{text-shadow:0 0 4px rgba(255,255,255,.5)}50%,76%{text-shadow:3px 0 10px #ff4f93,0 0 28px #ff2d78}84%,100%{text-shadow:0 0 4px rgba(255,255,255,.5)}}
@media (prefers-reduced-motion:reduce){.name,.name::before,.name::after{animation:none}}
.seal{width:84px;height:84px;margin:22px auto 0;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff,#f1f1f1 60%,#d9d9d9);box-shadow:0 0 0 3px var(--gold),0 0 0 6px rgba(213,43,30,.85),0 8px 22px rgba(0,0,0,.5)}
.seal svg{width:62%;height:62%}
.title{margin:22px 0 4px;font:700 1.35rem/1.1 'Cinzel',Georgia,serif;letter-spacing:.22em;padding-left:.22em;color:var(--cream)}
.since{font:italic 1rem 'EB Garamond',Georgia,serif;color:var(--gold2)}
.rule{height:1.5px;margin:20px 30px;background:linear-gradient(90deg,transparent,var(--gold) 25%,#cfb0e8 50%,var(--gold) 75%,transparent)}
.sec{font:700 .66rem/1 'Cinzel',Georgia,serif;letter-spacing:.34em;padding-left:.34em;color:var(--gold2);margin:26px 0 16px}

/* Complaints as medals: gold rim, icon, a ribbon in the status colour */
.medals{display:flex;justify-content:center;flex-wrap:wrap;gap:26px}
.medal{position:relative;width:118px;background:none;border:0;padding:0;color:inherit;cursor:pointer}
.ribbon{width:46px;height:34px;margin:0 auto -6px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.r-reply{background:repeating-linear-gradient(90deg,#1d7a52 0 8px,#5fe0a0 8px 12px)}
.r-sent{background:repeating-linear-gradient(90deg,#5a2088 0 8px,#cfb0e8 8px 12px)}
.r-closed{background:repeating-linear-gradient(90deg,#3a4256 0 8px,#8a92a6 8px 12px)}
.disc{position:relative;width:96px;height:96px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,#d4b7ea,#cfb0e8 45%,#5a2088 100%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.18),inset 0 0 0 9px rgba(90,32,136,.55),0 8px 20px rgba(0,0,0,.5)}
.disc::after{content:"";position:absolute;inset:13px;border-radius:50%;border:1.5px dashed rgba(57,13,50,.45)}
.disc svg{width:38px;height:38px;color:#3a0d32}
.medal.on .disc{box-shadow:inset 0 0 0 4px rgba(255,255,255,.18),inset 0 0 0 9px rgba(90,32,136,.55),0 0 0 3px #efe4f7,0 0 26px rgba(207,176,232,.6)}
.pip{position:absolute;top:4px;right:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#fff;
  background:radial-gradient(circle at 35% 30%,#b8473a,#7e2219 70%);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.medal b{display:block;margin-top:10px;font:700 .62rem/1.2 'Cinzel',Georgia,serif;letter-spacing:.14em;color:var(--cream)}
.medal small{display:block;margin-top:4px;font:italic .9rem 'EB Garamond',Georgia,serif;color:var(--gold2)}

/* The opened record: centred parchment */
.record{display:none;margin:26px auto 0;max-width:440px;padding:22px 20px 18px;border-radius:6px;color:#2b1427;font-family:'EB Garamond',Georgia,serif;
  background:radial-gradient(120% 80% at 20% 10%,rgba(255,255,255,.35),transparent 60%),repeating-linear-gradient(0deg,rgba(59,21,89,.035) 0 1px,transparent 1px 4px),linear-gradient(180deg,#e0cbf0,#cfb0e8);
  box-shadow:inset 0 0 0 1px #cfb2e6,inset 0 0 0 4px #e0cbf0,inset 0 0 0 5px rgba(96,40,140,.55),0 12px 28px rgba(0,0,0,.45)}
.record.show{display:block;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.rec-h{font:700 .62rem/1 'Cinzel',Georgia,serif;letter-spacing:.32em;padding-left:.32em;color:#53227a}
.rec-t{margin:8px 0 2px;font-size:1.25rem;font-weight:600}
.rec-ref{font-style:italic;color:#53346b}
.path{display:flex;justify-content:center;align-items:center;margin:18px 0}
.node{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 .72rem 'Cinzel',Georgia,serif;border:1.5px solid rgba(83,34,122,.45);color:#53227a;background:#dac1ed}
.node.done{border:0;color:#2b1427;background:radial-gradient(circle at 35% 30%,#cfb0e8,#cfb1e7)}
.node.now{border:0;color:#f6dccb;background:radial-gradient(circle at 35% 30%,#b8473a,#7e2219 70%)}
.link{width:34px;height:2px;background:rgba(83,34,122,.35)}.link.done{background:#cfb1e7}
.labels{display:flex;justify-content:center;gap:12px;font:700 .5rem/1 'Cinzel',Georgia,serif;letter-spacing:.12em;color:#53227a;margin:-8px 0 16px}
.labels span{width:52px}
.quote{font-size:1.05rem;line-height:1.5;margin:0 0 6px}
.quote::before{content:"“";font:700 2rem/0 'Cinzel',Georgia,serif;color:#8a2a1f;vertical-align:-.45em;margin-right:4px}
.from{font-style:italic;color:#53346b;font-size:.9rem}
.acts{display:flex;justify-content:center;gap:10px;margin-top:16px}
.btn{border-radius:999px;padding:10px 16px;font:700 .62rem/1 'Cinzel',Georgia,serif;letter-spacing:.14em;cursor:pointer;border:1px solid #cfb2e6;background:transparent;color:#5b1e14}
.btn.gold{border:0;color:#190616;background:linear-gradient(180deg,#cfb0e8,#cfb0e8)}

/* Honours: badges earned by using the platform */
.honours{display:flex;justify-content:center;gap:18px}
.hon{width:74px}
.hon i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto;border-radius:50%;font-style:normal;font-size:1.3rem;
  background:radial-gradient(circle at 35% 28%,#fff,#e9e9e9 60%,#cfcfcf);box-shadow:0 0 0 2px var(--gold),0 0 0 4px rgba(213,43,30,.8)}
.hon.off i{filter:grayscale(1) brightness(.45);box-shadow:0 0 0 2px #4a5266}
.hon small{display:block;margin-top:8px;font:700 .5rem/1.3 'Cinzel',Georgia,serif;letter-spacing:.1em;color:var(--cream)}
.hon.off small{color:#6f7891}

.cta{display:inline-block;margin-top:30px;padding:14px 30px;border-radius:999px;border:0;font:700 .72rem/1 'Cinzel',Georgia,serif;letter-spacing:.2em;color:#190616;background:linear-gradient(180deg,#cfb0e8,#cfb0e8);box-shadow:0 8px 20px rgba(0,0,0,.4);cursor:pointer}
.foot{margin-top:26px;color:var(--mute);font-size:.74rem;line-height:1.8}
.foot a{color:var(--mute)}
.demo{margin-top:14px;color:#6f7891;font-size:.68rem}

/* Lapel pin: knurled gold rim, cream enamel ring with lettering, red enamel centre with a gold maple leaf */
.pin-slot{margin:20px auto 0;width:150px;height:150px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.pin{width:100%;height:100%;display:block}

/* Opening scene (3 s) */
.intro{position:fixed;inset:0;z-index:50;background:#0f030d;display:grid;place-items:center;overflow:hidden;transition:opacity .6s ease}
.intro.out{opacity:0;pointer-events:none}
.intro::before,.intro::after{content:"";position:absolute;left:0;right:0;height:11vh;background:#000;z-index:3;transition:transform .8s ease}
.intro::before{top:0}.intro::after{bottom:0}
.intro.play::before{transform:translateY(-30%)}.intro.play::after{transform:translateY(30%)}
.spot{position:absolute;inset:0;background:radial-gradient(38% 30% at 50% 46%,rgba(225,205,240,.22),transparent 70%);opacity:0;transition:opacity 1s ease}
.intro.play .spot{opacity:1}
.stage{position:relative;z-index:2;text-align:center;perspective:900px}
.stage .pin{width:230px;height:230px;margin:0 auto;opacity:0;transform:rotateY(100deg) scale(.55);filter:drop-shadow(0 14px 26px rgba(0,0,0,.7))}
.intro.play .stage .pin{animation:pinIn 1.5s cubic-bezier(.2,.8,.2,1) .25s forwards}
@keyframes pinIn{0%{opacity:0;transform:rotateY(100deg) scale(.55)}60%{opacity:1}100%{opacity:1;transform:rotateY(0) scale(1)}}
.shine{position:absolute;left:50%;top:0;width:230px;height:230px;margin-left:-115px;border-radius:50%;overflow:hidden;pointer-events:none}
.shine::after{content:"";position:absolute;top:-20%;left:-60%;width:40%;height:140%;transform:rotate(20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);opacity:0}
.intro.play .shine::after{animation:sweep .7s ease-in-out 1.6s forwards}
@keyframes sweep{0%{left:-60%;opacity:1}100%{left:130%;opacity:1}}
.who{margin-top:22px;font:700 1.1rem/1 'Cinzel',Georgia,serif;letter-spacing:.5em;padding-left:.5em;color:var(--cream);opacity:0;transform:translateY(8px);transition:all .6s ease 1.9s}
.intro.play .who{opacity:1;transform:none}
.tap{position:relative;z-index:4;margin-top:30px;padding:14px 26px;border-radius:999px;border:1px solid rgba(207,176,232,.5);background:rgba(255,255,255,.04);color:var(--cream);font:700 .7rem/1 'Cinzel',Georgia,serif;letter-spacing:.24em;cursor:pointer}
.intro.play .tap{display:none}
.skip{position:absolute;right:16px;bottom:calc(11vh + 12px);z-index:4;background:none;border:0;color:#6f7891;font-size:.72rem;cursor:pointer}

/* Simple head: title left, emblem right */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.head .kicker{font-size:.7rem;letter-spacing:.38em;padding-left:0}
.head .title{margin:8px 0 4px;font-size:1.25rem;padding-left:0}
.head .since{font-size:.92rem}
.head .emblem{width:96px;height:96px;margin:0;flex:none}
/* One line per complaint; the record opens below on tap */
#records{border-top:1px solid rgba(207,176,232,.22);text-align:left}
.rr{border-bottom:1px solid rgba(207,176,232,.22)}
.rr-sum{width:100%;display:flex;align-items:center;gap:10px;padding:15px 2px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.rr-txt{flex:1;min-width:0}
.rr-txt b{display:block;color:var(--cream);font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-txt small{display:block;margin-top:3px;color:var(--mute);font-size:.74rem}
.rr-new{flex:none;width:9px;height:9px;border-radius:50%;background:#ff5a6e;box-shadow:0 0 8px #ff5a6e}
.pill{flex:none;font:700 .5rem/1 'Cinzel',Georgia,serif;letter-spacing:.12em;padding:5px 8px;border-radius:999px;border:1px solid currentColor}
.p-reply{color:#5fe0a0}.p-sent{color:var(--gold)}.p-closed{color:var(--mute)}
.rr-chev{flex:none;color:var(--gold2);transition:transform .25s}
.rr.open .rr-chev{transform:rotate(180deg)}
.rr-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.rr.open .rr-body{grid-template-rows:1fr}
.rr-body>div{overflow:hidden}
.rr .record{display:block;margin:0 0 16px;padding:16px 16px 14px;text-align:center}
.rr .path{margin:4px 0 14px}

.intro[hidden]{display:none}
a.btn,a.cta{text-decoration:none;display:inline-block}
.login{max-width:420px;margin:30px auto 0;padding:22px 20px;border-radius:18px;border:1px solid rgba(207,176,232,.3);background:rgba(255,255,255,.03);text-align:center}
.login h2{margin:0 0 8px;font:700 1rem/1.3 'Cinzel',Georgia,serif;letter-spacing:.1em;color:var(--cream)}
.login p{margin:0 0 14px;color:var(--mute);font-size:.88rem;line-height:1.5}
.in{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(207,176,232,.3);border-radius:10px;color:#fff;padding:12px;font-size:1rem;margin:0 0 10px}
.gbtn{width:100%;border:0;border-radius:999px;padding:13px;font:700 .7rem/1 'Cinzel',Georgia,serif;letter-spacing:.16em;color:#190616;background:linear-gradient(180deg,#cfb0e8,#cfb0e8);cursor:pointer}
.gbtn:disabled{opacity:.6}
.err{color:#ff8a98;font-size:.84rem;min-height:1.2em;margin:10px 0 0}
.empty{color:var(--mute);font-style:italic;padding:18px 0}
.tag{font:700 .5rem/1 'Cinzel',Georgia,serif;letter-spacing:.12em;color:#ff8a98;margin-left:6px}
.rr .quote{white-space:pre-wrap}
.langs{margin-top:10px}
.langs select{background:transparent;border:1px solid rgba(207,176,232,.3);border-radius:8px;color:var(--mute);padding:4px 8px;font-size:.74rem}
.langs option{background:#3d0b35}
html[dir=rtl] .head,html[dir=rtl] #records{text-align:right}
</style>
</head>
<body translate="no">
<div class="intro" id="intro" hidden>
  <div class="spot"></div>
  <div class="stage">
    <svg class="pin" id="pinIntro" viewBox="0 0 200 200" aria-hidden="true"></svg>
    <div class="shine"></div>
    <div class="who" id="who"></div>
    <button class="tap" id="tap" type="button"></button>
  </div>
  <button class="skip" id="skip" type="button"></button>
</div>
<div class="wrap">
  <header class="head">
    <div class="head-t">
      <div class="kicker" data-t="kicker"></div>
      <div class="title" data-t="title"></div>
      <div class="since" id="since"></div>
    </div>
    <a href="/"><img class="emblem" src="/demo/asya/emblem.webp" alt="ComplaintCA"></a>
  </header>
  <div class="rule"></div>

  <section class="login" id="login">
    <h2 data-t="si_t"></h2>
    <p data-t="si_i"></p>
    <input class="in" id="em" type="email" autocomplete="email" placeholder="you@example.com">
    <button class="gbtn" id="send" type="button" data-t="send"></button>
    <div id="codeBox" hidden>
      <p id="sentMsg" style="margin:14px 0 10px"></p>
      <input class="in" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
      <button class="gbtn" id="openBtn" type="button" data-t="open"></button>
    </div>
    <p class="err" id="err" role="status"></p>
  </section>

  <section id="panel" hidden>
    <div id="records"></div>
    <div class="sec" data-t="bsec"></div>
    <div class="honours" id="honours"></div>
    <a class="cta" href="/?go=new" data-t="newc"></a>
  </section>

  <div class="foot">
    <span id="who2"></span>
    <div><a href="/guides/free-legal-help-canada-guide.html" data-t="legal"></a><span id="soWrap" hidden> · <a href="#" id="signout" data-t="signout"></a></span></div>
    <div class="langs"><select id="lang" aria-label="Language">
      <option value="en">English</option><option value="fr">Français</option><option value="tr">Türkçe</option><option value="zh">中文</option><option value="es">Español</option><option value="ar">العربية</option><option value="pa">ਪੰਜਾਬੀ</option>
    </select></div>
  </div>
</div>

<script>

// ---- Piano intro (7 s), synthesised with Web Audio: no audio files ----
function playPiano(){
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ac = new AC(), now = ac.currentTime + 0.05;
  const master = ac.createGain(); master.gain.setValueAtTime(0.0001, now); master.gain.exponentialRampToValueAtTime(1.8, now + 0.08);
  master.gain.setValueAtTime(1.8, now + 6.2); master.gain.exponentialRampToValueAtTime(0.0001, now + 7);
  // Small hall: a decaying-noise impulse response
  const rev = ac.createConvolver(), len = ac.sampleRate * 2.4, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  rev.buffer = ir;
  const wet = ac.createGain(); wet.gain.value = 0.32; const dry = ac.createGain(); dry.gain.value = 0.75;
  const tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 3200;
  tone.connect(dry); tone.connect(rev); rev.connect(wet); dry.connect(master); wet.connect(master); master.connect(ac.destination);
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  function note(midi, t, vel = 0.22, len = 3){
    [[1, 1], [2, 0.35], [3, 0.12], [4, 0.06]].forEach(([h, a]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = h === 1 ? 'triangle' : 'sine'; o.frequency.value = hz(midi) * h; o.detune.value = (h - 1) * 1.5;
      g.gain.setValueAtTime(0.0001, now + t); g.gain.exponentialRampToValueAtTime(vel * a, now + t + 0.006);
      g.gain.exponentialRampToValueAtTime(vel * a * 0.35, now + t + 0.35); g.gain.exponentialRampToValueAtTime(0.0001, now + t + len / h);
      o.connect(g); g.connect(tone); o.start(now + t); o.stop(now + t + len + 0.1);
    });
  }
  // D – Bm – G – A – D, a slow arpeggio that resolves at 5.6 s
  const bars = [[50, [62, 66, 69, 74]], [47, [62, 66, 71, 74]], [43, [62, 67, 71, 74]], [45, [61, 64, 69, 73]]];
  bars.forEach(([bass, up], b) => { const t = b * 1.4; note(bass, t, 0.26, 3.2); note(bass + 12, t, 0.12, 3); up.forEach((n, i) => note(n, t + 0.18 + i * 0.27, 0.17, 2.6)); });
  [50, 57, 62, 66, 69, 74, 78].forEach((n, i) => note(n, 5.6 + i * 0.03, i < 2 ? 0.22 : 0.15, 1.6));
}

  $('since').textContent = T.since.replace('{n}', list.length).replace('{r}', replies);
  $('records').innerHTML = list.length ? list.map(record).join('') : '<p class="empty">' + esc(T.empty) + '</p>';
  const provs = new Set(list.map(c => (c.place.match(/\b(ON|BC|AB|QC|MB|SK|NS|NB|PE|NL|YT|NT|NU)\b/i) || [])[1]).filter(Boolean).map(x => x.toUpperCase()));
  const earned = [list.length > 0, replies > 0, list.some(c => c.step === 3), provs.size >= 3];
  $('honours').innerHTML = ['✒️', '✉️', '⚖️', '🍁'].map((e, i) => '<div class="hon' + (earned[i] ? '' : ' off') + '"><i>' + e + '</i><small>' + T.badges[i] + '</small></div>').join('');
  $('who2').textContent = mask(EMAIL);
}
document.addEventListener('click', e => { const s = e.target.closest('.rr-sum'); if (s) s.parentElement.classList.toggle('open'); });

// ---- Sign-in: e-mail code (same 30-day pass as the complaint form) ----
const PASS_KEY = 'cc_mail_pass';
const savedPass = () => { try { const o = JSON.parse(localStorage.getItem(PASS_KEY) || 'null'); return o && o.e && +String(o.p).split('.')[0] > Date.now() ? o : null; } catch (e) { return null; } };
let tok = '';
async function load(email, pass){
  const d = await post('/api/my', { email, pass });
  if (!d._ok) { if (d.error === 'email_unverified') { try { localStorage.removeItem(PASS_KEY); } catch (e) {} } return d; }
  DATA = d; EMAIL = email;
  $('login').hidden = true; $('panel').hidden = false; $('soWrap').hidden = false;
  render(); return d;
}
$('send').onclick = async () => {
  const m = $('em').value.trim().toLowerCase(); $('err').textContent = '';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) return;
  $('send').disabled = true;
  const d = await post('/api/email-code', { action:'send', email:m }).catch(() => ({}));
  $('send').disabled = false;
  if (!d._ok) { $('err').textContent = d.error === 'cooldown' ? T.cd : T.err; return; }
  tok = d.token; $('codeBox').hidden = false; $('sentMsg').textContent = T.sent.replace('{e}', m); $('code').focus();
};
$('openBtn').onclick = async () => {
  const m = $('em').value.trim().toLowerCase(), c = $('code').value.trim(); $('err').textContent = '';
  $('openBtn').disabled = true;
  const d = await post('/api/email-code', { action:'check', email:m, code:c, token:tok }).catch(() => ({}));
  if (!d._ok || !d.pass) { $('openBtn').disabled = false; $('err').textContent = d.error === 'cooldown' ? T.cd : T.bad; return; }
  try { localStorage.setItem(PASS_KEY, JSON.stringify({ e:m, p:d.pass })); } catch (e) {}
  const r = await load(m, d.pass); $('openBtn').disabled = false;
  if (!r._ok) { $('err').textContent = T.err; return; }
  firstVisitScene();
};
$('signout').onclick = e => { e.preventDefault(); try { localStorage.removeItem(PASS_KEY); } catch (x) {} location.reload(); };

// ---- Opening scene: once per device, right after the first sign-in ----
function firstVisitScene(){
  let seen = false; try { seen = localStorage.getItem('cc_intro_seen') === '1'; } catch (e) {}
  if (seen) return;
  try { localStorage.setItem('cc_intro_seen', '1'); } catch (e) {}
  $('who').textContent = mask(EMAIL); $('intro').hidden = false;
}
const intro = $('intro');
function endIntro(){ intro.classList.add('out'); setTimeout(() => { intro.hidden = true; }, 700); }
$('tap').onclick = () => { intro.classList.add('play'); try { playPiano(); } catch (e) {} setTimeout(endIntro, 3000); };
$('skip').onclick = endIntro;

applyLang();
const sp = savedPass();
if (sp) { $('em').value = sp.e; load(sp.e, sp.p).then(r => { if (!r._ok && r.error !== 'email_unverified') $('err').textContent = r.error === 'cooldown' ? T.cd : T.err; }); }
</script>
</body>
