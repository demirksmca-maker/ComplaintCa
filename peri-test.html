<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Peri Test</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 35%,#16295a 0%,#0a1530 60%,#050b1c 100%);
    font-family:'Cinzel',serif}
  .stage{position:relative;width:min(74vw,300px);aspect-ratio:560/940;
    -webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent);
    opacity:0;animation:pop 1.5s .2s cubic-bezier(.2,1.3,.4,1) forwards,float 5s 1.7s ease-in-out infinite}
  .stage img{position:absolute;inset:0;width:100%;height:100%;display:block}
  .base{animation:glow 3s 1.7s ease-in-out infinite}
  .wl,.wr{animation:flap .9s 1.7s ease-in-out infinite alternate}
  .wl{clip-path:polygon(0 2%,40% 2%,40% 43%,0 43%);transform-origin:36% 40%}
  .wr{clip-path:polygon(66% 2%,100% 2%,100% 42%,76% 42%,66% 36%);transform-origin:68% 38%;animation-direction:alternate-reverse}
  .sw{-webkit-mask-image:linear-gradient(100deg,transparent 58%,#000 64%,#000 88%,transparent 92%);
    mask-image:linear-gradient(100deg,transparent 58%,#000 64%,#000 88%,transparent 92%);
    -webkit-mask-size:100% 52%;mask-size:100% 52%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    mix-blend-mode:screen;animation:hue 3.5s 1.7s linear infinite}
  .ad{margin-top:14px;font-size:2rem;color:#d4af37;letter-spacing:.08em;
    clip-path:inset(0 100% 0 0);animation:yaz 1.6s 1.8s steps(11,end) forwards;
    text-shadow:0 0 14px rgba(212,175,55,.5)}
  .sp{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;
    background:#fff;box-shadow:0 0 8px 2px rgba(255,220,120,.9);opacity:0;
    animation:spark var(--d) var(--t) ease-out infinite}
  @keyframes pop{0%{opacity:0;transform:scale(.25) rotate(-10deg);filter:blur(14px)}
    60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1) rotate(0);filter:blur(0)}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-14px) rotate(1deg)}}
  @keyframes glow{50%{filter:drop-shadow(0 0 16px rgba(255,210,90,.75)) brightness(1.08)}}
  @keyframes flap{from{transform:rotate(-3deg) scaleX(.985)}to{transform:rotate(3deg) scaleX(1.015)}}
  @keyframes hue{from{filter:hue-rotate(0) brightness(1.4) saturate(1.5)}to{filter:hue-rotate(360deg) brightness(1.4) saturate(1.5)}}
  @keyframes yaz{to{clip-path:inset(0 0 0 0)}}
  @keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.3)}
    20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2)}}
  @media (prefers-reduced-motion:reduce){.stage,.base,.wl,.wr,.sw,.sp{animation:none!important}.stage{opacity:1}.ad{animation:none;clip-path:none}}
</style>
</head>
<body>
  <div class="stage" id="st">
    <img class="base" src="/assets/brand/peri.png" alt="">
    <img class="wl" src="/assets/brand/peri.png" alt="">
    <img class="wr" src="/assets/brand/peri.png" alt="">
    <img class="sw" src="/assets/brand/peri.png" alt="">
  </div>
  <div class="ad">ComplaintCA</div>
<script>
(function(){
  var r=document.getElementById('st').getBoundingClientRect(),n=34;
  for(var i=0;i<n;i++){
    var s=document.createElement('i');s.className='sp';
    s.style.left=(r.left+r.width*(.1+Math.random()*.8))+'px';
    s.style.top=(r.top+r.height*(.05+Math.random()*.8))+'px';
    s.style.setProperty('--x',(Math.random()*120-60)+'px');
    s.style.setProperty('--y',(-30-Math.random()*110)+'px');
    s.style.setProperty('--d',(1.6+Math.random()*2)+'s');
    s.style.setProperty('--t',(.4+Math.random()*3)+'s');
    document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
