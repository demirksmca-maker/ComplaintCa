<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dias Claude</title>
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/shield-manifest.json">
<meta name="theme-color" content="#21061d">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>
  /* Owner's Claude work panel: same tokens, title strip and toolbar as the
     Dias Panel (/shield.html), with a message list and a large composer.
     Sending hands the task to Claude through /api/shield?task (a GitHub
     issue that Claude Code answers) and shows its reply here. */
  :root{color-scheme:dark;--bg:#21061d;--card:#300a2a;--ink:#f2eafb;--mute:#a38abd;--line:#4c1c58;--edge:#842a9a;--ok:#3ddc97;--s1:#8f39e5;--gold:#e7b955}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:radial-gradient(120% 60% at 50% 0,#470d3e 0,var(--bg) 70%) var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,Inter,sans-serif;line-height:1.5;overflow:hidden}
  main{height:100dvh;max-width:920px;margin:0 auto;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 16px 0}
  button{font:inherit;border:0;border-radius:10px;cursor:pointer;color:inherit}
  .head{display:flex;align-items:center;justify-content:center;gap:10px;padding:2px 0 10px}
  .head svg{width:30px;height:34px;filter:drop-shadow(0 0 6px var(--ok))}
  .head h1{font-size:1.05rem;font-weight:600}
  .head small{display:block;font-size:.75rem;color:var(--mute)}
  .ptitle{flex:none;text-align:center;font-size:.95rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:9px 10px;border:1px solid var(--edge);border-radius:12px;background:linear-gradient(180deg,#481256,#380b31);box-shadow:0 0 14px rgba(143,57,229,.18)}
  .card{background:linear-gradient(180deg,#380c31,var(--card));border:1px solid var(--line);border-radius:14px}

  .log{flex:1;min-height:0;overflow-y:auto;padding:14px 2px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:11px 14px;font-size:.95rem;white-space:pre-wrap;word-wrap:break-word}
  .msg.me{align-self:flex-end;background:linear-gradient(180deg,#5d176f,#4b1259);border:1px solid var(--edge);border-radius:14px 14px 4px 14px}
  .msg.sys{align-self:flex-start;border-radius:14px 14px 14px 4px;color:var(--mute);font-size:.85rem}
  .msg time a{color:var(--mute)}
  .msg time{display:block;font-size:.68rem;color:var(--mute);margin-top:4px}
  .welcome{margin:auto 0;text-align:center;padding:22px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .welcome b{font-size:1.15rem}
  .welcome p{color:var(--mute);font-size:.88rem;max-width:520px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chips button{background:var(--card);border:1px solid var(--line);padding:8px 12px;font-size:.82rem;color:var(--ink)}
  .chips button:hover{border-color:var(--edge)}

  .composer{flex:none;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
  .composer textarea{width:100%;min-height:120px;max-height:45vh;resize:none;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:1rem;line-height:1.5}
  .composer:focus-within{border-color:var(--edge);box-shadow:0 0 0 1px var(--edge),0 0 16px rgba(143,57,229,.18)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .bar small{color:var(--mute);font-size:.72rem}
  .send{background:linear-gradient(135deg,#cfb0e8,#cfb1e7);color:#520f47;font-weight:700;padding:9px 18px}
  .send:disabled{opacity:.45;cursor:default}
  .clear{background:none;color:var(--mute);font-size:.72rem;text-decoration:underline;padding:0}

  .bar-nav{flex:none;display:grid;grid-template-columns:repeat(7,1fr);max-width:480px;width:100%;margin:0 auto;border-top:1px solid var(--edge);background:#2a0825;padding:6px 8px max(6px,env(safe-area-inset-bottom))}
  .bar-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.68rem;color:var(--mute);text-decoration:none}
  .bar-nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bar-nav a[aria-current="page"]{color:var(--ink);font-weight:600}.bar-nav a[aria-current="page"] svg{stroke:var(--s1)}
  .navwrap{flex:none;margin:0 -16px;background:#2a0825;border-top:1px solid var(--edge)}
  .navwrap .bar-nav{border-top:0}
</style>
</head>
<body>
<main>
  <header class="head">
    <svg viewBox="0 0 150 170" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b76fff"/><stop offset=".5" stop-color="#771dd1"/><stop offset="1" stop-color="#4c0b5c"/></linearGradient></defs><path d="M75 8 L132 30 V82 C132 120 106 146 75 160 C44 146 18 120 18 82 V30 Z" fill="url(#sg)" stroke="#3ddc97" stroke-width="5"/><path d="M52 84 L68 100 L100 64" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><h1>Dias · Claude</h1><small>complaintca.ca çalışma paneli</small></div>
  </header>
  <h2 class="ptitle">Claude çalışma paneli</h2>

  <section class="log" id="log" aria-live="polite"></section>

  <form class="card composer" id="form">
    <textarea id="text" placeholder="Claude'a ne yapmasını istiyorsun? Örn: Huni sekmesine haftalık özet ekle, testleri çalıştır, canlıya al." aria-label="Mesaj"></textarea>
    <div class="bar">
      <small>Ctrl / ⌘ + Enter ile gönder · <button type="button" class="clear" id="clear">geçmişi temizle</button></small>
      <button type="submit" class="send" id="send" disabled>Gönder</button>
    </div>
  </form>

  <div class="navwrap"><nav class="bar-nav" aria-label="Bölümler">
    <a href="/shield.html#home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Genel</a>
    <a href="/shield.html#traffic"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Trafik</a>
    <a href="/shield.html#funnel"><svg viewBox="0 0 24 24"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>Huni</a>
    <a href="/shield.html#google"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Google</a>
    <a href="/shield.html#security"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>Güvenlik</a>
    <a href="/dias-claude.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg>Claude</a>
    <a href="/social/admin.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".5"/></svg>Paylaşım</a>
  </nav></div>
</main>
<script>
(function () {
  var KEY = 'diasClaudeLog';
  var IDEAS = ['Paneli kontrol et, hata var mı bak', 'Testleri çalıştır ve canlıya al', 'AXX1 kontrolü yap', 'Blog için yeni rehber taslağı yaz'];
  var $ = function (id) { return document.getElementById(id); };
  // History stays in this browser only; it is a convenience, not a record.
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list.slice(-100))); } catch (e) { /* private mode */ } }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function when(t) { return new Date(t).toLocaleString('tr-TR', { timeZone: 'America/Toronto', dateStyle: 'short', timeStyle: 'short' }); }
  var log = load();

  function render() {
    $('log').innerHTML = log.length ? log.map(function (m) {
      return '<div class="msg ' + (m.me ? 'me' : 'sys card') + '">' + esc(m.text) + '<time>' + esc(when(m.t)) + (m.url ? ' · <a href="' + esc(m.url) + '" target="_blank" rel="noopener">GitHub</a>' : '') + '</time></div>';
    }).join('') : '<div class="welcome"><b>Merhaba 👋 Ne yapalım?</b><p>Yaz, gönder; Claude işi ayrı bir dalda yapar, PR linkini verir ve ilerlemesini burada yazar. Panelden çıkmana gerek yok.</p>' +
      '<div class="chips">' + IDEAS.map(function (x) { return '<button type="button">' + esc(x) + '</button>'; }).join('') + '</div></div>';
    Array.prototype.forEach.call(document.querySelectorAll('.chips button'), function (b) {
      b.addEventListener('click', function () { $('text').value = b.textContent; sync(); $('text').focus(); });
    });
    $('log').scrollTop = $('log').scrollHeight;
  }
  function sync() { $('send').disabled = !$('text').value.trim(); }

  function key() { try { return localStorage.getItem('shieldKey') || ''; } catch (e) { return ''; } }
  function api(q, init) {
    init = init || {}; init.cache = 'no-store';
    init.headers = { 'x-shield-key': key(), 'Content-Type': 'application/json' };
    return fetch('/api/shield?task=' + q, init).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || r.status); return d; }); });
  }

  // Claude works through a GitHub issue; its progress comment is shown here, so the owner never leaves the panel.
  function send() {
    var text = $('text').value.trim();
    if (!text) return;
    var me = { me: true, text: text, t: Date.now() }, sys = { me: false, text: 'Claude\'a gönderiliyor…', t: Date.now() };
    log.push(me, sys); save(log); $('text').value = ''; sync(); render();
    api('1', { method: 'POST', body: JSON.stringify({ text: text }) }).then(function (d) {
      sys.task = d.number; sys.url = d.url; sys.text = 'Gönderildi (#' + d.number + '). Claude işe başlayınca cevabı burada görünecek.';
    }).catch(function (e) {
      sys.text = 'Gönderilemedi (' + e.message + '). Genel sekmesinde panel anahtarın girili mi?';
    }).then(function () { sys.t = Date.now(); save(log); render(); });
  }

  function poll() {
    log.forEach(function (m) {
      if (!m.task || m.done) return;
      api(m.task).then(function (d) {
        if (!d.reply || d.reply.text === m.text) return;
        m.text = d.reply.text; m.t = Date.parse(d.reply.at) || Date.now();
        // The action marks its comment finished with "Claude finished"; stop polling then.
        if (/Claude finished|Claude encountered an error/i.test(m.text)) m.done = true;
        save(log); render();
      }).catch(function () { /* try again next round */ });
    });
  }
  setInterval(function () { if (!document.hidden) poll(); }, 20000);

  $('text').addEventListener('input', sync);
  $('text').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
  $('form').addEventListener('submit', function (e) { e.preventDefault(); send(); });
  $('clear').addEventListener('click', function () { if (log.length && confirm('Geçmiş silinsin mi?')) { log = []; save(log); render(); } });
  render(); poll();
})();
</script>
</body>
</html>
