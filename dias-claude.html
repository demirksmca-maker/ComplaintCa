<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dias Claude</title>
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/shield-manifest.json">
<meta name="theme-color" content="#21061d">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>
  /* Owner's Claude work panel: same tokens, title strip and toolbar as the
     Dias Panel (/shield.html), with a message list and a large composer.
     Sending copies the message and opens Claude Code until a direct link
     to a session is added. */
  :root{color-scheme:dark;--bg:#21061d;--card:#300a2a;--ink:#f2eafb;--mute:#a38abd;--line:#4c1c58;--edge:#842a9a;--ok:#3ddc97;--s1:#8f39e5;--gold:#e7b955}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:radial-gradient(120% 60% at 50% 0,#470d3e 0,var(--bg) 70%) var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,Inter,sans-serif;line-height:1.5;overflow:hidden}
  main{height:100dvh;max-width:920px;margin:0 auto;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 16px 0}
  button{font:inherit;border:0;border-radius:10px;cursor:pointer;color:inherit}
  .head{display:flex;align-items:center;justify-content:center;gap:10px;padding:2px 0 10px}
  .head svg{width:30px;height:34px;filter:drop-shadow(0 0 6px var(--ok))}
  .head h1{font-size:1.05rem;font-weight:600}
  .head small{display:block;font-size:.75rem;color:var(--mute)}
  .ptitle{flex:none;text-align:center;font-size:.95rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:9px 10px;border:1px solid var(--edge);border-radius:12px;background:linear-gradient(180deg,#481256,#380b31);box-shadow:0 0 14px rgba(143,57,229,.18)}
  .card{background:linear-gradient(180deg,#380c31,var(--card));border:1px solid var(--line);border-radius:14px}

  .log{flex:1;min-height:0;overflow-y:auto;padding:14px 2px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:11px 14px;font-size:.95rem;white-space:pre-wrap;word-wrap:break-word}
  .msg.me{align-self:flex-end;background:linear-gradient(180deg,#5d176f,#4b1259);border:1px solid var(--edge);border-radius:14px 14px 4px 14px}
  .msg.sys{align-self:flex-start;border-radius:14px 14px 14px 4px;color:var(--mute);font-size:.85rem}
  .msg time{display:block;font-size:.68rem;color:var(--mute);margin-top:4px}
  .welcome{margin:auto 0;text-align:center;padding:22px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .welcome b{font-size:1.15rem}
  .welcome p{color:var(--mute);font-size:.88rem;max-width:520px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chips button{background:var(--card);border:1px solid var(--line);padding:8px 12px;font-size:.82rem;color:var(--ink)}
  .chips button:hover{border-color:var(--edge)}

  .composer{flex:none;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
  .composer textarea{width:100%;min-height:120px;max-height:45vh;resize:none;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:1rem;line-height:1.5}
  .composer:focus-within{border-color:var(--edge);box-shadow:0 0 0 1px var(--edge),0 0 16px rgba(143,57,229,.18)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .bar small{color:var(--mute);font-size:.72rem}
  .send{background:linear-gradient(135deg,#cfb0e8,#cfb1e7);color:#520f47;font-weight:700;padding:9px 18px}
  .send:disabled{opacity:.45;cursor:default}
  .agent{background:linear-gradient(135deg,#3ddc97,#2bb47a);color:#08291b;font-weight:700;padding:9px 14px}
  .agent:disabled{opacity:.45;cursor:default}
  .acts{display:flex;gap:8px}
  .msg.bot{align-self:flex-start;border-radius:14px 14px 14px 4px;font-size:.9rem;border-color:#2bb47a}
  .msg.bot.ask{border-color:var(--gold)}
  .msg.bot.secret{border-color:var(--gold);background:#3a2a0a;user-select:all}
  .live{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px;margin-bottom:8px}
  .live-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--mute)}
  .live-head b{color:#ff6b6e;letter-spacing:.5px}
  .live-view{position:relative;height:min(46vh,460px);display:flex;justify-content:center;background:#12030f;border-radius:10px;overflow:hidden}
  .live-view img{height:100%;width:auto;max-width:100%;object-fit:contain;cursor:pointer;touch-action:manipulation}
  .live-wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:.85rem;text-align:center;padding:16px}
  .live-tools{display:flex;gap:6px;flex-wrap:wrap}
  .live-tools input{flex:1;min-width:0;background:transparent;border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:.85rem;padding:7px 9px}
  .live-tools button{background:var(--card);border:1px solid var(--line);padding:6px 10px;font-size:.8rem}
  .live-tools .kill{border-color:#e5484d;color:#ff8a8d;font-weight:700}
  .live[hidden],.live-wait[hidden]{display:none}
  .live-msg{font-size:.85rem;padding:7px 10px;border:1px solid #2bb47a;border-radius:10px;white-space:pre-wrap;max-height:5.5em;overflow-y:auto}
  .live-msg.ask,.live-msg.secret{border-color:var(--gold)}
  .live-msg.secret{user-select:all}
  .live-msg:empty{display:none}
  .acts button{white-space:nowrap}
  body.cloud .composer textarea{min-height:52px}
  @media (max-height:760px){.live-view{height:min(38vh,400px)}}
  .clear{background:none;color:var(--mute);font-size:.72rem;text-decoration:underline;padding:0}

  .bar-nav{flex:none;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));max-width:480px;width:100%;margin:0 auto;border-top:1px solid #842a9a;background:#2a0825;padding:6px 8px max(6px,env(safe-area-inset-bottom));font-family:-apple-system,'Segoe UI',Roboto,Inter,sans-serif}
  .bar-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.62rem;letter-spacing:-.2px;white-space:nowrap;color:#a38abd;text-decoration:none}
  .bar-nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bar-nav a[aria-current="page"]{color:#f2eafb;font-weight:600}.bar-nav a[aria-current="page"] svg{stroke:#8f39e5}
  .navwrap{flex:none;margin:0 -16px;background:#2a0825;border-top:1px solid var(--edge)}
  .navwrap .bar-nav{border-top:0}
</style>
</head>
<body>
<main>
  <header class="head">
    <svg viewBox="0 0 150 170" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b76fff"/><stop offset=".5" stop-color="#771dd1"/><stop offset="1" stop-color="#4c0b5c"/></linearGradient></defs><path d="M75 8 L132 30 V82 C132 120 106 146 75 160 C44 146 18 120 18 82 V30 Z" fill="url(#sg)" stroke="#3ddc97" stroke-width="5"/><path d="M52 84 L68 100 L100 64" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><h1>Dias · Claude</h1><small>complaintca.ca çalışma paneli</small></div>
  </header>
  <h2 class="ptitle">Claude çalışma paneli</h2>

  <section class="log" id="log" aria-live="polite"></section>

  <section class="card live" id="live" hidden aria-label="Bulut tarayıcı canlı ekran">
    <div class="live-head"><span><b>● CANLI</b> · <span id="liveUrl">bulut Chrome</span></span><span id="liveLeft"></span></div>
    <div class="live-view"><img id="shot" alt="Bulut tarayıcının ekranı; dokunduğun yere tıklanır"><div class="live-wait" id="liveWait">☁️ Bulut Chrome açılıyor…</div></div>
    <div class="live-msg" id="liveMsg" aria-live="polite"></div>
    <div class="live-tools">
      <input id="liveType" placeholder="Sayfaya yaz (dokunduğun kutuya)" aria-label="Sayfaya yaz" autocomplete="off">
      <button type="button" data-key="Enter" aria-label="Enter">↵</button>
      <button type="button" data-key="Backspace" aria-label="Sil">⌫</button>
      <button type="button" data-dy="-500" aria-label="Yukarı kaydır">▲</button>
      <button type="button" data-dy="500" aria-label="Aşağı kaydır">▼</button>
      <button type="button" class="kill" id="liveStop">■ Dur</button>
    </div>
  </section>

  <form class="card composer" id="form">
    <textarea id="text" placeholder="Claude'a ne yapmasını istiyorsun? Örn: Huni sekmesine haftalık özet ekle, testleri çalıştır, canlıya al." aria-label="Mesaj"></textarea>
    <div class="bar">
      <small>Ctrl / ⌘ + Enter ile gönder · <button type="button" class="clear" id="clear">geçmişi temizle</button><span id="agentbar" hidden> · <button type="button" class="clear" id="stop">ajanı durdur</button></span></small>
      <span class="acts"><button type="button" class="agent" id="agent" disabled>☁️ Bulutta yap</button><button type="submit" class="send" id="send" disabled>Gönder</button></span>
    </div>
  </form>

  <div class="navwrap"><nav class="bar-nav" aria-label="Bölümler">
    <a href="/shield.html#home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Genel</a>
    <a href="/shield.html#traffic"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Trafik</a>
    <a href="/shield.html#funnel"><svg viewBox="0 0 24 24"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>Huni</a>
    <a href="/shield.html#google"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Google</a>
    <a href="/shield.html#security"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>Güvenlik</a>
    <a href="/dias-claude.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg>Claude</a>
    <a href="/shield.html#site"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></svg>Site</a>
    <a href="/social/admin.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".5"/></svg>Paylaşım</a>
  </nav></div>
</main>
<script>
(function () {
  var KEY = 'diasClaudeLog', CODE = 'https://claude.ai/code';
  var IDEAS = ['Paneli kontrol et, hata var mı bak', 'Testleri çalıştır ve canlıya al', 'AXX1 kontrolü yap', 'Blog için yeni rehber taslağı yaz'];
  var $ = function (id) { return document.getElementById(id); };
  // History stays in this browser only; it is a convenience, not a record.
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  // Generated passwords (m.secret) are shown but never written to storage.
  function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list.filter(function (m) { return !m.secret; }).slice(-100))); } catch (e) { /* private mode */ } }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function when(t) { return new Date(t).toLocaleString('tr-TR', { timeZone: 'America/Toronto', dateStyle: 'short', timeStyle: 'short' }); }
  var log = load();

  function render() {
    $('log').innerHTML = log.length ? log.map(function (m) {
      return '<div class="msg ' + (m.me ? 'me' : m.bot ? 'bot card' + (m.ask ? ' ask' : '') + (m.secret ? ' secret' : '') : 'sys card') + '">' + esc(m.text) + '<time>' + esc(when(m.t)) + '</time></div>';
    }).join('') : '<div class="welcome"><b>Merhaba 👋 Ne yapalım?</b><p>Yaz, gönder; mesajın kopyalanır ve Claude Code açılır. Orada yapıştırınca Claude kodda, GitHub\'da ve Vercel\'de işi yapar.</p>' +
      '<div class="chips">' + IDEAS.map(function (x) { return '<button type="button">' + esc(x) + '</button>'; }).join('') + '</div></div>';
    Array.prototype.forEach.call(document.querySelectorAll('.chips button'), function (b) {
      b.addEventListener('click', function () { $('text').value = b.textContent; sync(); $('text').focus(); });
    });
    $('log').scrollTop = $('log').scrollHeight;
  }
  function sync() { var empty = !$('text').value.trim(); $('send').disabled = empty; $('agent').disabled = empty; }

  // Dias Ajan. Two ways to run the same agent:
  //  - the Chrome extension (extension/) on a computer: announces itself through its bridge;
  //  - the cloud: /api/agent starts a Chrome in a Vercel Sandbox, watched here live (phone).
  var agentOn = false, agentAsking = false, cloud = null, cloudBusy = false, CLOUD_KEY = 'diasCloud';
  function label() {
    $('agent').textContent = agentAsking ? '🤖 Ajana cevap ver' : cloud ? '☁️ Ajana yaz' : agentOn ? '🤖 Tarayıcıda yap' : '☁️ Bulutta yap';
  }
  function botSay(type, text) {
    agentAsking = type === 'ask';
    if (type === 'done' && /durdu/.test(text)) $('agentbar').hidden = true;
    log.push({ bot: true, ask: type === 'ask', secret: type === 'secret', text: (type === 'secret' ? '🔑 ' : '🤖 ') + text, t: Date.now() });
    // On a phone the live view leaves little room for the list: the latest note shows under it.
    $('liveMsg').textContent = (type === 'secret' ? '🔑 ' : '🤖 ') + text;
    $('liveMsg').className = 'live-msg ' + (type === 'ask' || type === 'secret' ? type : '');
    save(log); render(); label();
  }
  function toAgent(msg) { window.postMessage({ dias: 'to-agent', msg: msg }, location.origin); }
  window.addEventListener('message', function (e) {
    if (e.source !== window || e.origin !== location.origin || !e.data || e.data.dias !== 'from-agent') return;
    var m = e.data.msg || {};
    if (m.type === 'hello') { if (!cloud) { agentOn = true; label(); } return; }
    if (m.text) botSay(m.type, m.text);
  });

  function shieldKey() { try { return localStorage.getItem('shieldKey') || ''; } catch (e) { return ''; } }
  function keepCloud() { try { cloud ? localStorage.setItem(CLOUD_KEY, JSON.stringify(cloud)) : localStorage.removeItem(CLOUD_KEY); } catch (e) { /* private mode */ } }
  function call(path, body) {
    return fetch(cloud.url + path + '?k=' + cloud.token, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || r.status); return d; }); });
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function cloudUp() {
    for (var i = 0; i < 75; i++) {
      try { var r = await fetch(cloud.url + '/health', { cache: 'no-store' }); if (r.ok) return true; } catch (e) { /* still booting */ }
      await wait(2000);
    }
    return false;
  }
  async function cloudStart(task) {
    var key = shieldKey();
    if (!key) return botSay('error', 'Önce Dias Panel\'e (Genel sekmesi) anahtarınla giriş yap, sonra tekrar dene.');
    cloudBusy = true; showLive(true); $('liveWait').textContent = '☁️ Bulut Chrome açılıyor… (ilk açılış 1 dakikayı bulabilir)';
    try {
      var r = await fetch('/api/agent', { method: 'POST', headers: { 'x-shield-key': key, 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'start' }) });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(d.error === 'forbidden' ? 'Anahtar yanlış.' : d.error === 'cooldown' ? 'Çok deneme oldu, 10 dk bekle.' : (d.error || r.status));
      cloud = { id: d.id, url: d.url, token: d.token, expires: Date.now() + (d.ttl || 40 * 60000), since: 0 }; keepCloud();
      if (!(await cloudUp())) throw new Error('Bulut Chrome açılmadı, tekrar dene.');
      await call('/start', { task: task });
      $('agentbar').hidden = false;
      pollEvents(); pollShot();
    } catch (e) {
      botSay('error', 'Bulut açılamadı: ' + e.message);
      cloudStop(true);
    }
    cloudBusy = false;
  }
  async function cloudStop(quiet) {
    var c = cloud; cloud = null; keepCloud(); showLive(false); label();
    if (!c) return;
    try { await fetch(c.url + '/stop?k=' + c.token, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: '{}' }); } catch (e) { /* already gone */ }
    try { await fetch('/api/agent', { method: 'POST', headers: { 'x-shield-key': shieldKey(), 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'stop', id: c.id }) }); } catch (e) { /* stops itself at timeout */ }
    if (!quiet) botSay('done', 'Bulut Chrome kapandı.');
  }
  function showLive(on) {
    $('live').hidden = !on;
    document.body.classList.toggle('cloud', on);
    if (!on) { $('shot').removeAttribute('src'); $('liveWait').hidden = false; $('liveMsg').textContent = ''; }
  }
  var evGen = 0;
  async function pollEvents() {
    var gen = ++evGen;
    while (cloud && gen === evGen) {
      var c = cloud;
      try {
        var r = await fetch(c.url + '/events?k=' + c.token + '&since=' + c.since, { cache: 'no-store' });
        if (r.ok) {
          var d = await r.json();
          (d.events || []).forEach(function (ev) { c.since = Math.max(c.since, ev.n); botSay(ev.type, ev.text); });
          if (d.url) $('liveUrl').textContent = d.url.replace(/^https?:\/\//, '').slice(0, 40);
          keepCloud();
        }
      } catch (e) { /* network blip */ }
      var left = Math.round((c.expires - Date.now()) / 60000);
      $('liveLeft').textContent = left > 0 ? left + ' dk kaldı' : '';
      if (left <= 0) { botSay('done', 'Süre doldu, bulut Chrome kapandı.'); cloudStop(true); break; }
      await wait(1500);
    }
  }
  var shotGen = 0;
  function pollShot() {
    var img = $('shot'), gen = ++shotGen; // a restart ends the previous loop
    function next() {
      if (!cloud || gen !== shotGen) return;
      if (document.hidden) return setTimeout(next, 1500);
      img.src = cloud.url + '/shot?k=' + cloud.token + '&t=' + Date.now();
    }
    img.onload = function () { $('liveWait').hidden = true; setTimeout(next, 700); };
    img.onerror = function () { setTimeout(next, 1500); };
    next();
  }
  $('shot').addEventListener('click', function (e) {
    if (!cloud) return;
    // object-fit: contain can letterbox the picture inside the box.
    var r = this.getBoundingClientRect(), nw = this.naturalWidth || r.width, nh = this.naturalHeight || r.height;
    var k = Math.min(r.width / nw, r.height / nh), w = nw * k, h = nh * k;
    var x = (e.clientX - r.left - (r.width - w) / 2) / w, y = (e.clientY - r.top - (r.height - h) / 2) / h;
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    call('/tap', { x: x, y: y }).catch(function () {});
  });
  $('liveType').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !cloud) return;
    e.preventDefault();
    var t = this.value; this.value = '';
    if (t) call('/type', { text: t }).catch(function () {});
  });
  Array.prototype.forEach.call(document.querySelectorAll('.live-tools [data-key], .live-tools [data-dy]'), function (b) {
    b.addEventListener('click', function () {
      if (!cloud) return;
      if (b.dataset.key) {
        var t = $('liveType').value; $('liveType').value = '';
        (t ? call('/type', { text: t }) : Promise.resolve()).then(function () { return call('/type', { key: b.dataset.key }); }).catch(function () {});
      } else call('/scroll', { dy: Number(b.dataset.dy) }).catch(function () {});
    });
  });
  $('liveStop').addEventListener('click', function () { cloudStop(); });

  function agentSend() {
    var text = $('text').value.trim();
    if (!text || cloudBusy) return;
    var ext = agentOn && !cloud, reply = agentAsking || !!cloud;
    log.push({ me: true, text: (reply ? '' : ext ? '🤖 ' : '☁️ ') + text, t: Date.now() });
    save(log); $('text').value = ''; sync(); render();
    if (ext) { toAgent(agentAsking ? { type: 'reply', text: text } : { type: 'start', task: text }); $('agentbar').hidden = false; }
    else if (cloud) call('/reply', { text: text }).then(function (d) { if (d.queued) botSay('log', 'Not aldım, bu adım bitince bakacağım.'); }).catch(function (e) { botSay('error', 'Gönderilemedi: ' + e.message); });
    else cloudStart(text);
    agentAsking = false; label();
  }
  $('agent').addEventListener('click', agentSend);
  toAgent({ type: 'ping' });
  $('stop').addEventListener('click', function () { if (cloud) cloudStop(); else toAgent({ type: 'stop' }); });
  // A reload while the cloud Chrome is still running picks it up again.
  try { cloud = JSON.parse(localStorage.getItem(CLOUD_KEY) || 'null'); } catch (e) { cloud = null; }
  if (cloud && cloud.expires > Date.now()) { showLive(true); $('agentbar').hidden = false; pollEvents(); pollShot(); label(); } else { cloud = null; keepCloud(); }

  function send() {
    var text = $('text').value.trim();
    if (!text) return;
    // Copy synchronously first: once the new tab takes focus the clipboard API refuses.
    var box = $('text'), copied = false;
    box.select();
    try { copied = document.execCommand('copy'); } catch (e) { /* not supported */ }
    var win = window.open(CODE, '_blank');
    if (win) win.opener = null;
    log.push({ me: true, text: text, t: Date.now() });
    log.push({ me: false, text: (copied ? 'Panoya kopyalandı. ' : 'Kopyalanamadı, metni elle kopyala. ') + (win ? 'Claude Code yeni sekmede açıldı; yapıştırıp gönder.' : 'Claude Code açılamadı: claude.ai/code'), t: Date.now() });
    save(log); box.value = ''; sync(); render();
  }

  $('text').addEventListener('input', sync);
  $('text').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
  $('form').addEventListener('submit', function (e) { e.preventDefault(); send(); });
  $('clear').addEventListener('click', function () { if (log.length && confirm('Geçmiş silinsin mi?')) { log = []; save(log); render(); } });
  render();
})();
</script>
</body>
</html>
