<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dias Panel 3D</title>
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#050b18">
<style>
  /* Test page for the new 3D Dias Panel: today's numbers big on one tilted
     card; the arrow opens 1 week, 1 month, 2 months, 3 months and since
     opening. Data: /api/shield?stats=1 (same key as /shield.html). */
  :root{color-scheme:dark;--bg:#050b18;--ink:#eef4ff;--mute:#8da3c4;--line:#1f3a63;--ok:#3ddc97;--bad:#ff5a52;--s1:#3987e5;--s2:#c98500}
  *{box-sizing:border-box;margin:0}
  body{min-height:100dvh;background:radial-gradient(90% 55% at 50% 0,#12305e 0,var(--bg) 70%) var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,Inter,sans-serif;line-height:1.35;overflow-x:hidden}
  main{max-width:480px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
  [hidden]{display:none!important}
  button,input{font:inherit;color:inherit}
  button{border:0;cursor:pointer;background:none}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .top h1{font-size:1rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .sites{display:flex;gap:4px;background:#0b1830;border:1px solid var(--line);border-radius:10px;padding:3px}
  .sites button{padding:5px 10px;border-radius:7px;font-size:.78rem;color:var(--mute)}
  .sites button[aria-pressed=true]{background:#1d4f91;color:var(--ink)}

  /* 3D card: perspective stage, the card tilts with the finger/mouse. */
  .stage{perspective:900px}
  .card3d{position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-6deg));transition:transform .25s ease-out;
    border-radius:16px;padding:12px 12px 10px;background:linear-gradient(145deg,#173d72,#0b1b37 55%,#081329);border:1px solid #2d6bb8;
    box-shadow:0 30px 40px -18px rgba(0,0,0,.8),0 0 0 1px rgba(120,180,255,.06) inset,0 0 30px rgba(57,135,229,.25)}
  .card3d::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.14),transparent 40%)}
  .card3d>*{transform:translateZ(30px)}
  .when{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
  .arrow{width:28px;height:28px;border-radius:50%;background:#1d4f91;border:1px solid #3b7fd6;display:grid;place-items:center;font-size:1rem;transition:transform .3s;box-shadow:0 6px 12px rgba(0,0,0,.5)}
  .arrow[aria-expanded=true]{transform:rotate(180deg)}
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 8px}
  .hero div{text-align:center}
  .hero b{display:block;font-size:1.7rem;font-weight:800;line-height:1;text-shadow:0 3px 0 #061226,0 6px 10px rgba(0,0,0,.6)}
  .hero span{font-size:.62rem;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g4 .m{display:flex;flex-direction:column}.g4 .bar{margin-top:auto}.g4 small.d{margin-bottom:4px}
  .m{min-width:0;background:rgba(5,14,32,.55);border:1px solid var(--line);border-radius:10px;padding:5px 3px;text-align:center}
  .m b{display:block;font-size:.95rem;font-weight:700}
  .m b.q{font-size:.8rem;line-height:1.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .m span{display:block;font-size:.56rem;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
  small.d{display:block;font-size:.62rem;font-weight:600;margin-top:2px}
  .up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--mute)}

  /* Funnel step: count, share of the first step as a small 3D bar. */
  .sec{margin-top:16px}
  .bar{height:5px;margin:4px 6px 0;border-radius:3px;background:#0a1a33;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
  .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(180deg,#6fb6ff,#1d5fd1);box-shadow:0 0 6px rgba(57,135,229,.6)}

  /* Detail: a stack of smaller 3D cards. */
  .more{margin-top:12px;display:flex;flex-direction:column;gap:14px}
  .more .card3d{--rx:4deg;--ry:0deg;padding:14px;animation:rise .4s ease-out both}
  .more .card3d .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .more .card3d:nth-child(2){animation-delay:.05s}.more .card3d:nth-child(3){animation-delay:.1s}.more .card3d:nth-child(4){animation-delay:.15s}.more .card3d:nth-child(5){animation-delay:.2s}
  @keyframes rise{from{opacity:0;transform:rotateX(35deg) translateY(20px)}}
  .ttl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .ttl b{font-size:.95rem;text-transform:uppercase;letter-spacing:.5px}
  .ttl small{font-size:.7rem;color:var(--mute)}
  .foot{margin-top:16px;font-size:.7rem;color:var(--mute);text-align:center}
  .foot button{color:#7fb4ff;text-decoration:underline}
  .login{margin-top:30vh;display:flex;flex-direction:column;gap:10px}
  .login input{padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b1830}
  .login button{padding:12px;border-radius:10px;background:#1d4f91}
  .err{color:var(--bad);font-size:.85rem;text-align:center}
  .empty{text-align:center;color:var(--mute);padding:40px 0}
  @media (prefers-reduced-motion:reduce){.card3d,.arrow{transition:none}.more .card3d{animation:none}}
</style>
</head>
<body>
<main>
  <form class="login" id="login" hidden>
    <h1 style="text-align:center">Dias Panel 3D</h1>
    <input id="pw" type="password" placeholder="Şifre" autocomplete="current-password" aria-label="Şifre">
    <button type="submit">Giriş</button>
    <p class="err" id="err" hidden></p>
  </form>
  <div id="app" hidden>
    <div class="top">
      <h1>Dias 3D</h1>
      <div class="sites" role="group" aria-label="Site">
        <button type="button" data-site="all" aria-pressed="true">Hepsi</button>
        <button type="button" data-site="ca" aria-pressed="false">🇨🇦</button>
        <button type="button" data-site="es" aria-pressed="false">🇪🇸</button>
      </div>
    </div>
    <div id="body"><p class="empty">Yükleniyor…</p></div>
  </div>
</main>
<script>
(function () {
  var KEY = 'shieldKey', SITE = 'shield3dSite';
  // Detail cards: [period days or 'since', title].
  var MORE = [[7, '1 hafta'], [30, '1 ay'], [60, '2 ay'], [90, '3 ay'], ['since', 'Açılıştan beri']];
  var $ = function (id) { return document.getElementById(id); };
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) { return ''; } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // Funnel steps as /api/shield?funnel=1 names them; windows by name.
  var STEPS = [['open', 'Formu açtı'], ['route', 'Kurum gösterildi'], ['email', 'E-posta doğruladı'], ['submit', 'Gönderdi']];
  var FMORE = [['7', '1 hafta'], ['30', '1 ay'], ['60', '2 ay'], ['90', '3 ay'], ['since', 'Açılıştan beri']];
  var data = null, fun = null, site = store(SITE) || 'all', open = false, fOpen = false;

  function num(n) { return n == null ? '–' : Number(n).toLocaleString('tr-TR'); }
  function pct(r) { return (r * 100).toFixed(1).replace('.', ',') + '%'; }
  function pos(p) { return p ? p.toFixed(1).replace('.', ',') : '–'; }
  function secs(s) { return s == null ? '–' : s < 60 ? s + ' sn' : Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function day(d) { return new Date(d + 'T00:00:00Z').toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }); }
  // Change against the period before; for Google position lower is better.
  function delta(cur, prev, lowerBetter) {
    if (cur == null || prev == null) return '';
    if (!prev) return cur ? '<small class="d up">yeni</small>' : '<small class="d flat">–</small>';
    var p = Math.round((cur - prev) / prev * 100), good = lowerBetter ? p <= 0 : p >= 0;
    return '<small class="d ' + (p === 0 ? 'flat' : good ? 'up' : 'down') + '">' + (p >= 0 ? '↑' : '↓') + Math.abs(p) + '%</small>';
  }
  function cell(label, val, d) { return '<div class="m"><b>' + val + '</b><span>' + label + '</span>' + (d || '') + '</div>'; }
  // Search words with capital initials ("car insurance" → "Car Insurance").
  function title(q) { return String(q).replace(/(^|\s)(\S)/g, function (m, sp, ch) { return sp + ch.toLocaleUpperCase('en'); }); }
  function topQuery(p) {
    var q = p.query ? title(p.query.key) : '';
    return '<div class="m"' + (q ? ' title="' + esc(q) + '"' : '') + '><b class="q">' + (q ? esc(q) : '–') + '</b><span>En çok aranan</span>' +
      (p.query ? '<small class="d flat">' + num(p.query.clicks) + ' tık</small>' : '') + '</div>';
  }
  // The last box: complaints, or today's top search on the main card.
  function metrics(c, v, last) {
    v = v || {};
    return cell('Tık oranı', pct(c.ctr), delta(c.ctr, v.ctr)) +
      cell('Google sırası', pos(c.position), c.position && v.position ? delta(c.position, v.position, true) : '') +
      cell('Ziyaretçi', num(c.visitors), delta(c.visitors, v.visitors)) +
      cell('Süre / kişi', secs(c.eng), delta(c.eng, v.eng)) +
      (last || cell('Şikayet', num(c.complaints), delta(c.complaints, v.complaints)));
  }

  function steps(c, v) {
    var top = Math.max(c.open, c.route, c.email, c.submit) || 1;
    return STEPS.map(function (st) {
      var n = c[st[0]];
      return '<div class="m"><b>' + num(n) + '</b><span>' + st[1] + '</span>' + (v ? delta(n, v[st[0]]) : '') +
        '<div class="bar"><i style="width:' + Math.max(2, Math.round(n / top * 100)) + '%"></i></div></div>';
    }).join('');
  }
  function funnelHtml() {
    if (!fun) return '';
    var by = {};
    fun.windows.forEach(function (w) { by[w.name] = w; });
    var t = by['1'];
    if (!t || !t.cur) return '';
    var html = '<div class="stage sec"><div class="card3d" id="fmain">' +
      '<div class="when"><span>Şikayetçi hunisi · bugün</span><button type="button" class="arrow" id="farrow" aria-expanded="' + fOpen + '" aria-controls="fmore" aria-label="Huni detayı: 1 hafta, 1 ay, 2 ay, 3 ay, açılıştan beri">▾</button></div>' +
      '<div class="hero"><div><b>' + num(t.cur.open) + '</b><span>Formu açan</span>' + delta(t.cur.open, t.prev && t.prev.open) + '</div>' +
      '<div><b>' + num(t.cur.submit) + '</b><span>Gönderen</span>' + delta(t.cur.submit, t.prev && t.prev.submit) + '</div></div>' +
      '<div class="grid g4">' + steps(t.cur, t.prev) + '</div></div></div>';
    html += '<div class="more" id="fmore"' + (fOpen ? '' : ' hidden') + '>';
    FMORE.forEach(function (m) {
      var w = by[m[0]];
      if (!w || !w.cur) return;
      var sub = m[0] === 'since' ? day(fun.start) + "'den beri" : w.prev ? 'önceki döneme göre' : day(w.cur.from) + "'den beri";
      html += '<div class="stage"><div class="card3d"><div class="ttl"><b>' + esc(m[1]) + '</b><small>' + esc(sub) + '</small></div>' +
        '<div class="grid g4">' + steps(w.cur, w.prev) + '</div></div></div>';
    });
    return html + '</div>';
  }

  function render() {
    var s = data && data.sites && data.sites[site];
    if (!s) { $('body').innerHTML = '<p class="empty">Veri yok.</p>'; return; }
    var by = {};
    s.periods.forEach(function (p) { by[p.days] = p; });
    var t = by[1];
    var html = '<div class="stage"><div class="card3d" id="main">' +
      '<div class="when"><span>Bugün · ' + day(t.cur.to) + '</span><button type="button" class="arrow" id="arrow" aria-expanded="' + open + '" aria-controls="more" aria-label="Detay: 1 hafta, 1 ay, 2 ay, 3 ay, açılıştan beri">▾</button></div>' +
      '<div class="hero"><div><b>' + num(t.cur.impressions) + '</b><span>Google gösterim</span>' + delta(t.cur.impressions, t.prev.impressions) + '</div>' +
      '<div><b>' + num(t.cur.clicks) + '</b><span>Tıklama</span>' + delta(t.cur.clicks, t.prev.clicks) + '</div></div>' +
      '<div class="grid">' + metrics(t.cur, t.prev, topQuery(t)) + cell('Dünkü gösterim', num(t.prev.impressions)) + '</div></div></div>';

    html += '<div class="more" id="more"' + (open ? '' : ' hidden') + '>';
    MORE.forEach(function (m) {
      var c, v = null, sub;
      if (m[0] === 'since') {
        if (!s.since) return;
        c = s.since; sub = day(s.since.from) + "'den beri" + (s.since.growth ? ' · büyüme ×' + String(s.since.growth).replace('.', ',') : '');
      } else {
        var p = by[m[0]];
        if (!p) return;
        c = p.cur; v = p.prev; sub = 'önceki döneme göre';
      }
      html += '<div class="stage"><div class="card3d"><div class="ttl"><b>' + esc(m[1]) + '</b><small>' + esc(sub) + '</small></div>' +
        '<div class="grid">' + cell('Gösterim', num(c.impressions), v && delta(c.impressions, v.impressions)) + cell('Tık', num(c.clicks), v && delta(c.clicks, v.clicks)) +
        metrics(c, v) + '</div></div></div>';
    });
    html += '</div>' + funnelHtml();
    var notes = [];
    if (!data.gsc.ok) notes.push('Search Console bağlı değil (' + esc(data.gsc.reason) + ')');
    notes.push(data.visitors === 'ga' ? 'Ziyaretçi: Google Analytics' : 'Ziyaretçi: site sayacı');
    if (fun) notes.push('Huni: iki site birlikte');
    html += '<p class="foot">' + notes.join(' · ') + ' · ' + new Date(data.at).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) + ' · <button type="button" id="re">Yenile</button> · <a href="/shield.html" style="color:#7fb4ff">Eski panel</a></p>';
    $('body').innerHTML = html;
    $('arrow').addEventListener('click', function () { open = !open; render(); });
    $('re').addEventListener('click', function () { load(true); });
    tilt($('main'));
    if ($('fmain')) { tilt($('fmain')); $('farrow').addEventListener('click', function () { fOpen = !fOpen; render(); }); }
  }

  // Card follows the pointer a little; springs back when it leaves.
  function tilt(el) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    function move(x, y) {
      var r = el.getBoundingClientRect();
      el.style.setProperty('--ry', ((x - r.left) / r.width - 0.5) * 16 + 'deg');
      el.style.setProperty('--rx', (0.5 - (y - r.top) / r.height) * 16 + 'deg');
    }
    function reset() { el.style.removeProperty('--rx'); el.style.removeProperty('--ry'); }
    el.addEventListener('pointermove', function (e) { move(e.clientX, e.clientY); });
    el.addEventListener('pointerleave', reset);
    el.addEventListener('touchend', reset);
  }

  function load(fresh) {
    var key = store(KEY);
    if (!key) return showLogin();
    if (fresh) $('body').innerHTML = '<p class="empty">Yükleniyor…</p>';
    fetch('/api/shield?stats=1' + (fresh ? '&fresh=1' : ''), { headers: { 'x-shield-key': key }, cache: 'no-store' }).then(function (r) {
      if (r.status === 403) { store(KEY, ''); throw new Error('Şifre yanlış.'); }
      if (r.status === 429) throw new Error('Çok fazla yanlış deneme, 10 dk bekle.');
      if (!r.ok) throw new Error('Veri alınamadı (' + r.status + ').');
      return r.json();
    }).then(function (d) {
      data = d; $('login').hidden = true; $('app').hidden = false; render();
      // The funnel comes after, once the key is known to be right.
      return fetch('/api/shield?funnel=1', { headers: { 'x-shield-key': key }, cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (f) { if (f && f.ok) { fun = f; render(); } }, function () {});
    }).catch(function (e) {
      if (!store(KEY)) showLogin(e.message); else $('body').innerHTML = '<p class="empty">' + esc(e.message) + '</p>';
    });
  }
  function showLogin(msg) {
    $('app').hidden = true; $('login').hidden = false;
    $('err').hidden = !msg; $('err').textContent = msg || '';
  }
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('pw').value.trim();
    if (v) { store(KEY, v); $('pw').value = ''; load(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-site]'), function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-site') === site ? 'true' : 'false');
    b.addEventListener('click', function () {
      site = b.getAttribute('data-site'); store(SITE, site);
      Array.prototype.forEach.call(document.querySelectorAll('[data-site]'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      if (data) render();
    });
  });
  load();
})();
</script>
</body>
</html>
