name: Claude

# Tasks sent from the Dias Panel (/dias-claude.html) arrive as issues that
# mention @claude; Claude Code works on them on a branch and keeps one comment
# updated. Runs on the owner's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN,
# made with `claude setup-token`), so there is no per-use API bill.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
