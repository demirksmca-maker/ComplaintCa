name: IndexNow

# Tells Bing (and ChatGPT search, which uses Bing) plus Yandex/Seznam/Naver
# that pages changed, so they are re-read quickly. IndexNow keys are public by
# design: the key file sits at the site root.
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml', 'llms.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Vercel deploy
        run: sleep 120
      - name: Submit sitemap URLs
        env:
          KEY: 0f5530ca1853d5959e003403b74c6535
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          body=$(python3 -c "import json,sys;print(json.dumps({'host':'www.complaintca.ca','key':'$KEY','keyLocation':'https://www.complaintca.ca/$KEY.txt','urlList':json.loads(sys.argv[1])}))" "$urls")
          code=$(curl -sS -o resp.txt -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' -d "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow: $code"; cat resp.txt; echo
          case "$code" in 200|202) ;; *) exit 1;; esac
