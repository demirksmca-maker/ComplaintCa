name: Shield Agent

# Every 10 minutes: Claude reviews the edge shield's event log (written by
# middleware.js) and bans IPs that keep attacking. Talks to the site through
# /api/shield-agent with a GitHub OIDC token, so the only repository secret
# it needs is ANTHROPIC_API_KEY. Run it by hand with "dry_run" to see the
# verdict without banning.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — do not ban'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: shield-agent
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude SDK
        run: npm install --no-save --no-package-lock @anthropic-ai/sdk

      - name: Review shield events
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/shield-agent.mjs
