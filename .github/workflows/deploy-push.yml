name: Deploy Push

# After each push to main, wait until Vercel serves the new commit, then ask
# the site to send the Dias Panel phone notification (api/_shield-push.js).
# No secrets: the endpoint notifies at most once per deployment.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Notify when the new deploy is live
        run: |
          for i in $(seq 1 40); do
            sha=$(curl -sS --max-time 30 'https://www.complaintca.ca/api/shield?deploy=1' | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p')
            echo "try $i: live=$sha"
            if [ "$sha" = "$GITHUB_SHA" ]; then echo done; exit 0; fi
            sleep 20
          done
          echo "new deploy not seen"; exit 1
