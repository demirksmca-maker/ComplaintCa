name: Social Video

# Renders Reels from social/videos.json (scripts/social-video.mjs) and commits the
# MP4s to main. Videos with "bg": "pexels:<words>" get free Pexels footage behind
# the text; that needs the PEXELS_API_KEY secret (free key at pexels.com/api).
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Re-render only this video id (empty = every video without an MP4)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: social-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg and Chromium
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Render
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/social-video.mjs ${{ inputs.video_id }}

      - name: Commit videos
        run: |
          git add social/videos/*.mp4
          if git diff --cached --quiet; then echo "No new videos."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Social: render videos [skip ci]"
          git pull --rebase -q origin main
          git push origin HEAD:main
