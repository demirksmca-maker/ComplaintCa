<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#041235">
<title>How Can We Help? | ComplaintCA</title>
<meta name="description" content="Learn your rights or file a free complaint with ComplaintCA.">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=IBM+Plex+Sans:wght@600&display=swap">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LNW0LJL3KF"></script>
<script src="/ga-init.js"></script>
<style>
:root{--bg:#041235;--gold:#d9b24c;--gold2:#f1d27a;--ink:#14213a;--ui:"IBM Plex Sans",system-ui,sans-serif;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:#fff;font-family:var(--ui)}
body{min-height:100vh;display:grid;align-content:center;padding:24px 0}
.hero{max-width:1100px;width:100%;margin:0 auto}
.hero img{display:block;width:100%;height:auto;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 72%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 72%,transparent 100%)}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bars{box-sizing:border-box;width:100%;max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px}
.bar{display:block;text-align:center;font-weight:600;font-size:18px;letter-spacing:.02em;text-decoration:none;padding:18px 12px;border-radius:999px;transition:transform .15s}
.info{color:var(--gold2);border:2px solid var(--gold);background:rgba(4,18,53,.6)}
.complain{color:var(--ink);background:linear-gradient(180deg,var(--gold2),var(--gold));border:2px solid var(--gold);box-shadow:0 0 24px -4px rgba(217,178,76,.6)}
.ca{display:inline-block;margin-left:4px;padding:3px 8px 2px;border-radius:6px;background:#0f2952;color:var(--gold2);font:700 14px/1.2 Cinzel,Georgia,serif;letter-spacing:.08em;vertical-align:2px}
.bar:hover{transform:translateY(-2px)}
.bar:focus-visible{outline:2px solid #fff;outline-offset:3px}
.quote{margin:32px auto 0;padding:0 16px;text-align:center;font:italic 600 clamp(17px,2.4vw,21px)/1.5 Georgia,serif;color:var(--gold2)}
.quote cite{display:block;margin-top:8px;font:italic 600 14px/1 Georgia,serif;color:var(--gold2)}
@media (max-width:520px){.hero img{aspect-ratio:1/1;object-fit:cover}.bars{grid-template-columns:1fr;margin-top:4px}.complain{order:-1}}
@media (prefers-reduced-motion:reduce){.bar{transition:none}.bar:hover{transform:none}}
</style>
</head>
<body>
<div class="hero"><img src="/assets/newsletter/flag-wreath.jpg" alt="Gold scales of justice and a laurel wreath on a waving navy flag with a maple leaf" width="1376" height="630"></div>
<h1>How can we help?</h1>
<nav class="bars">
  <a class="bar info" href="/guides/">Know Your Rights</a>
  <a class="bar complain" href="/start.html">Complain <span class="ca">CA</span></a>
</nav>
<p class="quote">“Don't be discouraged.<br>When you fail, come back again.”<cite>Marcus Aurelius · Meditations 5.9</cite></p>
</body>
</html>
