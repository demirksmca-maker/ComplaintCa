<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ComplaintCA | From Complaint to Case</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="ComplaintCA presentation for law firms: from complaint to case, one platform.">
<meta name="theme-color" content="#0b1f3f">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ComplaintCA">
<meta property="og:title" content="ComplaintCA | From Complaint to Case">
<meta property="og:description" content="Ready cases for lawyers, not just clients. A narrated presentation for law firms.">
<meta property="og:url" content="https://www.complaintca.ca/presentation">
<meta property="og:image" content="https://www.complaintca.ca/assets/email/presentation-banner.jpg">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preload" as="image" href="/assets/presentation/slide-01.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Presentation viewer: navy stage, one 16:9 slide at a time, controls and narration caption below.
   Single dark theme on purpose: it matches the deck's navy and gold look. */
:root {
  --bg: #0b1f3f;
  --panel: #12305e;
  --ink: #f2f5f9;
  --muted: #a9b6c9;
  --line: #2a4677;
  --gold: #c9a84c;
  --gold-ink: #0b1f3f;
  --red: #ff8a7a;
  --font-display: "Source Serif 4", Cambria, Georgia, serif;
  --font-body: "Source Sans 3", Calibri, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }

/* Access gate */
.gate { min-height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 32px; }
.gate form { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px; display: grid; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.gate .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.gate h1 { font-family: var(--font-display); font-size: 24px; margin: 0 0 4px; }
.gate label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
.gate input { font: 16px var(--font-body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.gate input:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
.gate button { font: 600 15px var(--font-body); padding: 12px; border: 0; border-radius: 8px; background: var(--gold); color: var(--gold-ink); cursor: pointer; }
.gate button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.gate .error { margin: 0; font-size: 14px; color: var(--red); min-height: 1.2em; }

/* Viewer */
.deck { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding-inline: 16px; padding-block: 14px 18px; max-width: 1400px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .01em; }
.brand b { color: #e0605a; font-weight: 700; }
.tag { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.stage { display: grid; place-items: center; min-height: 0; }
.slide { width: min(100%, calc((100dvh - 280px) * 16 / 9)); min-width: min(100%, 280px); aspect-ratio: 16 / 9; position: relative; border-radius: 6px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.45); background: var(--panel); touch-action: pan-y; }
.slide img { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
.bar { display: grid; gap: 10px; width: min(100%, calc((100dvh - 280px) * 16 / 9)); min-width: min(100%, 280px); margin: 0 auto; }
.controls { display: flex; align-items: center; gap: 8px; }
.btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.btn:hover { border-color: var(--gold); }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.play { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); width: 52px; height: 52px; }
.btn svg { width: 18px; height: 18px; }
.progress { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; min-width: 40px; }
.progress i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 52px; text-align: right; }
.caption { margin: 0; color: var(--muted); font-size: 15px; min-height: 2.9em; max-width: 90ch; }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); opacity: .8; }

@media (max-width: 560px) {
  .btn { width: 40px; height: 40px; }
  .btn.play { width: 46px; height: 46px; }
  .caption { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <span class="eyebrow">ComplaintCA · Private preview</span>
    <h1>Enter your access details</h1>
    <label for="gateUser">Username<input id="gateUser" name="user" type="text" autocapitalize="off" spellcheck="false" required></label>
    <label for="gatePass">Password<input id="gatePass" name="pass" type="password" required></label>
    <p class="error" id="gateError" aria-live="polite"></p>
    <button type="submit">View presentation</button>
  </form>
</div>

<main class="deck" id="deck" hidden>
  <div class="top">
    <div class="brand">Complaint<b>CA</b></div>
    <div class="tag">Presentation for law firms</div>
  </div>

  <div class="stage">
    <div class="slide" id="slide">
      <img id="slideImg" src="/assets/presentation/slide-01.jpg" alt="" width="1600" height="900">
    </div>
  </div>

  <div class="bar">
    <div class="controls">
      <button class="btn" id="prev" aria-label="Previous slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="btn play" id="play" aria-label="Play narration">
        <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button class="btn" id="next" aria-label="Next slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="progress" aria-hidden="true"><i id="progress"></i></div>
      <span class="count" id="count">1 / 30</span>
      <button class="btn" id="full" aria-label="Full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
    <p class="hint" id="hint">Press play to hear the narration. Use the arrows, your keyboard or swipe to move between slides.</p>
  </div>
</main>

<script>
const SLIDES = [{"alt": "COMPLAINTCA · From complaint to case, · one platform · Ready cases for lawyers, not just clients · Information requests  ·  Complaints  ·  Lawyer panel", "note": "Today I will introduce ComplaintCA. ComplaintCA runs the whole journey from complaint to legal case automatically, on one platform. We will look at the overall flow first, then the information request, complaint and lawyer panel parts, and finally the value we offer lawyers and our revenue model."}, {"alt": "A four-stage process · Complaint & analysis · Classification · Case file preparation · Lawyer panel · The user files a complaint; a roadmap is ready in ≈ 7 sec · Information request or complaint; complaints get a green, yellow or red code · Evidence, document verification, legal correspondence, precedent check · Matching lawyer, win potential, class action, follow-up · The user only writes the com", "note": "The process has four stages. The user files a complaint and the system draws a roadmap in about seven seconds. The request is classified as an information request or a complaint, and complaints receive a green, yellow or red code. The case file is then prepared and finally meets the right lawyer in the lawyer panel."}, {"alt": "Process overview · Information request · I1  Automated request email · I2  Tracking via site link · Request type · Filing a complaint · Created by the user · Automated analysis · Roadmap · ≈ 7 sec · Statistics · Process is tracked · Complaint · C1–C3  Code · Evidence · Verification · C4–C6  Letters · Precedents · Pool · L1–L6  Lawyer panel", "note": "This diagram shows the whole process. The user files a complaint. The system draws a roadmap in about seven seconds and decides whether it is a complaint or a right-to-information request. For information requests, the email is generated automatically and a tracking link is added. Complaints go through code assignment, evidence upload, document verification, legal correspondence, precedent comparison and the lawyer pool; cases in the pool meet the right lawyer in the lawyer panel. The entire process is tracked statistically."}, {"alt": "Filing a complaint · GETTING STARTED · The user files a complaint on the platform · The complaint is sent to the system · STEP 1 · Complaint · Created by the user", "note": "It all starts with the user, who files a complaint on our platform."}, {"alt": "Automated analysis · GETTING STARTED · System automation kicks in instantly · A roadmap is ready in about 7 seconds · STEP 2 · ≈ 7 sec · Time to roadmap", "note": "As soon as the complaint is filed, system automation kicks in and draws a roadmap for it within about seven seconds."}, {"alt": "Request type · GETTING STARTED · The system evaluates the request · It decides: complaint or right-to-information request · STEP 3 · 2 paths · Complaint or right to information", "note": "The system evaluates the request and decides whether it is a complaint or a right-to-information request."}, {"alt": "PART 1 · Information request · Defined by law, fully automated", "note": "Part one: information requests. Because the right to information is defined by law, this process is fully automated."}, {"alt": "Request email · INFO REQUEST · I1 · I2 · The right to information is defined by law · The system generates the request email automatically · STEP I1 · Automated · Information request email defined by law", "note": "Because the right to information is defined by law, the system generates the information request email automatically."}, {"alt": "Tracking link · INFO REQUEST · I1 · I2 · A link to our site is added to the email · Tracking and replies happen on our site · STEP I2 · Site link · For tracking and replies", "note": "A link to our site is added to the information request email. The institution's replies and the tracking of the request happen on our site."}, {"alt": "PART 2 · Complaint system · Six steps from code to lawyer pool", "note": "Part two: the complaint system. A complaint moves through six steps, from code assignment to the lawyer pool."}, {"alt": "Complaint process · C1 · C2 · C3 · C4 · C5 · C6 · Code assignment · Evidence upload · Document verification · Legal correspondence · Precedent comparison · Lawyer pool · Green · Yellow · Red · All evidence uploaded · Verified by the system · Automated, up to the user's inbox · Class action fit · Ready for lawyers", "note": "The complaint process has six steps: code assignment, evidence upload, document verification, legal correspondence, precedent comparison and the lawyer pool."}, {"alt": "Analysis result: 3 codes · COMPLAINT · C1 · C2 · C3 · C4 · C5 · C6 · Green code · Yellow code · Red code · Each complaint is analyzed and assigned one of these three codes.", "note": "Based on the analysis, each complaint is assigned one of three codes: green, yellow or red."}, {"alt": "Evidence upload · COMPLAINT · C1 · C2 · C3 · C4 · C5 · C6 · The user uploads all required evidence · STEP C2 · All evidence · Uploaded by the user", "note": "The user uploads all evidence needed for the complaint to the platform."}, {"alt": "Document verification · COMPLAINT · C1 · C2 · C3 · C4 · C5 · C6 · The system verifies the uploaded documents · STEP C3 · Verification · Performed by the system", "note": "The system verifies the uploaded documents."}, {"alt": "Legal correspondence · COMPLAINT · C1 · C2 · C3 · C4 · C5 · C6 · Legal correspondence is handled by automation · The process runs all the way to the user's inbox · STEP C4 · Automation · Up to the user's inbox", "note": "Next, legal correspondence is handled by automation, all the way to the user's inbox."}, {"alt": "Precedent comparison · COMPLAINT · C1 · C2 · C3 · C4 · C5 · C6 · The case is compared with precedents · Class action suitability is determined · STEP C5 · Class action · Fit checked against precedents", "note": "During this process, the case is compared with precedents and assessed for class action suitability."}, {"alt": "Lawyer pool · COMPLAINT · C1 · C2 · C3 · C4 · C5 · C6 · The file enters our platform's pool · It becomes ready for lawyers · STEP C6 · Ready case file · In the platform pool, for lawyers", "note": "Finally, the file becomes ready for lawyers in our platform's pool."}, {"alt": "PART 3 · Lawyer panel · Ready cases meet the right lawyer", "note": "Part three: the lawyer panel. This is where ready cases from the pool meet the right lawyer."}, {"alt": "Lawyer panel · L1 · L2 · L3 · L4 · L5 · L6 · Panel login · Matching cases · Win potential · Case lock · Class action · Follow-up questions · With license number · By case type · Percentage score · 1 case · 1 lawyer · Contact users · At set intervals · No reply within the follow-up period: the case returns to the pool · Lawyers or law firms · Users accept a general agreement for the case pool", "note": "In the lawyer panel, the lawyer logs in, sees cases that match their case type, reviews each case's win potential and takes a case. The case is then locked to that lawyer. Lawyers can create class actions and contact users. The site asks follow-up questions at set intervals; if there is no reply within the follow-up period, the case returns to the pool."}, {"alt": "Panel login · LAWYER PANEL · L1 · L2 · L3 · L4 · L5 · L6 · A lawyer or law firm logs in to the panel · Login uses the lawyer's bar license number · The license number is legally verified · In a law firm, each lawyer logs in with their own license number · STEP L1 · License no. · Login with legal verification", "note": "A lawyer or law firm logs in to the panel with their bar license number. The license number is legally verified. In law firms, each lawyer logs in with their own license number."}, {"alt": "Matching cases · LAWYER PANEL · L1 · L2 · L3 · L4 · L5 · L6 · The system lists cases that match the lawyer's case type · STEP L2 · Case type · Matching cases are listed", "note": "The system lists the cases that match the lawyer's case type."}, {"alt": "Win potential · LAWYER PANEL · L1 · L2 · L3 · L4 · L5 · L6 · Case #2481 · Consumer · Red code · WITH PRECEDENTS · Precedents + evidence · Precedents: 3 rulings · Evidence: 5 documents · verified · %72 · NO PRECEDENTS · Evidence only · Win potential · Take the case · Each case's win potential is shown to the lawyer as a percentage. · Sample screen", "note": "Each case's win potential is shown as a percentage. For cases with precedents, it is based on precedents and evidence; for cases without precedents, on evidence alone. The screen on the right is a sample."}, {"alt": "Case lock · LAWYER PANEL · L1 · L2 · L3 · L4 · L5 · L6 · A lawyer can handle multiple cases · Once taken, the case is locked to that lawyer · Each case stays open to one lawyer only · STEP L4 · 1 case · 1 lawyer · Locked to the lawyer who takes it", "note": "A lawyer can handle multiple cases. But once a lawyer takes a case, it is locked to them, and each case stays open to one lawyer only."}, {"alt": "Class actions & contact · LAWYER PANEL · L1 · L2 · L3 · L4 · L5 · L6 · Lawyers can create their own class action from the panel · Lawyers can contact users · Users accept a general agreement for the case pool · STEP L5 · Class action · Created from the panel", "note": "Lawyers can create their own class action from the panel and contact users. Users have already accepted a general agreement for the case pool."}, {"alt": "Follow-up questions · LAWYER PANEL · L1 · L2 · L3 · L4 · L5 · L6 · When the lawyer logs in, the site asks questions about the case at set intervals · If the lawyer doesn't reply in time, the case returns to the pool · STEP L6 · Follow-up period · No reply: the case returns to the pool", "note": "When the lawyer logs in, the site asks questions about the case at set intervals. If the lawyer does not reply within the follow-up period, the case returns to the case pool."}, {"alt": "FOR LAWYERS · Why ComplaintCA? · Value proposition and revenue model", "note": "Now to the key question: why should lawyers use ComplaintCA?"}, {"alt": "Why ComplaintCA? · Ready cases for lawyers, not just clients. · Ready case file · Cases by expertise · Evidence uploaded and verified, correspondence done · Cases are listed by case type · Win potential · Class action · A percentage based on precedents and evidence · Build your own class action from similar complaints", "note": "ComplaintCA brings lawyers ready cases, not just clients. Evidence is already uploaded and verified, and the correspondence is done. Cases are listed by the lawyer's case type, each case's win potential is calculated from precedents and evidence, and lawyers can build their own class actions from similar complaints."}, {"alt": "Revenue model · Cases matched by case type · LAWYERS  ·  LAW FIRMS · Monthly · subscription · Win potential scores · Multiple case tracking · Class action creation · Pricing to be announced · Contact users · Each case stays open to one lawyer only.", "note": "Our revenue model is a monthly subscription. Lawyers and law firms join the platform with a monthly subscription. It gives them matched cases, win potential scores, multiple case tracking, class action creation and access to users. Each case stays open to one lawyer only. Subscription pricing has not been set yet."}, {"alt": "Statistics · The process is tracked statistically · Information requests, complaints and the lawyer panel are tracked together · STEP 4 · End to end · The whole process is tracked", "note": "Information requests, complaints and the lawyer panel are all tracked statistically."}, {"alt": "In summary · ≈ 7 sec · 3 codes · Ready cases · Monthly · Automated analysis and roadmap · Green · Yellow · Red · Verified, with win potential scored · Subscription for lawyers and law firms · Thank you", "note": "In summary: the user only files the complaint. The system draws a roadmap in about seven seconds, assigns a green, yellow or red code, verifies documents, handles legal correspondence and prepares the file. In the lawyer panel, these ready cases meet the right lawyer, together with their win potential. Lawyers and law firms join with a monthly subscription. Thank you; I'm happy to take your questions."}];

const $ = id => document.getElementById(id);
const synth = window.speechSynthesis;
let current = 0, playing = false, timer = null, voice = null;

function src(i) { return `/assets/presentation/slide-${String(i + 1).padStart(2, "0")}.jpg`; }
function preload(i) { if (i >= 0 && i < SLIDES.length) { const im = new Image(); im.src = src(i); } }

function show(i) {
  current = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[current];
  $("slideImg").src = src(current);
  $("slideImg").alt = `Slide ${current + 1}: ${s.alt}`;
  $("caption").textContent = s.note;
  $("count").textContent = `${current + 1} / ${SLIDES.length}`;
  $("progress").style.width = `${(current + 1) / SLIDES.length * 100}%`;
  preload(current + 1); preload(current - 1);
}

function pickVoice() {
  if (!synth) return;
  const v = synth.getVoices();
  voice = v.find(x => /^en-(CA|US|GB)/i.test(x.lang || "")) || v.find(x => /^en/i.test(x.lang || "")) || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

function setPlaying(on) {
  playing = on;
  $("icoPlay").hidden = on; $("icoPause").hidden = !on;
  $("play").setAttribute("aria-label", on ? "Pause narration" : "Play narration");
}
function stop() { setPlaying(false); clearTimeout(timer); if (synth) synth.cancel(); }
function speak(i) {
  show(i);
  clearTimeout(timer);
  const advance = () => { if (!playing) return; if (current < SLIDES.length - 1) speak(current + 1); else stop(); };
  if (synth) {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(SLIDES[current].note);
    u.lang = "en-US"; u.rate = 0.97;
    if (voice) u.voice = voice;
    u.onend = () => { timer = setTimeout(advance, 700); };
    synth.speak(u);
  } else {
    timer = setTimeout(advance, 3000 + SLIDES[current].note.length * 45);
  }
}
function go(i) { if (playing) speak(i); else show(i); }

$("play").onclick = () => {
  if (playing) return stop();
  if (current === SLIDES.length - 1) current = 0;
  setPlaying(true); speak(current);
};
$("next").onclick = () => go(current + 1);
$("prev").onclick = () => go(current - 1);

const fsTarget = document.documentElement;
if (!fsTarget.requestFullscreen) $("full").hidden = true;
$("full").onclick = () => {
  try { document.fullscreenElement ? document.exitFullscreen() : fsTarget.requestFullscreen().catch(() => {}); } catch (e) {}
};

document.addEventListener("keydown", e => {
  if ($("deck").hidden || e.target.tagName === "INPUT") return;
  if (["ArrowRight", "PageDown"].includes(e.key) || (e.key === " " && e.target === document.body)) { e.preventDefault(); go(current + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(current - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(SLIDES.length - 1);
});
let tx = null;
$("slide").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
$("slide").addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 40) go(current + (dx < 0 ? 1 : -1));
});
$("slide").addEventListener("click", e => {
  const r = $("slide").getBoundingClientRect();
  go(current + (e.clientX - r.left > r.width / 2 ? 1 : -1));
});

show(0);

// Access gate: a light deterrent for a one-off private share, not real security.
(function () {
  const HASH = "3e05ac42a24563324d28e58f2329a39cc71bb9242050f3b41b51823ae1bbd384";
  const KEY = "complaintca-presentation-access";
  const unlock = () => { $("gate").hidden = true; $("deck").hidden = false; };
  try { if (sessionStorage.getItem(KEY) === HASH) { unlock(); return; } } catch (e) {}
  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  $("gateForm").addEventListener("submit", async e => {
    e.preventDefault();
    const h = await sha256($("gateUser").value.trim().toLowerCase() + ":" + $("gatePass").value);
    if (h === HASH) {
      try { sessionStorage.setItem(KEY, HASH); } catch (err) {}
      $("gateError").textContent = "";
      unlock();
    } else {
      $("gateError").textContent = "Incorrect username or password. Please check the details in your email.";
      $("gatePass").value = ""; $("gatePass").focus();
    }
  });
  $("gateUser").focus();
})();
</script>
</body>
</html>
