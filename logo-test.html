<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Logo Test</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0a1530;color:#e9edf5;font-family:-apple-system,'Segoe UI',sans-serif;padding:18px 16px 40px;max-width:430px;margin-inline:auto}
  h2{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#8991a3;margin:26px 0 10px;font-weight:600}
  .card{border-radius:14px;padding:22px 16px;display:flex;align-items:center;justify-content:center;gap:22px;background:#0f2952}
  .light{background:#f2f0ea}
  .mono{font-family:'Cinzel',serif;font-weight:700;color:#d4af37;line-height:1;display:inline-flex;letter-spacing:.02em}
  .light .mono{color:#0f2952}
  .mono b{font-weight:inherit;display:inline-block}
  .mono .r{transform:scaleX(-1)}
  .s1{font-size:72px}.s2{font-size:44px}.s3{font-size:28px}.s4{font-size:16px}
  /* animated version: C's open like arms around A */
  .anim .l{animation:l 1.2s .3s cubic-bezier(.2,1.3,.4,1) both}
  .anim .r{animation:r 1.2s .3s cubic-bezier(.2,1.3,.4,1) both}
  .anim .a{animation:a 1s .9s ease-out both}
  @keyframes l{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes r{from{opacity:0;transform:translateX(-26px) scaleX(-1)}to{opacity:1;transform:scaleX(-1)}}
  @keyframes a{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
  .fav{width:56px;height:56px;border-radius:14px;background:#0f2952;border:1.5px solid #c9a84c;display:flex;align-items:center;justify-content:center}
  .name{font-family:'Cinzel',serif;font-weight:600;color:#d4af37;letter-spacing:.08em;font-size:1.3rem}
</style>
</head>
<body>

<h2>1 · Monogram (animated)</h2>
<div class="card anim"><span class="mono s1"><b class="l">C</b><b class="a">A</b><b class="r">C</b></span></div>

<h2>2 · Sizes</h2>
<div class="card" style="gap:18px">
  <span class="mono s2"><b>C</b><b>A</b><b class="r">C</b></span>
  <span class="mono s3"><b>C</b><b>A</b><b class="r">C</b></span>
  <span class="mono s4"><b>C</b><b>A</b><b class="r">C</b></span>
</div>

<h2>3 · App icon / favicon</h2>
<div class="card" style="gap:18px">
  <div class="fav"><span class="mono s2"><b>C</b><b>A</b><b class="r">C</b></span></div>
  <div class="fav" style="width:32px;height:32px;border-radius:8px"><span class="mono s4"><b>C</b><b>A</b><b class="r">C</b></span></div>
</div>

<h2>4 · With name</h2>
<div class="card" style="flex-direction:column;gap:10px">
  <span class="mono s2"><b>C</b><b>A</b><b class="r">C</b></span>
  <span class="name">ComplaintCA</span>
</div>

<h2>5 · Light background</h2>
<div class="card light"><span class="mono s2"><b>C</b><b>A</b><b class="r">C</b></span></div>

</body>
</html>
