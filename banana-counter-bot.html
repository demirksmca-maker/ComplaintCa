<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Banana Counter — Bota Karşı</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #2b2140 0%, #120e1e 70%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    padding: 16px;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 20px;
    backdrop-filter: blur(6px);
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
    text-align: center;
  }
  p.sub {
    margin: 0 0 16px;
    text-align: center;
    color: #cfc6e6;
    font-size: 0.85rem;
  }
  .scoreboard {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .card {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 10px 12px;
    text-align: center;
  }
  .card .label { font-size: 0.75rem; color: #cfc6e6; }
  .card .value { font-size: 1.6rem; font-weight: 700; }
  .card.you .value { color: #ffd93d; }
  .card.bot .value { color: #6fe3ff; }
  .timer {
    text-align: center;
    font-size: 0.95rem;
    margin-bottom: 12px;
    color: #cfc6e6;
  }
  .arena {
    position: relative;
    width: 100%;
    height: 320px;
    background: rgba(0,0,0,0.25);
    border-radius: 16px;
    overflow: hidden;
    touch-action: none;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .banana {
    position: absolute;
    font-size: 2.2rem;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    background: none;
    border: none;
    padding: 6px;
    transform: translate(-50%, -50%) rotate(0deg);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    animation: pop 0.15s ease-out;
  }
  @keyframes pop {
    from { transform: translate(-50%, -50%) scale(0.4); }
    to { transform: translate(-50%, -50%) scale(1); }
  }
  .msg {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(10,8,20,0.85);
    text-align: center;
    padding: 16px;
    gap: 10px;
  }
  .msg.show { display: flex; }
  .msg h2 { margin: 0; font-size: 1.4rem; }
  .msg p { margin: 0; color: #cfc6e6; font-size: 0.9rem; }
  button.action {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ffd93d, #ff9a3d);
    color: #2b1d00;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  button.action:active { transform: scale(0.98); }
  .hint {
    margin-top: 10px;
    text-align: center;
    font-size: 0.75rem;
    color: #9a8fc2;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🍌 Banana Counter</h1>
  <p class="sub">Ekranda beliren muzlara tıkla, botu geçmeye çalış!</p>

  <div class="scoreboard">
    <div class="card you">
      <div class="label">SEN</div>
      <div class="value" id="youScore">0</div>
    </div>
    <div class="card bot">
      <div class="label">BOT 🤖</div>
      <div class="value" id="botScore">0</div>
    </div>
  </div>

  <div class="timer">Süre: <span id="timeLeft">30</span> sn</div>

  <div class="arena" id="arena">
    <div class="msg show" id="startMsg">
      <h2>Hazır mısın?</h2>
      <p>30 saniyen var. Botu geride bırak!</p>
      <button class="action" id="startBtn">Oyunu Başlat</button>
    </div>
    <div class="msg" id="endMsg">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button class="action" id="restartBtn">Tekrar Oyna</button>
    </div>
  </div>

  <p class="hint">Bot rastgele aralıklarla kendi kendine muz "topluyor" — sen tıklayarak yarışıyorsun.</p>
</div>

<script>
(function () {
  var arena = document.getElementById('arena');
  var youScoreEl = document.getElementById('youScore');
  var botScoreEl = document.getElementById('botScore');
  var timeLeftEl = document.getElementById('timeLeft');
  var startMsg = document.getElementById('startMsg');
  var endMsg = document.getElementById('endMsg');
  var resultTitle = document.getElementById('resultTitle');
  var resultText = document.getElementById('resultText');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');

  var GAME_SECONDS = 30;
  var youScore = 0;
  var botScore = 0;
  var timeLeft = GAME_SECONDS;
  var running = false;
  var spawnTimer = null;
  var botTimer = null;
  var countdownTimer = null;
  var currentBanana = null;

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  function clearBanana() {
    if (currentBanana && currentBanana.parentNode) {
      currentBanana.parentNode.removeChild(currentBanana);
    }
    currentBanana = null;
  }

  function spawnBanana() {
    clearBanana();
    if (!running) return;

    var el = document.createElement('button');
    el.className = 'banana';
    el.type = 'button';
    el.textContent = '🍌';

    var w = arena.clientWidth;
    var h = arena.clientHeight;
    var x = rand(30, w - 30);
    var y = rand(30, h - 30);
    el.style.left = x + 'px';
    el.style.top = y + 'px';

    el.addEventListener('click', function () {
      if (!running) return;
      youScore++;
      youScoreEl.textContent = youScore;
      spawnBanana();
    });

    arena.appendChild(el);
    currentBanana = el;

    var lifeMs = rand(900, 1600);
    var missTimeout = setTimeout(function () {
      if (currentBanana === el && running) {
        spawnBanana();
      }
    }, lifeMs);

    el._missTimeout = missTimeout;
  }

  function botTick() {
    if (!running) return;
    if (Math.random() < 0.6) {
      botScore++;
      botScoreEl.textContent = botScore;
    }
    var nextIn = rand(500, 1100);
    botTimer = setTimeout(botTick, nextIn);
  }

  function tickClock() {
    timeLeft--;
    timeLeftEl.textContent = timeLeft;
    if (timeLeft <= 0) {
      endGame();
    }
  }

  function startGame() {
    youScore = 0;
    botScore = 0;
    timeLeft = GAME_SECONDS;
    youScoreEl.textContent = 0;
    botScoreEl.textContent = 0;
    timeLeftEl.textContent = timeLeft;
    startMsg.classList.remove('show');
    endMsg.classList.remove('show');
    running = true;

    spawnBanana();
    botTimer = setTimeout(botTick, rand(500, 1100));
    countdownTimer = setInterval(tickClock, 1000);
  }

  function endGame() {
    running = false;
    clearBanana();
    clearInterval(countdownTimer);
    clearTimeout(botTimer);

    if (youScore > botScore) {
      resultTitle.textContent = '🎉 Kazandın!';
      resultText.textContent = 'Sen: ' + youScore + '  •  Bot: ' + botScore;
    } else if (youScore < botScore) {
      resultTitle.textContent = '🤖 Bot kazandı';
      resultText.textContent = 'Sen: ' + youScore + '  •  Bot: ' + botScore + ' — bir daha dene!';
    } else {
      resultTitle.textContent = '🤝 Berabere';
      resultText.textContent = 'Sen: ' + youScore + '  •  Bot: ' + botScore;
    }
    endMsg.classList.add('show');
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
