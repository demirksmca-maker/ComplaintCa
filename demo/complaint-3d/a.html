<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Envelope and Seal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="flow.css">
<style>
/* Study A — "Envelope & Seal": your complaint is written onto a real 3D letter, sealed in gold wax and sent. */
body{background:radial-gradient(90% 55% at 50% 18%,#2a1d5c 0%,#140f2c 55%,#0b0a14 100%);min-height:100dvh;overflow-x:hidden}
.scene{position:relative;height:clamp(250px,40dvh,380px);width:100%;margin-top:calc(env(safe-area-inset-top,0px) + 44px)}
.scene canvas{display:block;width:100%!important;height:100%!important}
.scene::after{content:"";position:absolute;left:50%;bottom:6%;width:62%;height:22px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);pointer-events:none}
.panel{padding:4px 18px calc(28px + env(safe-area-inset-bottom,0px))}
.cf{background:linear-gradient(180deg,rgba(28,21,58,.72),rgba(14,11,30,.82));border:1px solid rgba(246,231,191,.16);border-radius:24px;padding:18px 16px 16px;
  box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
</style>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
</head><body>
<a class="study-tag" href="./">A · Envelope &amp; Seal</a>
<div class="scene" id="scene"></div>
<div class="panel" id="panel"></div>
<script src="flow.js"></script>
<script>const FLOW = CCFlow.mount(document.getElementById('panel')); window.CC_SEND_DELAY = 2600;</script>
<script type="module">
import * as THREE from 'three';
const host = document.getElementById('scene');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
renderer.outputColorSpace = THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, .1, 60);

scene.add(new THREE.AmbientLight(0x9a8cff, .55));
const key = new THREE.DirectionalLight(0xfff1d6, 2.2); key.position.set(2.5, 3, 4); scene.add(key);
const rim = new THREE.PointLight(0xf5c563, 18, 9); rim.position.set(-2.2, .4, 1.6); scene.add(rim);
const back = new THREE.PointLight(0x7c5cff, 22, 10); back.position.set(0, 1.5, -2.5); scene.add(back);

const GOLD = new THREE.MeshStandardMaterial({ color:0xe6c98a, metalness:.9, roughness:.28 });
const rig = new THREE.Group(); scene.add(rig);

// ── Letter: a parchment sheet whose face is redrawn as the user answers ──
const LS = 2, cv = document.createElement('canvas'); cv.width = 640 * LS; cv.height = 800 * LS;
const ctx = cv.getContext('2d');
const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const paper = new THREE.MeshStandardMaterial({ map:tex, roughness:.85, metalness:0 });
const edge = new THREE.MeshStandardMaterial({ color:0xefe2c2, roughness:.9 });
const letter = new THREE.Mesh(new THREE.BoxGeometry(1.7, 2.12, .012), [edge, edge, edge, edge, paper, edge]);
rig.add(letter);
const FIELDS = [['who','About'],['what','What happened'],['where','Where'],['urg','Urgency'],['id','Identity'],['mail','Email'],['ev','Evidence']];
function wrapText(t, x, y, w, lh, max){
  const words = t.split(/\s+/); let line = '', n = 0;
  for (const wd of words){ const test = line ? line + ' ' + wd : wd;
    if (ctx.measureText(test).width > w && line){ ctx.fillText(line, x, y); y += lh; line = wd; if (++n >= max - 1){ line += '…'; break; } } else line = test; }
  ctx.fillText(line, x, y); return y + lh;
}
function drawLetter(ref){
  ctx.setTransform(LS, 0, 0, LS, 0, 0);
  const W = cv.width / LS, H = cv.height / LS, g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#fbf3df'); g.addColorStop(1, '#efe0bd'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#c9a45a'; ctx.lineWidth = 3; ctx.strokeRect(22, 22, W - 44, H - 44);
  ctx.lineWidth = 1; ctx.strokeRect(32, 32, W - 64, H - 64);
  ctx.fillStyle = '#5b4417'; ctx.textAlign = 'center';
  ctx.font = '700 40px Cinzel, Georgia, serif'; ctx.fillText('COMPLAINT', W / 2, 98);
  ctx.font = '700 20px Cinzel, Georgia, serif'; ctx.fillStyle = '#8a6a2a'; ctx.fillText(ref || 'COMPLAINTCA · CANADA', W / 2, 132);
  ctx.textAlign = 'left'; let y = 180;
  for (const [k, l] of FIELDS){
    let v = k === 'id' && FLOW.values.id === 'named' ? FLOW.values.name : FLOW.labels[k];
    ctx.font = '700 21px Cinzel, Georgia, serif'; ctx.fillStyle = '#8a6a2a'; ctx.fillText(l.toUpperCase(), 70, y);
    ctx.font = '600 28px Inter, system-ui, sans-serif'; ctx.fillStyle = v ? '#2b2110' : 'rgba(43,33,16,.18)';
    if (v){ y = wrapText(String(v), 70, y + 34, W - 140, 33, k === 'what' ? 3 : 1); }
    else { ctx.fillRect(70, y + 22, W - 140, 2); y += 44; }
    y += 14;
  }
  tex.needsUpdate = true;
}

// ── Envelope: back panel, front pocket, hinged flap, all edged in gold ──
const env = new THREE.Group(); rig.add(env);
const VIOLET = new THREE.MeshStandardMaterial({ color:0x2a1f5e, roughness:.55, metalness:.25 });
const VIOLET_D = new THREE.MeshStandardMaterial({ color:0x1d1545, roughness:.6, metalness:.25, side:THREE.DoubleSide });
const W2 = 1.1, H2 = .74;
env.add(new THREE.Mesh(new THREE.BoxGeometry(W2 * 2, H2 * 2, .03), VIOLET_D)).position.z = -.05;
const pocket = new THREE.Shape(); pocket.moveTo(-W2, -H2); pocket.lineTo(W2, -H2); pocket.lineTo(W2, .22); pocket.lineTo(0, -.3); pocket.lineTo(-W2, .22); pocket.closePath();
const pocketGeo = new THREE.ExtrudeGeometry(pocket, { depth:.025, bevelEnabled:true, bevelSize:.012, bevelThickness:.008, bevelSegments:2 });
const front = new THREE.Mesh(pocketGeo, VIOLET); front.position.z = .03; env.add(front);
const lineMat = new THREE.LineBasicMaterial({ color:0xe6c98a, transparent:true, opacity:.85 });
const trim = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.ShapeGeometry(pocket)), lineMat); trim.position.z = .068; env.add(trim);
const flapShape = new THREE.Shape(); flapShape.moveTo(-W2, 0); flapShape.lineTo(W2, 0); flapShape.lineTo(0, -.86); flapShape.closePath();
const hinge = new THREE.Group(); hinge.position.set(0, H2, .075); env.add(hinge);
const flap = new THREE.Mesh(new THREE.ExtrudeGeometry(flapShape, { depth:.02, bevelEnabled:false }), VIOLET_D); hinge.add(flap);
const flapTrim = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.ShapeGeometry(flapShape)), lineMat); flapTrim.position.z = .022; hinge.add(flapTrim);

// ── Gold wax seal with a maple leaf, hidden until "send" ──
const sc = document.createElement('canvas'); sc.width = sc.height = 512; const s2 = sc.getContext('2d'); s2.scale(2, 2);
const rg = s2.createRadialGradient(100, 90, 10, 128, 128, 128); rg.addColorStop(0, '#fff3cf'); rg.addColorStop(.55, '#d9b56d'); rg.addColorStop(1, '#8a6a2e');
s2.fillStyle = rg; s2.beginPath(); s2.arc(128, 128, 126, 0, 7); s2.fill();
s2.strokeStyle = 'rgba(90,60,15,.6)'; s2.lineWidth = 6; s2.beginPath(); s2.arc(128, 128, 100, 0, 7); s2.stroke();
s2.fillStyle = 'rgba(90,60,15,.75)'; s2.font = '120px serif'; s2.textAlign = 'center'; s2.textBaseline = 'middle'; s2.fillText('🍁', 128, 136);
const sealTex = new THREE.CanvasTexture(sc); sealTex.colorSpace = THREE.SRGBColorSpace;
const sealSide = new THREE.MeshStandardMaterial({ color:0xb8914a, metalness:.7, roughness:.35 });
const seal = new THREE.Mesh(new THREE.CylinderGeometry(.25, .27, .07, 48), [sealSide, new THREE.MeshStandardMaterial({ map:sealTex, metalness:.6, roughness:.35 }), sealSide]);
seal.rotation.x = Math.PI / 2; seal.position.set(0, H2 - .86 + .06, .14); seal.scale.setScalar(.001); env.add(seal);

// ── Gold dust ──
const N = still ? 0 : 160, pos = new Float32Array(N * 3);
for (let i = 0; i < N; i++){ pos[i*3] = (Math.random() - .5) * 7; pos[i*3+1] = (Math.random() - .5) * 4; pos[i*3+2] = -Math.random() * 3; }
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color:0xf6e7bf, size:.025, transparent:true, opacity:.7, blending:THREE.AdditiveBlending, depthWrite:false }));
scene.add(dust);

// ── State & animation ──
const S = { letterY:.95, flap:Math.PI * .9, seal:0, fly:0, tilt:0, fold:1 };
const T = { ...S };
let px = 0, py = 0;
addEventListener('pointermove', e => { px = e.clientX / innerWidth - .5; py = e.clientY / innerHeight - .5; }, { passive:true });
const URG = { low:0x4ade80, medium:0xf5c563, high:0xff5a6e };
let redraw = 0;
document.addEventListener('cc', e => {
  const d = e.detail;
  if (d.type === 'step'){ T.letterY = .95 + Math.min(d.i, 6) * .02; T.tilt = (d.i % 2 ? 1 : -1) * .05; drawLetter(); }
  if (d.type === 'pick'){ drawLetter(); if (d.key === 'urg') lineMat.color.setHex(URG[d.value]); T.letterY += .12; setTimeout(() => T.letterY -= .12, 260); }
  if (d.type === 'type'){ clearTimeout(redraw); redraw = setTimeout(drawLetter, 120); }
  if (d.type === 'send'){ T.letterY = .35; T.fold = .62; setTimeout(() => T.flap = 0, 650); setTimeout(() => T.seal = 1, 1250); setTimeout(() => T.fly = 1, 1900); }
  if (d.type === 'done'){ drawLetter(d.ref); setTimeout(() => { Object.assign(T, { fly:0, letterY:.95, flap:Math.PI * .9, seal:0, fold:1 }); }, 300); }
});

function resize(){
  const w = host.clientWidth, h = host.clientHeight; renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.position.set(0, .35, Math.max(6.4, 3.9 / camera.aspect + 1.4)); camera.lookAt(0, .2, 0); camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const clock = new THREE.Clock(); let run = true;
document.addEventListener('visibilitychange', () => { run = !document.hidden; if (run) loop(); });
function ease(a, b, k){ return a + (b - a) * k; }
function loop(){
  if (!run) return;
  const t = clock.getElapsedTime(), k = still ? 1 : .085;
  for (const p in T) S[p] = ease(S[p], T[p], p === 'seal' ? .16 : k);
  letter.position.set(0, S.letterY - .35, 0);
  hinge.rotation.x = S.flap; hinge.position.z = -.03 + (1 - S.flap / (Math.PI * .9)) * .105; letter.scale.y = S.fold;
  const sp = S.seal; seal.scale.setScalar(Math.max(.001, sp < .5 ? sp * 3.2 : 1.6 - (sp - .5) * 1.2));
  const sway = still ? 0 : Math.sin(t * .6) * .06;
  rig.rotation.y = ease(rig.rotation.y, px * .45 + sway + T.tilt, .06);
  rig.rotation.x = ease(rig.rotation.x, py * .22, .06);
  rig.position.y = (still ? 0 : Math.sin(t * 1.1) * .05) + S.fly * 2.6;
  rig.position.z = -S.fly * 5; rig.rotation.z = S.fly * .5;
  if (N){ const a = dustGeo.attributes.position.array; for (let i = 1; i < a.length; i += 3){ a[i] += .0025; if (a[i] > 2) a[i] = -2; } dustGeo.attributes.position.needsUpdate = true; }
  renderer.render(scene, camera);
  if (!still || Object.keys(T).some(p => Math.abs(S[p] - T[p]) > .001)) requestAnimationFrame(loop);
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { drawLetter(); loop(); });
if (still) document.addEventListener('cc', () => requestAnimationFrame(loop));
</script>
</body></html>
