<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Maple Leaf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="flow.css">
<style>
/* Study D — "Maple Leaf": a gold-rimmed 3D maple leaf fills with red as each answer is given. */
body{background:radial-gradient(85% 55% at 50% 20%,#2a1648 0%,#150d26 55%,#0b0814 100%);min-height:100dvh;overflow-x:hidden}
.scene{position:relative;height:clamp(290px,46dvh,520px);width:100%;margin-top:calc(env(safe-area-inset-top,0px) + 44px)}
.scene canvas{display:block;width:100%!important;height:100%!important}
.panel{padding:0 18px calc(28px + env(safe-area-inset-bottom,0px))}
.cf{background:linear-gradient(180deg,rgba(36,18,52,.74),rgba(16,10,28,.84));border:1px solid rgba(246,231,191,.16);border-radius:24px;padding:18px 16px 16px;
  box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.cf-dots i.done{background:#d8323f}.cf-dots i.cur{background:#f6e7bf}
.cf-kicker{color:#e05a62}
</style>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
</head><body>
<a class="study-tag" href="./">D · Maple Leaf</a>
<div class="scene" id="scene"></div>
<div class="panel" id="panel"></div>
<script src="flow.js"></script>
<script>CCFlow.mount(document.getElementById('panel')); window.CC_SEND_DELAY = 2300;</script>
<script type="module">
import * as THREE from 'three';
const host = document.getElementById('scene');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.localClippingEnabled = true;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, .1, 60);
scene.add(new THREE.AmbientLight(0xb9a6ff, .7));
const key = new THREE.DirectionalLight(0xfff1d6, 2.6); key.position.set(2, 3, 4); scene.add(key);
const rimL = new THREE.PointLight(0x8b6cff, 25, 10); rimL.position.set(-2.5, 1, -1.5); scene.add(rimL);
const warm = new THREE.PointLight(0xf5c563, 14, 8); warm.position.set(2.2, -1, 2); scene.add(warm);

// ── The 11-point maple leaf: right half mirrored, so it is perfectly symmetric ──
const HALF = [[0,1.0],[.11,.74],[.23,.8],[.19,.44],[.41,.63],[.47,.53],[.7,.57],[.62,.37],[.72,.31],[.41,.06],[.46,-.05],[.06,0],[.06,-.42]];
function leafShape(){
  const s = new THREE.Shape(), pts = HALF.concat(HALF.slice(1).reverse().map(([x, y]) => [-x, y]));
  pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y)); s.closePath(); return s;
}
const shape = leafShape();
const leafGroup = new THREE.Group(); scene.add(leafGroup);
const ext = { depth:.09, bevelEnabled:true, bevelThickness:.035, bevelSize:.03, bevelSegments:4, curveSegments:1 };
const geo = new THREE.ExtrudeGeometry(shape, ext); geo.translate(0, -.29, -.045);
// level of red fill: clip everything above it
const fillPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), -.75);
const RED = new THREE.MeshPhysicalMaterial({ color:0xd52b1e, roughness:.28, metalness:.15, clearcoat:1, clearcoatRoughness:.15, clippingPlanes:[fillPlane] });
const GOLD = new THREE.MeshStandardMaterial({ color:0xe6c98a, roughness:.25, metalness:.95, clippingPlanes:[fillPlane] });
const filled = new THREE.Mesh(geo, [RED, GOLD]); leafGroup.add(filled);
// empty part: smoky violet glass so the shape is always readable
const GHOST = new THREE.MeshPhysicalMaterial({ color:0x3a2a6e, roughness:.4, metalness:.1, transparent:true, opacity:.45 });
const ghost = new THREE.Mesh(geo, [GHOST, GHOST]); ghost.scale.setScalar(.995); leafGroup.add(ghost);
const rimGeo = new THREE.EdgesGeometry(new THREE.ShapeGeometry(shape)); rimGeo.translate(0, -.29, .075);
const rim = new THREE.LineSegments(rimGeo, new THREE.LineBasicMaterial({ color:0xf6e7bf })); leafGroup.add(rim);
// a thin gold "fill line" that rides on top of the red
const lvl = new THREE.Mesh(new THREE.PlaneGeometry(1.6, .012), new THREE.MeshBasicMaterial({ color:0xfff3cf, transparent:true, opacity:.9, clippingPlanes:[] }));
lvl.position.z = .08; leafGroup.add(lvl);

// ── Drifting small leaves (instanced) ──
const small = new THREE.ShapeGeometry(shape); small.translate(0, -.29, 0); small.scale(.09, .09, .09);
const NL = still ? 0 : 36;
const drift = new THREE.InstancedMesh(small, new THREE.MeshStandardMaterial({ color:0xffffff, side:THREE.DoubleSide, roughness:.5, metalness:.3 }), Math.max(NL, 1));
const L = [], m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e3 = new THREE.Euler(), v3 = new THREE.Vector3(), sc = new THREE.Vector3();
for (let i = 0; i < NL; i++){
  L.push({ x:(Math.random() - .5) * 5, y:Math.random() * 4 - 2, z:-Math.random() * 2 - .4, vx:0, vy:-.004 - Math.random() * .004, r:Math.random() * 6, vr:(Math.random() - .5) * .04, s:.6 + Math.random() * .8 });
  drift.setColorAt(i, new THREE.Color(i % 3 ? 0xd52b1e : 0xe6c98a));
}
if (!NL) drift.visible = false;
scene.add(drift);
function gust(n, up){ for (let i = 0; i < Math.min(n, NL); i++){ const l = L[(Math.random() * NL) | 0]; l.x = (Math.random() - .5) * .8; l.y = -.2; l.z = .3; l.vx = (Math.random() - .5) * .06; l.vy = up ? .03 + Math.random() * .04 : .01 + Math.random() * .02; } }

let level = 0, levelT = 0, spin = 0, spinT = 0, px = 0, py = 0, pulse = 0;
const LOW = -.75, HIGH = .78; // leaf bottom / top in group space
addEventListener('pointermove', e => { px = e.clientX / innerWidth - .5; py = e.clientY / innerHeight - .5; }, { passive:true });
const URG = { low:0x4ade80, medium:0xf5c563, high:0xff5a6e };
document.addEventListener('cc', e => {
  const d = e.detail;
  if (d.type === 'step') levelT = d.i / d.n;
  if (d.type === 'pick'){ pulse = 1; gust(5); if (d.key === 'urg') warm.color.setHex(URG[d.value]); }
  if (d.type === 'thinking'){ pulse = 1.2; gust(8); }
  if (d.type === 'send'){ levelT = 1; spinT += Math.PI * 2; setTimeout(() => gust(36, true), 700); }
  if (d.type === 'done'){ levelT = 1; pulse = 1.4; }
});
function resize(){
  const w = host.clientWidth, h = host.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), dist = Math.max(2.1 / 2 / tv, 2.0 / 2 / (tv * camera.aspect));
  camera.position.set(0, 0, dist); camera.lookAt(0, 0, 0); camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let run = true; document.addEventListener('visibilitychange', () => { run = !document.hidden; if (run) loop(); });
const clock = new THREE.Clock();
function loop(){
  if (!run) return;
  const t = clock.getElapsedTime();
  level += (levelT - level) * (still ? 1 : .05);
  spin += (spinT - spin) * .045;
  pulse *= .93;
  const y = LOW + (HIGH - LOW) * level;
  fillPlane.constant = y; lvl.visible = false;
  leafGroup.rotation.y = spin + (still ? 0 : Math.sin(t * .7) * .28) + px * .5;
  leafGroup.rotation.x = py * .25 + (still ? 0 : Math.sin(t * .9) * .05);
  leafGroup.position.y = still ? 0 : Math.sin(t * 1.2) * .04;
  leafGroup.scale.setScalar(1 + pulse * .06);
  RED.emissive.setRGB(.25 * pulse, .02 * pulse, 0);
  for (let i = 0; i < NL; i++){
    const l = L[i]; l.x += l.vx + Math.sin(t + i) * .002; l.y += l.vy; l.r += l.vr; l.vx *= .985; l.vy += (-.005 - l.vy) * .02;
    if (l.y < -2.2 || l.y > 2.6){ l.y = 2.2; l.x = (Math.random() - .5) * 5; l.z = -Math.random() * 2 - .4; l.vx = 0; }
    e3.set(l.r * .7, l.r, l.r * .3); q.setFromEuler(e3); m4.compose(v3.set(l.x, l.y, l.z), q, sc.setScalar(l.s)); drift.setMatrixAt(i, m4);
  }
  if (NL){ drift.instanceMatrix.needsUpdate = true; }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body></html>
