<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Case Pool — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#e6c35c;--gold2:#e6c98a;--cream:#fff6dc;--mute:#a9b0c4;--line:rgba(230,201,138,.22)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#eef0f6;font-family:-apple-system,'Segoe UI',Inter,system-ui,sans-serif;
  background:radial-gradient(75% 42% at 50% 12%,#16305c 0%,#0b1d3d 60%,#071326 100%) fixed}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px 40px}
.top{text-align:center;margin-bottom:18px}
.eyebrow{font:700 .66rem/1 'Cinzel',Georgia,serif;letter-spacing:.32em;text-transform:uppercase;color:#f6e7bf}
h1{font:700 1.35rem/1.2 'Cinzel',Georgia,serif;letter-spacing:.06em;color:var(--cream);margin:10px 0 6px}
.sub{color:var(--mute);font-size:.84rem;margin:0}
.rule{height:1.5px;margin:12px 28px 0;background:linear-gradient(90deg,transparent,var(--gold) 25%,#f3dc8c 50%,var(--gold) 75%,transparent)}

.filter{position:relative;display:block;margin-top:14px}
.filter select{width:100%;appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:999px;color:var(--cream);font:600 .84rem/1 -apple-system,'Segoe UI',Inter,sans-serif;padding:11px 40px 11px 16px;outline:0;cursor:pointer}
.filter select:focus{border-color:var(--gold)}
.filter option{background:#0b1d3d;color:#eef0f6}
.filter .chev{position:absolute;right:16px;top:50%;transform:translateY(-55%);pointer-events:none}
.list{margin-top:10px;border-top:1px solid var(--line)}
.row{border-bottom:1px solid var(--line)}
.sum{width:100%;display:flex;align-items:center;gap:12px;padding:14px 4px;background:none;border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.ico{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(230,201,138,.45);color:var(--gold2);background:rgba(230,195,92,.06)}
.ico svg{width:18px;height:18px}
.txt{flex:1;min-width:0}
.t{display:block;color:var(--cream);font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{display:block;color:var(--mute);font-size:.76rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.dot.high{background:#ff5a6e;box-shadow:0 0 10px #ff5a6e}.dot.low{background:#5fe0a0;box-shadow:0 0 10px #5fe0a0}
.chev{flex:none;color:var(--gold2);font-size:1.1rem;transition:transform .25s}
.row.open .chev{transform:rotate(180deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.row.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.inner{padding:0 4px 16px 52px}
.desc{color:#d9deea;font-size:.88rem;line-height:1.55;margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.04em;color:var(--gold2);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.odds{margin:0 0 14px;padding:12px 12px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}
.odds-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.odds-h small{color:var(--mute);font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.odds-h b{font:700 1.05rem/1 'Cinzel',Georgia,serif;color:var(--cream)}
.bar{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:visible}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar i.hi{background:linear-gradient(90deg,#3fbf86,#5fe0a0)}.bar i.mid{background:linear-gradient(90deg,#d9b55a,#f3dc8c)}.bar i.lo{background:linear-gradient(90deg,#d8485c,#ff7a8a)}
.bar u{position:absolute;top:-4px;width:2px;height:16px;background:#fff6dc;opacity:.7;border-radius:2px}
.odds-f{display:flex;justify-content:space-between;gap:8px;margin-top:8px;color:var(--mute);font-size:.72rem}
.odds-n{color:#6f7891;font-size:.66rem;margin-top:6px;line-height:1.4}
.lock{display:flex;align-items:center;gap:8px;color:var(--gold2);font:600 .66rem/1.3 'Cinzel',Georgia,serif;letter-spacing:.12em;text-transform:uppercase}
.lock svg{width:14px;height:14px;flex:none}

.cta{margin-top:22px;text-align:center;padding:18px 16px;border-radius:18px;background:linear-gradient(180deg,#12294f,#0a1a38);border:1px solid var(--line)}
.cta p{margin:0 0 12px;color:#d9deea;font-size:.86rem;line-height:1.5}
.btn{display:inline-block;border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:.86rem;color:#1a1405;background:linear-gradient(180deg,#f3dc8c,#d9b55a);cursor:pointer}
.demo{margin-top:18px;text-align:center;color:#6f7891;font-size:.72rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow">For legal professionals</div>
    <h1>The Case Pool</h1>
    <div class="rule"></div>
  </div>

  <label class="filter"><select id="chips" aria-label="Category"></select><span class="chev">⌄</span></label>
  <div class="list" id="list"></div>

  <div class="cta">
    <p>Want full contact details on these cases? Partner Lawyer access is a flat monthly fee — unrelated to case outcome.</p>
    <button class="btn" type="button">Become a Partner Lawyer</button>
  </div>
  <p class="demo">DEMO · sample figures, not real case data</p>
</div>

<script>
const IC = {
  education:'<path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M7 11.5V16c0 1.2 2.2 2.5 5 2.5s5-1.3 5-2.5v-4.5"/>',
  rights:'<path d="M12 3v18M5 7h14"/><path d="M5 7l-3 6a3 3 0 006 0L5 7zM19 7l-3 6a3 3 0 006 0l-3-6z"/>',
  billing:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>'
};
const svg = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
const CASES = [
  { cat:'education', label:'Education', pr:'high', where:'Ontario', ago:'10h ago', odds:62, avg:48, n:14, title:'School broke promise of class change for a student with special needs',
    desc:'A parent reports that a school in Ontario repeatedly promised to move their child, a student with special learning needs, to another class with their long-time peer group, then reversed the decision without explanation while another student was allowed to move. The student is being bullied in the current class.' },
  { cat:'rights', label:'Discrimination / Rights', pr:'high', where:'Canada', ago:'49d ago', odds:31, avg:40, n:22, title:'Defamation of character',
    desc:'The complainant alleges that two businesses published photographs, vehicle images and statements about them without consent, damaging their reputation in the community.' },
  { cat:'billing', label:'Billing / Overcharge', pr:'medium', where:'Penticton, BC', ago:'46d ago', odds:74, avg:58, n:31, title:'Collection agency',
    desc:'The complainant is dealing with a collection agency that keeps suggesting they borrow money to pay a disputed debt, and asks whether these practices are allowed.' }
];
let filter = '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chips(){
  const counts = {};
  CASES.forEach(c => counts[c.label] = (counts[c.label] || 0) + 1);
  const all = [['', 'All categories', CASES.length], ...Object.entries(counts).map(([l, n]) => [l, l, n])];
  document.getElementById('chips').innerHTML = all.map(([v, l, n]) =>
    '<option value="' + esc(v) + '"' + (v === filter ? ' selected' : '') + '>' + esc(l) + ' (' + n + ')</option>').join('');
}
// Estimated chance of success vs. similar decided cases (demo figures).
function odds(c){
  const k = c.odds >= 60 ? 'hi' : c.odds >= 40 ? 'mid' : 'lo';
  const word = { hi:'Strong', mid:'Moderate', lo:'Weak' }[k];
  return '<div class="odds"><div class="odds-h"><small>Estimated success</small><b>' + c.odds + '% · ' + word + '</b></div>' +
    '<div class="bar"><i class="' + k + '" data-w="' + c.odds + '"></i><u style="left:' + c.avg + '%" title="Average of similar cases"></u></div>' +
    '<div class="odds-f"><span>Similar cases avg: ' + c.avg + '%</span><span>' + c.n + ' comparable decisions</span></div>' +
    '<div class="odds-n">Estimate from similar published decisions — not a guarantee or legal advice.</div></div>';
}
function list(){
  document.getElementById('list').innerHTML = CASES.filter(c => !filter || c.label === filter).map(c =>
    '<div class="row">' +
      '<button class="sum" type="button" aria-expanded="false">' +
        '<span class="ico">' + svg(IC[c.cat]) + '</span>' +
        '<span class="txt"><span class="t">' + esc(c.title) + '</span><span class="m">' + esc(c.label) + ' · ' + esc(c.where) + ' · ' + esc(c.ago) + '</span></span>' +
        '<i class="dot ' + c.pr + '"></i><span class="chev">⌄</span>' +
      '</button>' +
      '<div class="body"><div><div class="inner">' +
        '<p class="desc">' + esc(c.desc) + '</p>' +
        odds(c) +
        '<div class="tags"><span class="tag">' + esc(c.label) + '</span><span class="tag">' + esc(c.where) + '</span></div>' +
        '<div class="lock">' + svg(IC.lock) + 'Contact details locked — Partner lawyers only</div>' +
      '</div></div></div>' +
    '</div>').join('');
}
document.addEventListener('click', e => {
  const s = e.target.closest('.sum');
  if (s) { const r = s.parentElement, on = !r.classList.contains('open'); r.classList.toggle('open', on); s.setAttribute('aria-expanded', on);
    r.querySelectorAll('.bar i').forEach(b => { b.style.width = on ? b.dataset.w + '%' : '0'; }); }
});
document.getElementById('chips').addEventListener('change', e => { filter = e.target.value; list(); });
chips(); list();
</script>
</body>
</html>
