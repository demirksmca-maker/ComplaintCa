    ["14. Öğrenci kredisi", "NSLSC", "14/20 aşama. Konu: öğrenci kredisi (NSLSC) şikayeti ve iletişim. Sorgularda \"nslsc contact\" ve \"1-800-983-8472\" var. Bakılacak sayfalar: blog/student-loan-repayment-assistance-canada.html, guides/student-loan-complaint-canada-guide.html.\n\nHer sayfada kontrol et ve eksik olanı ekle: (a) en üstte tek cümlelik net cevap, (b) numaralı kısa adımlar (kime, ne, ne kadar sürer; kurum adı tam), (c) başvuruya ne yazılır listesi, (d) kurumun neyi yapabilip neyi yapamadığını söyleyen tek cümle, (e) 4-5 kısa SSS + FAQPage şeması, (f) dateModified güncel. Önce sayfa başına 1 satırlık eksik raporu yaz, sonra ekle.\n\nBitince sırayla: (1) AXX1 kontrolü: URL, başlık, içerik silme, yönlendirme var mı, sonucu 1 satırda yaz. (2) node --test ile tüm testleri çalıştır. (3) /code-review ile incele. (4) Sorun yoksa main'e birleştir ve canlıda mı diye 1 satırda haber ver. Kural: bilgiyi resmi kaynaktan veya aramayla doğrula; doğrulayamadığını yazma. Mevcut URL ve içerik silinmez, sadece eklenir."],
    ["15. Araba bayi / tamirci", "OMVIC", "15/20 aşama. Konu: araba bayisi ve tamirci şikayeti. Bakılacak sayfalar: blog/omvic-car-dealer-dispute-ontario.html, guides/car-dealer-mechanic-complaint-canada-guide.html.\n\nHer sayfada kontrol et ve eksik olanı ekle: (a) en üstte tek cümlelik net cevap, (b) numaralı kısa adımlar (kime, ne, ne kadar sürer; kurum adı tam), (c) başvuruya ne yazılır listesi, (d) kurumun neyi yapabilip neyi yapamadığını söyleyen tek cümle, (e) 4-5 kısa SSS + FAQPage şeması, (f) dateModified güncel. Önce sayfa başına 1 satırlık eksik raporu yaz, sonra ekle.\n\nBitince sırayla: (1) AXX1 kontrolü: URL, başlık, içerik silme, yönlendirme var mı, sonucu 1 satırda yaz. (2) node --test ile tüm testleri çalıştır. (3) /code-review ile incele. (4) Sorun yoksa main'e birleştir ve canlıda mı diye 1 satırda haber ver. Kural: bilgiyi resmi kaynaktan veya aramayla doğrula; doğrulayamadığını yazma. Mevcut URL ve içerik silinmez, sadece eklenir."],
    ["16. Telefon numarası sayfaları", "334 sorgunun 88'i numara araması", "16/20 aşama. Search Console'da 334 sorgunun 88'i telefon numarası veya müşteri hizmetleri araması (örnek: \"hydro one customer service phone number\", \"tim hortons phone number canada\", \"1-800-983-8472\"), çoğu 0 tık. Plan: önce hangi markaların numara sorgusu aldığını listele (rapor). Sonra sadece resmi kaynaktan doğrulanabilen numaralar için, ilgili marka yazısına \"Telefon numarası\" bölümü ekle (numara, ne zaman aranır, sonraki adım). Yeni sayfa açma; önce mevcut markalı yazıya ekle. Doğrulanamayan numarayı yazma.\n\n\n\nBitince sırayla: (1) AXX1 kontrolü: URL, başlık, içerik silme, yönlendirme var mı, sonucu 1 satırda yaz. (2) node --test ile tüm testleri çalıştır. (3) /code-review ile incele. (4) Sorun yoksa main'e birleştir ve canlıda mı diye 1 satırda haber ver. Kural: bilgiyi resmi kaynaktan veya aramayla doğrula; doğrulayamadığını yazma. Mevcut URL ve içerik silinmez, sadece eklenir."],
    ["17. Türkçe sorgular", "AI Mode Türkçe cevap veriyor", "17/20 aşama. Google AI Mode, \"Toronto sigorta\" ve \"Toronto öğretmen şikayet\" gibi Türkçe sorgularda İngilizce sayfalarımızı çevirip kaynak gösteriyor. Dosya değiştirme; sadece rapor yaz: hangi 5 konunun Türkçe aranma ihtimali en yüksek, bu konular için mevcut İngilizce sayfalar AI alıntısına yeterli mi, ve ayrı Türkçe sayfa gerekir mi (öneri: evet/hayır, nedeni).\n\n\n\nBu aşamada hiçbir dosyayı yayınlama ve main'e birleştirme. Sonucu kısa yaz, onayımı bekle. Onaylarsam: AXX1 kontrolü, node --test, /code-review, sonra main'e birleştir. Kural: bilgiyi resmi kaynaktan veya aramayla doğrula; doğrulayamadığını yazma."],
    ["18. Aylık şikayet raporu", "Dışarıdan link için ana hamle", "18/20 aşama. ComplaintCA'nın kendi şikayet istatistiklerinden (complaint_stats aracı, kişisel veri olmadan) basının ve blogcuların link vereceği bir \"aylık şikayet raporu\" taslağı hazırla: en çok şikayet edilen konular, kategori dağılımı, bir de basit grafik. Yayınlamadan önce bana göster. Rakamı uydurma; sadece araçtan gelen veriyi yaz.\n\n\n\nBu aşamada hiçbir dosyayı yayınlama ve main'e birleştirme. Sonucu kısa yaz, onayımı bekle. Onaylarsam: AXX1 kontrolü, node --test, /code-review, sonra main'e birleştir. Kural: bilgiyi resmi kaynaktan veya aramayla doğrula; doğrulayamadığını yazma."],
    ["19. Yazar ve güven sayfası", "About / doğrulama süreci", "19/20 aşama. about.html sayfasını güven için güçlendir: sitenin kim tarafından işletildiği, bilgilerin nasıl doğrulandığı, hangi resmi kaynaklara bakıldığı, düzeltme nasıl bildirilir. Sadece gerçek ve doğrulanabilir bilgiyi yaz; uydurma kimlik, unvan veya ödül yazma. Önce taslağı bana göster.\n\n\n\nBu aşamada hiçbir dosyayı yayınlama ve main'e birleştirme. Sonucu kısa yaz, onayımı bekle. Onaylarsam: AXX1 kontrolü, node --test, /code-review, sonra main'e birleştir. Kural: bilgiyi resmi kaynaktan veya aramayla doğrula; doğrulayamadığını yazma."],
    ["20. Başlık ve açıklama düzeltmesi", "Sırası iyi ama tıklanmayan sayfalar", "20/20 aşama. Search Console'da sırası 3-8 olup tıklanmayan sayfaların (ör. ontario-energy-bill-dispute-winter-ban, mcdonalds-complaint-canada, fake-cra-letter) title ve meta description'ını daha net ve tıklanır yap. Sadece title ve description değişir; URL, H1 ve içerik aynı kalır. Önce eski ve yeni başlıkları tablo yapmadan, sayfa başına 1 satırda göster.\n\n\n\nBitince sırayla: (1) AXX1 kontrolü: URL, başlık, içerik silme, yönlendirme var mı, sonucu 1 satırda yaz. (2) node --test ile tüm testleri çalıştır. (3) /code-review ile incele. (4) Sorun yoksa main'e birleştir ve canlıda mı diye 1 satırda haber ver. Kural: bilgiyi resmi kaynaktan veya aramayla doğrula; doğrulayamadığını yazma. Mevcut URL ve içerik silinmez, sadece eklenir."],
    ["Search Console kontrolü", "Hastane sorgularında görünüyor muyuz?", "Search Console Performance ekran görüntüsünü atacağım. Şunları oku: \"hospital complaint Ontario/Toronto\" gibi sorgularda gösterim, tıklama, ortalama sıra; 0 tıklı sayfalar. Hiçbir dosyayı değiştirme, sadece 5 satırda raporla."],
    ["Hastane rehberi: Ontario bölümü", "guides/healthcare-complaint-canada-guide.html", "guides/healthcare-complaint-canada-guide.html dosyasına Toronto/Ontario hastane şikayeti bölümü ekle. Sıra: hastanenin Patient Relations birimi, sonra Patient Ombudsman, doktor için CPSO. Telefon, form ve adresleri resmi sayfadan doğrula; doğrulayamadığını yazma. Başlık ve meta açıklamayı \"how to file a hospital complaint in Ontario\" aramasına göre yaz, URL değişmesin. En üstte net cevap kutusu, 3-5 SSS + FAQPage şeması, dateModified ve sitemap lastmod güncelle. Sonra AXX1, testler, /code-review, canlıya al."],
    ["Ana sayfada Türkçe metin listesi", "Sadece liste, değişiklik yok", "index.html içinde İngilizce sayfada görünen Türkçe metinleri bul (örneğin Milletvekiline İlet, Havuz, Güvenli Belge Doğrulama Merkezi). Hiçbir şeyi değiştirme. Çıktı: satır no, metin, önerilen İngilizce karşılık. Hangilerinin Asya veya panel işlevi için bilerek orada durduğunu da belirt."],
    ["Dış bağlantı listesi", "Toronto / Ontario kurumları", "Toronto ve Ontario'da ComplaintCA rehberine link verebilecek 15 gerçek kurum bul (community legal clinic, hasta hakları grubu, göçmen yerleşim servisi). Her biri için iletişim sayfası URL'si ver, doğrulayamadığını listeye koyma. Sonra kısa, sıcak, profesyonel İngilizce tek bir tanıtım e-postası şablonu yaz. Hiçbir şey gönderme."],
    ["İspanya sitesi: kurum linkleri", "es/ altındaki resmi linkler", "es/ klasöründeki yetkili kurum linklerini ve telefonları tek tek resmi kaynaktan doğrula. Önce rapor ver (doğru, yanlış, doğrulanamadı). Hiçbir dosyayı değiştirme, onayımı bekle."]
  ];
  var list = document.getElementById('list'), msg = document.getElementById('msg');
  function copy(text) {
    var box = document.createElement('textarea');
    box.value = text; box.style.position = 'fixed'; box.style.opacity = '0';
    document.body.appendChild(box); box.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { /* not supported */ }
    box.remove();
    return ok;
  }
