<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Şikayet Hazır — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#160a1c}
body{min-height:100dvh;color:#fff;font-family:Inter,system-ui,sans-serif;background:linear-gradient(rgba(34,10,40,.62),rgba(22,6,28,.86)),#160a1c url(/assets/brand/flag-aubergine-wave.webp) center/cover fixed no-repeat;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px calc(28px + env(safe-area-inset-bottom,0px))}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
@keyframes up{from{transform:translateY(14px);opacity:0}}
@keyframes gild{50%{background-position:100% 0}}
@keyframes shine{40%,100%{transform:translateX(120%)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}

h1{text-align:center;font:700 24px/1.15 Cinzel,Georgia,serif;letter-spacing:.04em;font-variant:small-caps;background:linear-gradient(100deg,#fff 30%,#d5b9eb 50%,#fff 70%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gild 6s ease-in-out infinite}
.sub{text-align:center;margin:6px auto 16px;max-width:380px;font:italic 400 17px/1.35 'EB Garamond',Georgia,serif;color:rgba(213,185,235,.9)}
.quote{position:relative;padding:2px 0 2px 14px;margin:0 4px 16px;font:italic 400 17px/1.35 'EB Garamond',Georgia,serif;color:#eadcf3}
.quote::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:1.5px;background:linear-gradient(180deg,transparent,#cfb0e8 20%,#cfb0e8 80%,transparent)}
.quote cite{display:flex;align-items:center;gap:8px;margin-top:6px;font:700 11px/1 Cinzel,Georgia,serif;font-style:normal;letter-spacing:.24em;color:#cfb0e8}
.quote cite::before{content:"";width:22px;height:1px;background:linear-gradient(90deg,transparent,#cfb0e8)}

/* 6 cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{--a:0deg;position:relative;overflow:hidden;min-height:150px;padding:14px;border-radius:16px;border:1px solid rgba(244,214,255,.22);background:var(--g);box-shadow:inset 0 1px 0 rgba(255,230,250,.22),inset 0 -20px 40px -20px rgba(20,4,30,.6),0 14px 30px -18px rgba(190,24,93,.55);display:flex;flex-direction:column;justify-content:space-between;text-align:right;cursor:pointer;animation:up .6s ease-out both;transition:transform .2s,filter .2s}
.card:active{transform:scale(.97)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 0% 0%,rgba(255,220,245,.22),transparent 55%)}
.card>*{position:relative}
.card svg{width:30px;height:30px;stroke:#fff;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.card .n{position:absolute;top:12px;right:14px;font:700 12px/1 Cinzel,Georgia,serif;font-style:normal;color:rgba(211,181,234,.75)}
.card b{display:block;font:700 16px/1.2 Cinzel,Georgia,serif;font-variant:small-caps;letter-spacing:.02em}
.card span{display:block;margin-top:4px;font:italic 400 15px/1.3 'EB Garamond',Georgia,serif;color:rgba(213,185,235,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ok{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#f3ecff,#cdb6f5);color:#2a0814;display:none;place-items:center;font:800 14px/1 Inter,sans-serif}
.card.done .ok{display:grid}.card.done .n{display:none}
.card:nth-child(1){--g:linear-gradient(155deg,rgba(138,92,246,.55),rgba(88,28,135,.38) 55%,rgba(46,16,80,.3))}
.card:nth-child(2){--g:linear-gradient(155deg,rgba(190,24,93,.55),rgba(120,20,70,.38) 55%,rgba(60,10,40,.3));animation-delay:.06s}
.card:nth-child(3){--g:linear-gradient(155deg,rgba(124,58,237,.55),rgba(109,40,140,.38) 55%,rgba(50,14,70,.3));animation-delay:.12s}
.card:nth-child(4){--g:linear-gradient(155deg,rgba(225,29,72,.55),rgba(136,19,55,.38) 55%,rgba(70,10,35,.3));animation-delay:.18s}
.card:nth-child(5){--g:linear-gradient(155deg,rgba(168,85,247,.55),rgba(126,34,206,.38) 55%,rgba(60,12,90,.3));animation-delay:.24s}
.card:nth-child(6){--g:linear-gradient(155deg,rgba(159,18,57,.55),rgba(97,22,90,.38) 55%,rgba(45,10,55,.3));animation-delay:.30s}
/* card I = the main action: glowing ring */
.card.main::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;background:conic-gradient(from var(--a),transparent,#f9a8d4,#fff,#c4b5fd,transparent 40%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3.5s linear infinite}
.card.main.done::after{display:none}

.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 4px;color:#cfb0e8}
.orn i{display:block;width:56px;height:1px;background:linear-gradient(90deg,transparent,#cfb0e8)}.orn i:last-child{transform:scaleX(-1)}
.note{margin-top:10px;text-align:center;font:italic 400 16px/1.35 'EB Garamond',Georgia,serif;color:rgba(213,185,235,.85)}

/* sheet */
.dim{position:fixed;inset:0;z-index:10;background:rgba(10,2,14,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:11;width:min(560px,100%);max-height:86dvh;overflow:auto;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);background:#14040f radial-gradient(ellipse 95% 60% at 50% 0%,#4a0b2e,#24091c 55%,#14040f);border:1px solid rgba(196,160,255,.5);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:translate(-50%,0)}
.grab{width:42px;height:4px;margin:0 auto 12px;border-radius:4px;background:rgba(207,176,232,.4)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sh h2{font:700 19px/1.2 Cinzel,Georgia,serif;font-variant:small-caps;letter-spacing:.03em}
.x{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid rgba(196,160,255,.45);background:rgba(24,4,16,.5);font-size:18px;cursor:pointer}
.p{font:400 17px/1.45 'EB Garamond',Georgia,serif;color:#eadcf3}
.p em{color:#d5b9eb}

/* summary rows */
.sum{display:grid;gap:8px;margin:4px 0 4px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(24,4,16,.5);border:1px solid rgba(196,160,255,.25);font:400 16px/1.3 'EB Garamond',Georgia,serif}
.sum small{font:700 10.5px/1.6 Cinzel,Georgia,serif;letter-spacing:.14em;color:#cfb0e8;flex:none}
.sum span{text-align:right}

/* rights accordion */
.acc{border:1px solid rgba(196,160,255,.3);border-radius:14px;background:rgba(24,4,16,.45);margin-bottom:8px;overflow:hidden}
.acc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font:600 16.5px/1.25 'EB Garamond',Georgia,serif}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";margin-left:auto;font:400 20px/1 Inter;color:#cfb0e8;transition:transform .2s}
.acc[open] summary::after{transform:rotate(45deg)}
.acc summary i{display:grid;place-items:center;width:26px;height:26px;flex:none;border-radius:8px;background:rgba(110,45,180,.5);font:700 11px/1 Cinzel,serif;font-style:normal}
.acc .p{padding:0 14px 14px 50px;font-size:16px}
.law{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:6px;background:#2e0f52;border:1px solid rgba(196,160,255,.45);font:700 10px/1.4 Cinzel,serif;letter-spacing:.08em;color:#d5b9eb}
.prog{height:4px;border-radius:4px;background:rgba(207,176,232,.2);margin:4px 0 12px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b36bff,#f9a8d4);transition:width .3s}

/* institution picker */
.inst{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:8px;border-radius:14px;border:1px solid rgba(196,160,255,.35);background:rgba(24,4,16,.45);text-align:left;cursor:pointer}
.inst .bx{width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid rgba(207,176,232,.7);display:grid;place-items:center;font:800 13px/1 Inter;color:transparent}
.inst div{flex:1;min-width:0}
.inst b{display:block;font:500 17px/1.2 'EB Garamond',Georgia,serif}
.inst small{display:block;margin-top:2px;font:italic 400 14px/1.25 'EB Garamond',Georgia,serif;color:rgba(213,185,235,.75)}
.inst em{flex:none;font:700 9.5px/1 Cinzel,serif;font-style:normal;letter-spacing:.1em;padding:5px 7px;border-radius:6px;background:#2e0f52;border:1px solid rgba(196,160,255,.5)}
.inst.on{background:linear-gradient(180deg,#f3ecff,#cdb6f5);border-color:#fff;color:#2a0814}
.inst.on small{color:#5a1d9a}.inst.on .bx{background:#5a1d9a;border-color:#5a1d9a;color:#fff}.inst.on em{background:#5a1d9a;color:#fff}

/* letter preview */
.letter{padding:16px;border-radius:12px;background:#f6ecd9;color:#2a0814;font:400 16px/1.45 'EB Garamond',Georgia,serif;box-shadow:inset 0 0 30px rgba(120,80,40,.15)}
.letter p+p{margin-top:10px}

/* toggles */
.tg{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:10px;border-radius:14px;background:rgba(24,4,16,.45);border:1px solid rgba(196,160,255,.3);cursor:pointer}
.tg div{flex:1;font:400 16px/1.3 'EB Garamond',Georgia,serif}
.tg i{position:relative;width:44px;height:26px;flex:none;border-radius:99px;background:rgba(207,176,232,.25);transition:background .2s}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on i{background:#8b3fd1}.tg.on i::after{transform:translateX(18px)}

.power{display:flex;align-items:center;gap:16px;padding:14px 16px;margin-bottom:10px;border-radius:18px;border:1px solid rgba(244,214,255,.25);background:linear-gradient(155deg,rgba(74,26,94,.75),rgba(36,9,28,.75));box-shadow:inset 0 1px 0 rgba(255,230,250,.18),0 14px 30px -18px rgba(190,24,93,.55)}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke:rgba(207,176,232,.18)}
.ring #pw-arc{stroke:var(--pc,#f97316);stroke-linecap:round;stroke-dasharray:20 100;transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1),stroke .4s;filter:drop-shadow(0 0 6px var(--pc,#f97316))}
.ring strong{position:absolute;inset:0;display:grid;place-items:center;font:700 18px/1 Cinzel,serif}
.pw-t small{font:700 10.5px/1 Cinzel,serif;letter-spacing:.2em;color:#cfb0e8}
.pw-t b{display:block;margin:5px 0 3px;font:700 20px/1 Cinzel,serif;font-variant:small-caps;color:var(--pc,#f97316);transition:color .4s}
.pw-t span{display:block;font:italic 400 15px/1.3 'EB Garamond',Georgia,serif;color:rgba(234,220,243,.85)}
.power.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.03)}}
.owed{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:14px;border-radius:14px;border:1px dashed rgba(246,200,168,.55);background:rgba(246,200,168,.08);font:400 16px/1.35 'EB Garamond',Georgia,serif;color:#f7eef1}
.owed span{font-size:22px}.owed b{color:#f6c8a8;font-size:18px}.owed em{color:#d5b9eb}
.flag{position:absolute;top:10px;right:10px;z-index:3;padding:5px 8px;border-radius:999px;background:linear-gradient(90deg,#ff4d79,#b36bff);font:700 9px/1 Cinzel,serif;font-style:normal;letter-spacing:.12em;color:#fff;box-shadow:0 2px 10px rgba(255,77,121,.5);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 18px rgba(255,77,121,.9)}}
.card .flag~.n{display:none}
.card.done .flag{display:none}
.cited{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 10px;border-radius:999px;background:rgba(134,239,172,.14);border:1px solid rgba(134,239,172,.5);color:#bbf7d0;font:700 10.5px/1 Cinzel,serif;letter-spacing:.08em;animation:pop .4s both}
.letter .law-c{background:rgba(139,63,209,.14);border-radius:4px;padding:0 3px}
.warn{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.5);font:400 16px/1.35 'EB Garamond',Georgia,serif;color:#fed7aa}
[hidden]{display:none!important}
.in-frame .wrap{padding-top:64px}
.demo-sw{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 16px;padding:8px;border-radius:14px;border:1px dashed rgba(207,176,232,.4);background:rgba(10,2,14,.35)}
.demo-sw small{font:700 9.5px/1 Cinzel,serif;letter-spacing:.16em;color:#cfb0e8;margin:0 4px}
.demo-sw button{padding:7px 11px;border-radius:999px;border:1px solid rgba(196,160,255,.45);background:transparent;font:500 15px/1 'EB Garamond',Georgia,serif;cursor:pointer}
.demo-sw button.on{background:linear-gradient(180deg,#f3ecff,#cdb6f5);color:#2a0814;border-color:#fff}
.safe{margin-bottom:14px;padding:14px 16px;border-radius:16px;background:linear-gradient(155deg,rgba(124,58,237,.35),rgba(46,16,80,.5));border:1px solid rgba(196,160,255,.4);font:400 17px/1.4 'EB Garamond',Georgia,serif;color:#f3eaff}
.safe a{color:#fff;font-weight:600}
.help em{background:#5a1d9a;font-size:10.5px}
.ghost-x{display:block;width:100%;margin-top:6px;padding:12px;border-radius:999px;border:1px solid rgba(207,176,232,.45);background:transparent;color:#d5b9eb;font:700 11px/1 Cinzel,serif;letter-spacing:.14em;cursor:pointer}
.find{display:flex;gap:8px}
.in{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid rgba(196,160,255,.45);background:rgba(24,4,16,.6);color:#f7eef1;font:400 17px/1.3 'EB Garamond',Georgia,serif;outline:none}
.in:focus{border-color:#d5b9eb}
.fbtn{flex:none;padding:0 18px;border-radius:12px;border:1px solid rgba(214,190,255,.4);background:linear-gradient(180deg,#8b3fd1,#5a1d9a 55%,#3a0f68);font:700 13px/1 Cinzel,serif;letter-spacing:.1em;cursor:pointer}
.res{color:#f7eef1;text-decoration:none;cursor:default}a.res{cursor:pointer}
.res .av{width:44px;height:44px;flex:none;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:rgba(110,45,180,.5);font-size:20px}
.res .av img{width:100%;height:100%;object-fit:cover}
.res .mini{display:inline-block;margin-top:6px;padding:6px 10px;border-radius:999px;border:1px solid rgba(196,160,255,.5);color:#eadcf3;text-decoration:none;font:700 10.5px/1 Cinzel,serif;letter-spacing:.08em}
.refbox{text-align:center;padding:16px;border-radius:16px;background:linear-gradient(155deg,rgba(138,92,246,.5),rgba(190,24,93,.35));border:1px solid rgba(244,214,255,.28)}
.refbox small{font:700 11px/1 Cinzel,serif;letter-spacing:.2em;color:#cfb0e8}
.refbox strong{display:block;margin-top:8px;font:700 22px/1 Cinzel,serif;letter-spacing:.1em}
.steps{display:grid;gap:10px;margin-top:14px}
.steps div{display:flex;gap:12px;align-items:center;font:400 16px/1.3 'EB Garamond',Georgia,serif;color:rgba(234,220,243,.6)}
.steps div::before{content:"";width:12px;height:12px;flex:none;border-radius:50%;border:1.5px solid rgba(207,176,232,.6)}
.steps div.on{color:#fff}.steps div.on::before{background:#86efac;border-color:#86efac;box-shadow:0 0 10px #86efac}

/* buttons */
.go{--a:0deg;position:relative;overflow:hidden;display:flex;width:100%;align-items:center;justify-content:center;gap:12px;margin-top:14px;padding:16px 20px;border:1.5px solid transparent;border-radius:18px;font:700 16px/1 Cinzel,Georgia,serif;font-variant:small-caps;letter-spacing:.08em;color:#fff;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 42%) padding-box,linear-gradient(180deg,#2b0d1f,#1a0714 60%,#12040e) padding-box,conic-gradient(from var(--a),#ff4d79,#f6c8a8,#e9e6f2,#b36bff,#ff4d79) border-box;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 12px 30px -12px rgba(255,77,121,.6),0 0 24px -6px rgba(179,107,255,.45);animation:spin 6s linear infinite}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(234,220,245,.4) 50%,transparent 70%);transform:translateX(-120%);animation:shine 4.5s 1.2s ease-in-out infinite;pointer-events:none}
.go:disabled{cursor:default;color:rgba(220,197,238,.6);animation:none;box-shadow:none;background:linear-gradient(160deg,#3a1248,#24092f 55%,#2e0a24) padding-box,linear-gradient(100deg,rgba(207,176,232,.25),rgba(207,176,232,.6) 50%,rgba(207,176,232,.25)) border-box}
.go:disabled::after{display:none}
.ca{padding:4px 8px;border-radius:8px;background:linear-gradient(145deg,#4a1a5e,#2a0d3a);border:1px solid rgba(207,176,232,.55);color:#d5b9eb;font-size:11px;letter-spacing:.18em}
.hint{margin-top:8px;text-align:center;font:italic 400 15px/1.3 'EB Garamond',Georgia,serif;color:rgba(213,185,235,.75)}
.seal{width:76px;height:76px;margin:6px auto 12px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#8b3fd1,#3a0f68 70%);box-shadow:0 0 0 6px rgba(139,63,209,.15),0 14px 40px -10px rgba(190,24,93,.6);font-size:34px;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
.toast{position:fixed;left:50%;bottom:24px;z-index:20;transform:translate(-50%,40px);opacity:0;transition:.3s;padding:12px 18px;border-radius:12px;background:linear-gradient(180deg,#f3ecff,#ddccfa);color:#2a0814;font:italic 400 16px/1.3 'EB Garamond',Georgia,serif;pointer-events:none}
.toast{white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.card b{font-size:14px}.card span{font-size:14px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="demo-sw" role="tablist" aria-label="Demo konusu"><small>DEMO KONU</small>
    <button data-t="consumer" class="on">Tüketici</button><button data-t="gov">Devlet işi</button><button data-t="serious">Ağır vaka</button>
  </div>
  <h1 id="h1">Şikayetin Hazır</h1>
  <p class="sub" id="sub"></p>
  <div class="power" id="power">
    <div class="ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34"/><circle id="pw-arc" cx="40" cy="40" r="34" pathLength="100"/></svg><strong id="pw-n">%20</strong></div>
    <div class="pw-t">
      <small>DAVA GÜCÜ</small>
      <b id="pw-w">Zayıf</b>
      <span id="pw-tip"></span>
    </div>
  </div>
  <div class="owed" id="owed"></div>
  <div class="safe" id="safe"><b>Yalnız değilsin.</b> Tehlikedeysen hemen <a href="tel:911">911</a>’i ara. Bu sayfada hiçbir şey sen onaylamadan gönderilmez.</div>
  <blockquote class="quote" id="quote">Geciken adalet, adalet değildir.<cite>W·E·GLADSTONE</cite></blockquote>

  <div class="grid">
    <button class="card" data-s="send"><svg viewBox="0 0 24 24"><path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/></svg><i class="n">I</i><i class="ok">✓</i>
      <div><b id="c-send-b">Şikayet Gönder</b><span id="c-send">Kontrol et, gönder</span></div></button>
    <button class="card main" data-s="rights"><i class="flag">BURADAN BAŞLA</i><svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 006 0zM19 7l-3 7a3 3 0 006 0zM8 21h8"/></svg><i class="n">II</i><i class="ok">✓</i>
      <div><b>Yasal Hakların</b><span id="c-rights"></span></div></button>
    <button class="card" data-s="inst"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-6 10 6z"/></svg><i class="n">III</i><i class="ok">✓</i>

      C.inst.forEach(function(i){
        var sub = i[0] === 'mp' ? (MP.name ? MP.name + ' · adresine göre bulundu' : 'Adresine göre bulunur') : i[2];
        h += '<button class="inst' + (S.inst[i[0]] ? ' on' : '') + '" data-k="' + i[0] + '"><span class="bx">✓</span><div><b>' + esc(i[1]) + '</b><small>' + esc(sub) + '</small></div>' + (i[3] ? '<em>' + i[3] + '</em>' : '') + '</button>';
      });
      if (!C.inst.some(function(i){ return i[0] === 'mp'; })) h += '<button class="go" data-go="mp" style="margin-top:4px">+ Milletvekilimi de ekle</button>';
      return ['Kurumlar', h + '<button class="go" data-go="send">Tamam</button>'];
    },
    letter: function(){
      var laws = C.rights.filter(function(r, i){ return S.read[i]; }).map(function(r){ return '<span class="law-c">' + esc(r[3]) + '</span>'; }).join(' ');
      return [C.game ? 'Mektubun' : 'Beyanın', '<div class="letter"><p>İlgili makama,</p><p><b>' + esc(C.who) + '</b> hakkında, ' + esc(C.topic.toLowerCase()) + ' konusunda başvuruyorum.</p><p>' + esc(C.what) + '</p>' + (laws ? '<p>' + laws + '</p>' : '') + '<p>' + esc(C.ask) + '</p><p>Saygılarımla,<br>— ComplaintCA ile gönderildi</p></div>' +
        (laws || !C.game ? '<button class="go" data-go="send">Güzel Olmuş</button>' : '<div class="warn">Bu mektubun henüz yasal dayanağı yok. II. karttan haklarını aç — her biri buraya bir kanun ekler.</div><button class="go" data-go="rights">Mektubuma Kanun Ekle</button>')];
    },
    lawyer: function(){
      return ['Ücretsiz Avukat', '<p class="p" style="margin-bottom:10px">Ücretsiz hukuk yardımı <em>nerede yaşadığına</em> göre değişir. Adresin:</p>' +
        '<div class="find"><input class="in" id="law-in" value="' + esc(ADDR) + '" placeholder="Posta kodu ya da adres"><button class="fbtn" id="do-law">Bul</button></div>' +
        '<div id="law-res"></div>' +
        '<div class="tg' + (S.lawyer ? ' on' : '') + '" id="tg-law"><div>Partner avukatlar da dosyamı görsün <em>(e-posta paylaşılmaz)</em></div><i></i></div>'];
    },
    mp: function(){
      var reps = mpReps();
      var body = MP.state === 'busy' ? '<p class="hint">Adresinden bulunuyor…</p>' :
        reps.length ? reps.map(function(x){ return mpRow(x.r, x.l[1]); }).join('') :
        '<p class="hint">' + (MP.state === 'err' ? 'Arama servisine ulaşılamadı.' : 'Temsilci bulunamadı.') + '</p><button class="go" id="do-mp">Tekrar Dene</button>';
      return ['Milletvekilin', '<p class="p" style="margin-bottom:10px">' + (C.mpRec ? 'Bu konuda milletvekili ofisleri <b>gerçekten işe yarıyor</b> — kurumla özel hattan konuşabilirler.' : 'Zorunlu değil. İstersen şikayetinin bir kopyası milletvekiline de gider; kurum üzerinde baskı oluşturur.') + '</p>' +
        '<p class="hint" style="margin:0 0 10px">📍 Adresine göre (' + esc(ADDR) + ') otomatik bulundu</p>' + body +
        (reps.length ? '<div class="tg' + (S.inst.mp ? ' on' : '') + '" id="tg-mp"><div>Şikayetimin bir kopyası milletvekilime de gitsin</div><i></i></div>' : '') +
        '<button class="go" data-go="send">Tamam</button>'];
    },
    help: function(){
      var h = '<p class="p" style="margin-bottom:12px">Ne yapacağına sen karar verirsin. Bu hatlar <b>gizli ve ücretsiz</b>; polise bildirmek zorunda değilsin.</p>';
      HELP.forEach(function(x){
        h += '<a class="inst res help" href="' + x[4] + '"' + (x[4].indexOf('http') === 0 ? ' target="_blank" rel="noopener"' : '') + '><span class="av">' + x[0] + '</span><div><b>' + esc(x[1]) + '</b><small>' + esc(x[2]) + '</small></div><em>' + esc(x[3]) + '</em></a>';
      });
      h += '<button class="ghost-x" id="quick-exit">⎋ Hızlı çıkış</button>';
      return ['Hemen Yardım Al', h];
    }
  };

  var cur = '';
  function open(k){
    cur = k; var v = VIEWS[k]();
    $('sh-t').textContent = v[0]; $('sh-b').innerHTML = v[1];
    $('dim').classList.add('on'); $('sheet').classList.add('on'); $('sheet').scrollTop = 0;
    if (k === 'rights') prog();
    if (k === 'lawyer') findLaw();
  }
  function close(){ $('dim').classList.remove('on'); $('sheet').classList.remove('on'); cur = ''; refresh(); }
  function prog(){ var p = $('prog'); if (p) p.style.width = (Object.keys(S.read).length / C.rights.length * 100) + '%'; }

  function findLaw(){
    var pv = provOf($('law-in').value.trim()); S.lawProv = pv;
    var list = (C.card6 === 'help' && pv === 'ON' ? [ILA] : []).concat(LAW[pv]);
    var h = '<p class="hint" style="margin:12px 0 8px"><em>' + PROV_N[pv] + '</em> için ücretsiz seçenekler</p>';
    list.forEach(function(l){
      h += '<a class="inst res" href="' + l[3] + '" target="_blank" rel="noopener"><span class="av">⚖</span><div><b>' + esc(l[0]) + '</b><small>' + esc(l[1]) + '</small></div><em>' + l[2] + '</em></a>';
    });
    $('law-res').innerHTML = h; refresh();
  }
  // MP is looked up automatically from the user's own address, in the background.
  function autoMp(){
    var m = ADDR.match(PC_RE); if (!m) return;
    MP.state = 'busy'; refresh();
    fetch('https://represent.opennorth.ca/postcodes/' + (m[1] + m[2]).toUpperCase() + '/')
      .then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(function(d){
        MP.list = (d.representatives_concordance && d.representatives_concordance.length) ? d.representatives_concordance : (d.representatives_centroid || []);
        var f = mpReps()[0]; MP.name = f ? f.r.name : ''; MP.state = 'ok';
      })
      .catch(function(){ MP.state = 'err'; })
      .then(function(){ refresh(); if (cur === 'mp' || cur === 'inst') open(cur); });
  }

  document.querySelectorAll('.card').forEach(function(c){ c.onclick = function(){ open(c.dataset.s); }; });
  document.querySelectorAll('.demo-sw button').forEach(function(b){ b.onclick = function(){ setTopic(b.dataset.t); }; });
  $('dim').onclick = close; $('sh-x').onclick = close;
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && cur) close(); });

  $('sh-b').addEventListener('toggle', function(e){
    var d = e.target; if (!d.open || d.dataset.i == null) return;
    var fresh = !S.read[d.dataset.i]; S.read[d.dataset.i] = 1;
    d.querySelector('summary i').textContent = '✓';
    if (fresh){ d.querySelector('.cited').hidden = false; if (C.game) toast('Kanun eklendi · Dava gücü %' + strength()); }
    prog(); refresh();
  }, true);
  $('sh-b').addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target.id === 'law-in') findLaw(); });
  $('sh-b').addEventListener('click', function(e){
    var t = e.target.closest('button,.tg'); if (!t) return;
    if (t.dataset.go){ open(t.dataset.go); return; }
    if (t.dataset.k){ S.inst[t.dataset.k] ? delete S.inst[t.dataset.k] : S.inst[t.dataset.k] = 1; t.classList.toggle('on'); refresh(); return; }
    if (t.id === 'tg-mp'){
      if (!C.inst.some(function(i){ return i[0] === 'mp'; })) C.inst.push(['mp', 'Milletvekilin', '', 'İSTEĞE BAĞLI', false]);
      S.inst.mp ? delete S.inst.mp : S.inst.mp = 1; t.classList.toggle('on'); refresh(); return;
    }
    if (t.id === 'tg-law'){ S.lawyer = !S.lawyer; t.classList.toggle('on'); refresh(); return; }
    if (t.id === 'tg-not'){ S.notify = !S.notify; t.classList.toggle('on'); return; }
    if (t.id === 'do-law'){ findLaw(); return; }
    if (t.id === 'do-mp'){ autoMp(); open('mp'); return; }
    if (t.id === 'quick-exit'){ location.replace('https://www.google.com/search?q=weather'); return; }
    if (t.id === 'do-copy'){ try { navigator.clipboard.writeText(S.ref).then(function(){ toast('Kopyalandı: ' + S.ref); }, function(){ toast(S.ref); }); } catch (x) { toast(S.ref); } return; }
    if (t.id === 'do-send'){
      t.disabled = true; t.firstChild.textContent = 'Gönderiliyor… ';
      setTimeout(function(){
        S.sent = true; S.ref = 'VC-2026-' + Math.random().toString(36).slice(2, 8).toUpperCase();
        refresh(); open('send');
      }, 900);
    }
  });
  setTopic('consumer');
  autoMp();
})();
</script>
</body>
</html>
