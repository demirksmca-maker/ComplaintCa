<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>Blog | Dias Panel</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:64px 16px 40px;background:#160d28;color:#eee;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:640px;margin:0 auto}
  h1{font-size:1.3rem;margin:0 0 4px}
  .sub{color:#9a8fb0;font-size:.9rem;margin:0 0 20px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid #2e2347;border-radius:12px;background:#1a1426}
  .t b{display:block}
  .t span{color:#9a8fb0;font-size:.85rem}
  button{flex:none;padding:8px 12px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
  button:active{opacity:.8}
  #msg{min-height:1.4em;margin-top:14px;color:#a7f3d0;font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Blog</h1>
  <p class="sub">Konunun yanındaki butona bas: metin kopyalanır, Claude Code açılır.</p>
  <ul id="list"></ul>
  <p id="msg" role="status"></p>
</main>
<script>
(function () {
  // Blog topics: [title, note, text sent to Claude].
  var TODO = [
    ["Şiddet sonrası haklar rehberi", "ES + Kanada, kadınlar için", "Yeni blog konusu: şiddet gören kadınlar için \"şiddet sonrası haklar\" rehberi. İspanya (es/blog/) ve Kanada (blog/) için birer yazı. Odak acil yardım değil, sonraki bürokrasi: ücretsiz avukat, koruma kararı, polis veya kurum ilgilenmezse şikayet, kira sözleşmesini bozma, banka hesabını ayırma. En üstte 016 (ES) / 911 (Kanada) kutusu ve sayfada \"hızlı çıkış\" butonu olsun. Mevcut blog formatını kullan (kısa cevap, toc, SSS + FAQPage). Kural: bilgiyi resmi kaynaktan doğrula; doğrulayamadığını yazma. Önce taslağı bana göster, onaylarsam AXX1/AXX2, node --test, /code-review, sonra main'e birleştir."]
  ];
  var list = document.getElementById('list'), msg = document.getElementById('msg');
  function copy(text) {
    var box = document.createElement('textarea');
    box.value = text; box.style.position = 'fixed'; box.style.opacity = '0';
    document.body.appendChild(box); box.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { /* not supported */ }
    box.remove();
    return ok;
  }
  TODO.forEach(function (j) {
    var li = document.createElement('li'), t = document.createElement('div'), b = document.createElement('button');
    t.className = 't';
    var h = document.createElement('b'); h.textContent = j[0];
    var s = document.createElement('span'); s.textContent = j[1];
    t.appendChild(h); t.appendChild(s);
    b.type = 'button'; b.textContent = 'Claude\'a gönder';
    b.addEventListener('click', function () {
      var ok = copy('Dias Panel > Blog üzerinden gönderdiğim konu:\n' + j[2]);
      var w = window.open('https://claude.ai/code', '_blank');
      if (w) w.opener = null;
      msg.textContent = ok ? 'Panoya kopyalandı; Claude Code\'da yapıştırıp gönder.' : 'Kopyalanamadı.';
    });
    li.appendChild(t); li.appendChild(b); list.appendChild(li);
  });
})();
</script>
</body>
</html>
