<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kalkan Paneli</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#16202c;--mute:#5f6b7a;--line:#e3e7ec;--ok:#1f8a4c;--bad:#c4372f;--accent:#1d5fd1;--bar:#1d5fd1;--bar2:#e0a020}
  @media (prefers-color-scheme:dark){:root{--bg:#0f141a;--card:#171e27;--ink:#e6ebf1;--mute:#93a0b0;--line:#26303c;--ok:#4cc27e;--bad:#ff6b61;--accent:#6ea2ff;--bar:#6ea2ff;--bar2:#f2bd4b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,Inter,sans-serif;line-height:1.5}
  main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:1.4rem;margin:0 0 4px}
  h2{font-size:1rem;margin:0 0 12px}
  .sub{color:var(--mute);font-size:.9rem;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .stat b{display:block;font-size:1.8rem;line-height:1.1}
  .stat span{color:var(--mute);font-size:.85rem}
  .bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:4px;overflow:hidden;min-height:2px;background:var(--line)}
  .stack i{display:block}
  .day small{color:var(--mute);font-size:.7rem}
  .legend{display:flex;gap:14px;font-size:.8rem;color:var(--mute);margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .note{border-top:1px solid var(--line);padding:12px 0}
  .note:first-of-type{border-top:0;padding-top:0}
  .note time{color:var(--mute);font-size:.8rem}
  .note p{margin:4px 0}
  .ban{color:var(--bad);font-size:.85rem;margin:2px 0;word-break:break-all}
  .quiet{color:var(--ok)}
  .ev{font-size:.82rem;color:var(--mute);padding:4px 0;border-top:1px solid var(--line);word-break:break-all}
  .ev b{color:var(--ink)}
  form{display:flex;gap:8px;flex-wrap:wrap}
  input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1rem}
  button{padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:1rem;cursor:pointer}
  .link{background:none;color:var(--mute);padding:0;font-size:.85rem;text-decoration:underline}
  .err{color:var(--bad)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>🛡️ Kalkan Paneli</h1>
  <p class="sub" id="status">complaintca.ca koruma ve ziyaretçi durumu</p>

  <section class="card" id="login" hidden>
    <h2>Giriş</h2>
    <form id="loginForm">
      <input id="key" type="password" placeholder="Kalkan anahtarı" autocomplete="current-password" required>
      <button type="submit">Aç</button>
    </form>
    <p class="err" id="loginErr" hidden></p>
  </section>

  <div id="app" hidden>
    <section class="card">
      <h2>Bugün</h2>
      <div class="stats">
        <div class="stat"><b id="caToday">–</b><span>Kanada ziyaretçi</span></div>
        <div class="stat"><b id="esToday">–</b><span>İspanya ziyaretçi</span></div>
        <div class="stat"><b id="viewsToday">–</b><span>Sayfa görüntüleme</span></div>
        <div class="stat"><b id="blockedToday">–</b><span>Engellenen saldırı</span></div>
      </div>
    </section>

    <section class="card">
      <h2>Son 7 gün ziyaretçi</h2>
      <div class="bars" id="bars"></div>
      <div class="legend"><span><i style="background:var(--bar)"></i>Kanada</span><span><i style="background:var(--bar2)"></i>İspanya</span></div>
    </section>

    <section class="card">
      <h2>Ajan bildirimleri</h2>
      <div id="reports"></div>
    </section>

    <section class="card">
      <h2>Son engellenenler</h2>
      <div id="events"></div>
    </section>

    <button class="link" id="logout" type="button">Çıkış</button>
  </div>
</main>
<script>
(function () {
  var KEY = 'shieldKey';
  var AGENTS = { probe: 'Gizli dosya denemesi', inject: 'Zararlı kod', scanner: 'Saldırı aracı', flood: 'Aşırı istek', ban: 'Banlı IP', 'suspect-rate': 'Şüpheli hız', 'suspect-noua': 'Kimliksiz istek' };
  var $ = function (id) { return document.getElementById(id); };
  function getKey() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setKey(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function when(t) { return new Date(t).toLocaleString('tr-TR', { timeZone: 'America/Toronto', dateStyle: 'short', timeStyle: 'short' }); }

  function showLogin(msg) {
    $('app').hidden = true; $('login').hidden = false;
    $('loginErr').hidden = !msg; $('loginErr').textContent = msg || '';
  }

  function render(d) {
    var today = d.visits[0];
    $('caToday').textContent = today.ca.visitors;
    $('esToday').textContent = today.es.visitors;
    $('viewsToday').textContent = today.ca.views + today.es.views;
    var start = new Date(); start.setHours(0, 0, 0, 0);
    $('blockedToday').textContent = d.events.filter(function (e) { return e.t >= start.getTime() && AGENTS[e.agent] && e.agent.indexOf('suspect') !== 0; }).length + (d.events.length >= 50 ? '+' : '');

    var max = Math.max.apply(null, d.visits.map(function (v) { return v.ca.visitors + v.es.visitors; }).concat(1));
    $('bars').innerHTML = d.visits.slice().reverse().map(function (v) {
      var tot = v.ca.visitors + v.es.visitors;
      return '<div class="day" title="' + esc(v.day + ': Kanada ' + v.ca.visitors + ', İspanya ' + v.es.visitors) + '">' +
        '<small>' + tot + '</small>' +
        '<div class="stack" style="height:' + Math.max(2, Math.round(tot / max * 80)) + '%">' +
        '<i style="flex:' + v.ca.visitors + ';background:var(--bar)"></i><i style="flex:' + v.es.visitors + ';background:var(--bar2)"></i></div>' +
        '<small>' + esc(v.day.slice(5)) + '</small></div>';
    }).join('');

    $('reports').innerHTML = d.reports.length ? d.reports.map(function (r) {
      return '<div class="note"><time>' + esc(when(r.t)) + ' · ' + esc(r.events) + ' kayıt</time>' +
        '<p class="' + (r.bans && r.bans.length ? '' : 'quiet') + '">' + esc(r.summary) + '</p>' +
        (r.bans || []).map(function (b) { return '<div class="ban">⛔ ' + esc(b.ip) + ' · ' + esc(b.hours) + ' saat · ' + esc(b.reason) + '</div>'; }).join('') +
        '</div>';
    }).join('') : '<p class="quiet">Henüz bildirim yok. Site sakin.</p>';

    $('events').innerHTML = d.events.length ? d.events.slice(0, 20).map(function (e) {
      return '<div class="ev"><b>' + esc(AGENTS[e.agent] || e.agent) + '</b> · ' + esc(when(e.t)) + ' · ' + esc(e.ip) + ' · ' + esc(e.path) + '</div>';
    }).join('') : '<p class="quiet">Engellenen istek yok.</p>';

    $('status').textContent = 'Son güncelleme: ' + new Date().toLocaleTimeString('tr-TR');
  }

  function load() {
    var key = getKey();
    if (!key) return showLogin();
    fetch('/api/shield', { headers: { 'x-shield-key': key }, cache: 'no-store' }).then(function (r) {
      if (r.status === 403) { setKey(''); throw new Error('Anahtar yanlış.'); }
      if (r.status === 429) throw new Error('Çok fazla deneme, biraz bekle.');
      if (r.status === 503) throw new Error('Sunucuda SHIELD_KEY veya Upstash ayarı eksik.');
      if (!r.ok) throw new Error('Veri alınamadı (' + r.status + ').');
      return r.json();
    }).then(function (d) {
      $('login').hidden = true; $('app').hidden = false; render(d);
    }).catch(function (e) {
      if (!getKey()) showLogin(e.message); else $('status').textContent = e.message;
    });
  }

  $('loginForm').addEventListener('submit', function (ev) { ev.preventDefault(); setKey($('key').value.trim()); load(); });
  $('logout').addEventListener('click', function () { setKey(''); showLogin(); });
  load();
  setInterval(function () { if (!document.hidden && getKey()) load(); }, 60000);
})();
</script>
</body>
</html>
