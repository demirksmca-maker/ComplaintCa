<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kalkan Paneli</title>
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/shield-manifest.json">
<meta name="theme-color" content="#070d14">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalkan">
<style>
  /* One screen, no page scroll: header, 2x2 tiles, lock, then one tabbed
     panel that scrolls inside itself. Always dark, one accent colour. */
  :root{color-scheme:dark;--bg:#070d14;--card:#0d1621;--ink:#e6eef6;--mute:#7f93a8;--line:#1a2633;--ok:#3ddc97;--bad:#ff5a52;--accent:#4c9bff;--bar2:#f2bd4b;--glow:var(--ok)}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,Inter,sans-serif;line-height:1.4;overflow:hidden}
  main{height:100dvh;max-width:480px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  [hidden]{display:none!important}
  button{font:inherit;border:0;border-radius:10px;cursor:pointer}

  /* Header: small 3D shield, title, live state */
  .head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding-top:4px}
  .head.warn{--glow:var(--bar2)}.head.alert{--glow:var(--bad)}
  .stage{position:relative;width:76px;height:86px;perspective:500px}
  .ring{position:absolute;left:50%;top:62%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:1.5px solid var(--glow);opacity:0;transform:rotateX(72deg) scale(.4);animation:ring 3s ease-out infinite}
  .ring+.ring{animation-delay:1.5s}
  @keyframes ring{0%{opacity:.6;transform:rotateX(72deg) scale(.4)}100%{opacity:0;transform:rotateX(72deg) scale(1.5)}}
  .shield3d{position:absolute;inset:0;transform-style:preserve-3d;animation:sway 7s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotateY(-26deg)}50%{transform:rotateY(26deg) translateY(-3px)}}
  .shield3d svg{position:absolute;inset:0;width:100%;height:100%}
  .shield3d .side path{fill:#1b3047}
  .shield3d .front{filter:drop-shadow(0 0 10px var(--glow))}
  h1{font-size:1.15rem;font-weight:600;letter-spacing:.3px}
  .state{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--mute)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow)}

  /* 2x2 tiles, identical size */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:12px;text-align:center}
  .tile b{display:block;font-size:1.6rem;font-weight:600;line-height:1.1}
  .tile span{font-size:.72rem;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}

  /* Lock: one full-width toggle */
  .lock{width:100%;padding:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);display:flex;justify-content:center;align-items:center;gap:8px;font-size:.9rem}
  .lock.on{border-color:var(--bad);color:var(--bad)}

  /* Tabbed panel fills the rest and scrolls inside */
  .panel{flex:1;min-height:0;display:flex;flex-direction:column}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  .tabs button{background:none;color:var(--mute);padding:10px 0;border-radius:0;font-size:.82rem;border-bottom:2px solid transparent}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .view{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
  .row{padding:9px 0;border-top:1px solid var(--line);font-size:.82rem}
  .row:first-child{border-top:0;padding-top:0}
  .row time{display:block;color:var(--mute);font-size:.72rem;margin-bottom:2px}
  .row .hit{color:var(--bad);word-break:break-all}
  .row a{color:var(--accent)}
  .quiet{color:var(--ok);font-size:.85rem;text-align:center;padding:20px 0}
  .muted{color:var(--mute);word-break:break-all}

  .bars{display:flex;align-items:flex-end;gap:8px;height:150px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
  .stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:4px;overflow:hidden;min-height:2px;background:var(--line)}
  .day small{color:var(--mute);font-size:.68rem}
  .legend{display:flex;justify-content:center;gap:16px;font-size:.72rem;color:var(--mute);margin-top:10px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

  .foot{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--mute)}
  .foot button{background:none;color:var(--mute);padding:0;text-decoration:underline;font-size:.72rem}
  .install{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;font-size:.8rem}
  .install button{background:var(--accent);color:#fff;padding:7px 12px;font-size:.8rem}

  /* Login: centred card */
  .login{margin:auto 0;padding:20px;display:flex;flex-direction:column;gap:10px;text-align:center}
  .login input{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem;text-align:center}
  .login button{padding:12px;background:var(--accent);color:#fff}
  .err{color:var(--bad);font-size:.85rem}

  /* Where visitors come from: 5 search engines, 5 social networks (icons:
     Simple Icons, CC0; Bing and Yahoo from the Brandfetch logo CDN) */
  .sources{border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:10px}
  .sources h3{font-size:.68rem;font-weight:500;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;text-align:center;margin-bottom:6px}
  .brands{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
  .brand i{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin:0 auto 4px;border-radius:50%;background:#fff}
  .brand svg,.brand img{width:20px;height:20px}
  .brand img{position:absolute;inset:7px;border-radius:4px}
  .brand em{font-style:normal;font-weight:800;font-size:1.05rem}
  .brand b{display:block;font-size:.9rem;font-weight:600;line-height:1}
  .brand small{font-size:.62rem;color:var(--mute)}
  @media (prefers-reduced-motion:reduce){.ring,.shield3d{animation:none}.shield3d{transform:rotateY(-18deg)}}
</style>
</head>
<body>
<main>
  <header class="head" id="hero">
    <div class="stage" aria-hidden="true">
      <div class="ring"></div><div class="ring"></div>
      <div class="shield3d" id="shield3d"></div>
    </div>
    <h1>Kalkan Paneli</h1>
    <div class="state"><span class="dot"></span><span id="heroState">complaintca.ca</span></div>
  </header>

  <section class="card login" id="login" hidden>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:10px">
      <input id="key" type="password" placeholder="Şifre" autocomplete="current-password" required>
      <button type="submit">Aç</button>
    </form>
    <p class="err" id="loginErr" hidden></p>
  </section>

  <section class="card install" id="install" hidden>
    <span id="installText">Telefona uygulama olarak ekle</span>
    <button type="button" id="installBtn">Ekle</button>
  </section>

  <div id="app" hidden style="display:contents">
    <section class="tiles">
      <div class="card tile"><b id="caToday">–</b><span>Kanada</span></div>
      <div class="card tile"><b id="esToday">–</b><span>İspanya</span></div>
      <div class="card tile"><b id="viewsToday">–</b><span>Görüntüleme</span></div>
      <div class="card tile"><b id="blockedToday">–</b><span>Engellenen</span></div>
    </section>

    <button type="button" class="lock" id="lock">🔓 Acil kilit kapalı · dokun, 1 saat kilitle</button>

    <section class="card panel">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-view="reports">Bildirimler</button>
        <button type="button" role="tab" aria-selected="false" data-view="events">Engellenen</button>
        <button type="button" role="tab" aria-selected="false" data-view="week">7 gün</button>
      </div>
      <div class="view" id="reports"></div>
      <div class="view" id="events" hidden></div>
      <div class="view" id="week" hidden>
        <div class="bars" id="bars"></div>
        <div class="legend"><span><i style="background:var(--accent)"></i>Kanada</span><span><i style="background:var(--bar2)"></i>İspanya</span></div>
      </div>
      <div class="sources">
        <div><h3>Arama motorundan gelen · bugün</h3><div class="brands" id="search"></div></div>
        <div><h3>Sosyal medyadan gelen · bugün</h3><div class="brands" id="socials"></div></div>
      </div>
    </section>

    <div class="foot"><span id="status">–</span><button type="button" id="logout">Çıkış</button></div>
  </div>
</main>

739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 12.0077"}, "x": {"t": "X", "hex": "000000", "p": "M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z"}, "tiktok": {"t": "TikTok", "hex": "000000", "p": "M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"}, "youtube": {"t": "YouTube", "hex": "FF0000", "p": "M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"}, "bing": {"t": "Bing", "img": "https://cdn.brandfetch.io/bing.com/w/64/h/64/theme/dark/fallback/lettermark?c=1id2mGA3D4RA9NnquvO", "hex": "0078D4", "l": "b"}, "yahoo": {"t": "Yahoo", "img": "https://cdn.brandfetch.io/yahoo.com/w/64/h/64/theme/dark/fallback/lettermark?c=1id2mGA3D4RA9NnquvO", "hex": "6001D2", "l": "Y"}};
  var SEARCH = ['google', 'bing', 'duckduckgo', 'yahoo', 'ecosia'];
  var SOCIALS = ['facebook', 'instagram', 'x', 'tiktok', 'youtube'];
  function brands(keys, counts) {
    var total = keys.reduce(function (n, k) { return n + (Number(counts[k]) || 0); }, 0);
    return keys.map(function (k) {
      var n = Number(counts[k]) || 0, ic = ICONS[k];
      // Logos missing from the free icon set load from Brandfetch; if that
      // fails the brand letter stays visible underneath.
      var mark = ic.img ? '<em style="color:#' + ic.hex + '">' + esc(ic.l) + '</em><img src="' + esc(ic.img) + '" alt="" onerror="this.remove()">'
        : '<svg viewBox="0 0 24 24" fill="#' + ic.hex + '"><path d="' + ic.p + '"/></svg>';
      return '<div class="brand" title="' + esc(ic.t) + '"><i>' + mark + '</i>' +
        '<b>' + n + '</b><small>' + (total ? Math.round(n / total * 100) : 0) + '%</small></div>';
    }).join('');
  }

  // 3D shield: 10 dark layers for thickness, then the lit front.
  (function () {
    var P = 'M75 8 L132 30 V82 C132 120 106 146 75 160 C44 146 18 120 18 82 V30 Z';
    var html = '';
    for (var i = 0; i < 10; i++) html += '<svg class="side" viewBox="0 0 150 170" style="transform:translateZ(' + (i * 1.2 - 12) + 'px)"><path d="' + P + '"/></svg>';
    html += '<svg class="front" viewBox="0 0 150 170"><defs>' +
      '<linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fb6ff"/><stop offset=".5" stop-color="#1d5fd1"/><stop offset="1" stop-color="#0b2a5c"/></linearGradient></defs>' +
      '<path d="' + P + '" fill="url(#sg)" stroke="var(--glow)" stroke-width="4"/>' +
      '<path d="M52 84 L68 100 L100 64" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    $('shield3d').innerHTML = html;
  })();

  function showTab(name) {
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      var on = b.getAttribute('data-view') === name;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      $(b.getAttribute('data-view')).hidden = !on;
    });
    store(TAB, name);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
    b.addEventListener('click', function () { showTab(b.getAttribute('data-view')); });
  });

  function showLogin(msg) {
    $('app').hidden = true; $('login').hidden = false;
    $('loginErr').hidden = !msg; $('loginErr').textContent = msg || '';
    $('heroState').textContent = 'complaintca.ca';
  }

  function render(d) {
    var today = d.visits[0];
    $('caToday').textContent = today.ca.visitors;
    $('esToday').textContent = today.es.visitors;
    $('viewsToday').textContent = today.ca.views + today.es.views;
    var start = new Date(); start.setHours(0, 0, 0, 0);
    $('blockedToday').textContent = d.events.filter(function (e) { return e.t >= start.getTime() && AGENTS[e.agent] && e.agent.indexOf('suspect') !== 0; }).length + (d.events.length >= 50 ? '+' : '');

    $('reports').innerHTML = d.reports.length ? d.reports.map(function (r) {
      return '<div class="row"><time>' + esc(when(r.t)) + ' · ' + (r.kind === 'copy' ? 'Kopya avcısı' : esc(r.events) + ' kayıt') + '</time>' +
        esc(r.summary) +
        (r.copies || []).map(function (c) { return '<div class="hit">📄 ' + esc(c.url) + ' ← ' + esc(c.source.replace(/^https?:\/\/[^/]+/, '')) + '</div>'; }).join('') +
        (r.copies && r.copies.length ? '<div><a href="https://reportcontent.google.com/forms/dmca_search" target="_blank" rel="noopener">Google\'dan kaldırt</a></div>' : '') +
        (r.lockdownHours ? '<div class="hit">🔒 Acil kilit ' + esc(r.lockdownHours) + ' saat</div>' : '') +
        (r.bans || []).map(function (b) { return '<div class="hit">⛔ ' + esc(b.ip) + ' · ' + esc(b.hours) + ' saat · ' + esc(b.reason) + '</div>'; }).join('') +
        '</div>';
    }).join('') : '<p class="quiet">Bildirim yok · site sakin</p>';

    $('events').innerHTML = d.events.length ? d.events.slice(0, 30).map(function (e) {
      return '<div class="row"><time>' + esc(when(e.t)) + '</time><b>' + esc(AGENTS[e.agent] || e.agent) + '</b> <span class="muted">· ' + esc(e.ip) + ' · ' + esc(e.path) + '</span></div>';
    }).join('') : '<p class="quiet">Engellenen istek yok</p>';

    var max = Math.max.apply(null, d.visits.map(function (v) { return v.ca.visitors + v.es.visitors; }).concat(1));
    $('bars').innerHTML = d.visits.slice().reverse().map(function (v) {
      var tot = v.ca.visitors + v.es.visitors;
      return '<div class="day"><small>' + tot + '</small>' +
        '<div class="stack" style="height:' + Math.max(2, Math.round(tot / max * 78)) + '%">' +
        '<i style="flex:' + v.ca.visitors + ';background:var(--accent)"></i><i style="flex:' + v.es.visitors + ';background:var(--bar2)"></i></div>' +
        '<small>' + esc(v.day.slice(8)) + '</small></div>';
    }).join('');

    $('search').innerHTML = brands(SEARCH, d.search || {});
    $('socials').innerHTML = brands(SOCIALS, d.socials || {});

    lockMin = Math.ceil((d.lockdown || 0) / 60);
    $('lock').className = 'lock' + (lockMin ? ' on' : '');
    $('lock').textContent = lockMin ? '🔒 Acil kilit açık · ' + lockMin + ' dk · dokun, kaldır' : '🔓 Acil kilit kapalı · dokun, 1 saat kilitle';

    var hit = d.events.filter(function (e) { return e.t >= Date.now() - 3600000 && e.agent.indexOf('suspect') !== 0; }).length;
    $('hero').className = 'head' + (lockMin ? ' alert' : hit ? ' warn' : '');
    $('heroState').textContent = lockMin ? 'Acil kilit açık' : hit ? 'Son 1 saatte ' + hit + ' saldırı engellendi' : 'Kalkan aktif · her şey sakin';
    $('status').textContent = 'Güncellendi ' + new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  }

  function load() {
    var key = getKey();
    if (!key) return showLogin();
    fetch('/api/shield', { headers: { 'x-shield-key': key }, cache: 'no-store' }).then(function (r) {
      if (r.status === 403) { setKey(''); throw new Error('Şifre yanlış.'); }
      if (r.status === 429) throw new Error('Çok fazla yanlış deneme, 10 dk bekle.');
      if (r.status === 503) throw new Error('Sunucu ayarı eksik.');
      if (!r.ok) throw new Error('Veri alınamadı (' + r.status + ').');
      return r.json();
    }).then(function (d) {
      $('login').hidden = true; $('app').hidden = false; render(d);
    }).catch(function (e) {
      if (!getKey()) showLogin(e.message); else $('status').textContent = e.message;
    });
  }

  $('lock').addEventListener('click', function () {
    var hours = lockMin ? 0 : 1;
    if (hours && !confirm('Acil kilit 1 saatliğine açılsın mı?')) return;
    fetch('/api/shield', { method: 'POST', headers: { 'x-shield-key': getKey(), 'Content-Type': 'application/json' }, body: JSON.stringify({ lockdownHours: hours }) })
      .then(function (r) { if (!r.ok) throw new Error('Kilit değiştirilemedi (' + r.status + ').'); load(); })
      .catch(function (e) { $('status').textContent = e.message; });
  });

  // Phone app: Android/Chrome offers an install prompt; iPhone needs Share → Add to Home Screen.
  var promptEvent = null;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); promptEvent = e; if (!standalone) $('install').hidden = false; });
  if (!standalone && /iPhone|iPad/.test(navigator.userAgent)) {
    $('install').hidden = false; $('installBtn').hidden = true;
    $('installText').textContent = 'Uygulama için: Paylaş → Ana Ekrana Ekle';
  }
  $('installBtn').addEventListener('click', function () {
    if (!promptEvent) return;
    promptEvent.prompt();
    promptEvent.userChoice.then(function () { $('install').hidden = true; promptEvent = null; });
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});

  $('loginForm').addEventListener('submit', function (ev) { ev.preventDefault(); setKey($('key').value.trim()); load(); });
  $('logout').addEventListener('click', function () { setKey(''); showLogin(); });
  showTab(store(TAB) || 'reports');
  load();
  setInterval(function () { if (!document.hidden && getKey()) load(); }, 60000);
})();
</script>
